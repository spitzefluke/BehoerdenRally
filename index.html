<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Behördenrallye</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Special+Elite&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600;8..60,700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#F2EAD9;
    --paper-dark:#E6D9BE;
    --paper-line:#CBBE9C;
    --ink:#2B2620;
    --ink-soft:#5C5548;
    --stamp:#A3311F;
    --stamp-dark:#7E2417;
    --carbon:#2F4858;
    --gold:#B08B3D;
    --locked:#B7AF9C;
    --ok:#3E6B4F;
    --card-shadow: 0 2px 0 rgba(43,38,32,0.08), 0 10px 24px -12px rgba(43,38,32,0.35);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      radial-gradient(circle at 15% 8%, rgba(176,139,61,0.07), transparent 40%),
      radial-gradient(circle at 90% 85%, rgba(47,72,88,0.07), transparent 45%),
      var(--paper);
    color:var(--ink);
    font-family:'Source Serif 4', Georgia, serif;
    min-height:100vh;
    -webkit-font-smoothing:antialiased;
  }
  #app{max-width:720px;margin:0 auto;padding:20px 16px 80px;}
  .eyebrow{
    font-family:'IBM Plex Mono',monospace;
    font-size:11px;
    letter-spacing:.14em;
    text-transform:uppercase;
    color:var(--ink-soft);
  }
  h1,h2,h3{
    font-family:'Special Elite', 'Courier New', monospace;
    font-weight:400;
    letter-spacing:.01em;
    margin:0 0 6px;
  }
  h1{font-size:clamp(28px,6vw,40px); line-height:1.15;}
  h2{font-size:22px;}
  p{line-height:1.55; color:var(--ink);}
  .muted{color:var(--ink-soft);}
  a, button{font-family:inherit;}
  button{cursor:pointer;}
  .btn{
    font-family:'IBM Plex Mono',monospace;
    font-size:13px;
    letter-spacing:.05em;
    text-transform:uppercase;
    border:1.5px solid var(--ink);
    background:transparent;
    color:var(--ink);
    padding:12px 20px;
    border-radius:2px;
    transition:transform .12s ease, background .12s ease, color .12s ease;
  }
  .btn:hover{background:var(--ink); color:var(--paper);}
  .btn:active{transform:scale(.97);}
  .btn:disabled{opacity:.35; cursor:not-allowed; pointer-events:none;}
  .btn-primary{
    background:var(--stamp); border-color:var(--stamp); color:var(--paper);
  }
  .btn-primary:hover{background:var(--stamp-dark); border-color:var(--stamp-dark); color:var(--paper);}
  .btn-ghost{border-color:var(--paper-line); color:var(--ink-soft);}
  .btn-ghost:hover{background:var(--ink-soft); border-color:var(--ink-soft);}

  /* ---------- header / masthead ---------- */
  .masthead{
    border-bottom:3px double var(--ink);
    padding-bottom:14px;
    margin-bottom:22px;
    display:flex; align-items:flex-end; justify-content:space-between; gap:12px; flex-wrap:wrap;
  }
  .masthead .stamp-icon{font-size:26px;}
  .masthead-title{display:flex; align-items:center; gap:10px;}
  .masthead-meta{
    font-family:'IBM Plex Mono',monospace;
    font-size:11px; color:var(--ink-soft); text-align:right; line-height:1.6;
  }

  /* ---------- intro ---------- */
  .intro-card{
    background:var(--paper-dark);
    border:1px solid var(--paper-line);
    border-radius:3px;
    padding:26px 22px;
    box-shadow:var(--card-shadow);
    position:relative;
    overflow:hidden;
  }
  .intro-card::before{
    content:"";
    position:absolute; inset:8px;
    border:1px dashed var(--paper-line);
    pointer-events:none;
  }
  .field label{
    display:block; font-family:'IBM Plex Mono',monospace; font-size:11px;
    text-transform:uppercase; letter-spacing:.08em; color:var(--ink-soft); margin-bottom:6px;
  }
  input[type=text]{
    width:100%; font-family:'Source Serif 4', serif; font-size:17px;
    padding:11px 12px; border:1.5px solid var(--ink); border-radius:2px;
    background:var(--paper); color:var(--ink);
  }
  input[type=text]:focus{outline:2px solid var(--carbon); outline-offset:1px;}

  /* ---------- group grid ---------- */
  .group-grid{
    display:grid; grid-template-columns:repeat(auto-fill,minmax(210px,1fr));
    gap:14px; margin-top:18px;
  }
  .group-card{
    position:relative;
    background:var(--paper-dark);
    border:1px solid var(--paper-line);
    border-radius:3px 3px 3px 3px;
    padding:16px 14px 14px;
    text-align:left;
    box-shadow:var(--card-shadow);
    transition:transform .12s ease, box-shadow .12s ease;
  }
  .group-card::before{
    content:"";
    position:absolute; top:-8px; left:16px; width:46px; height:14px;
    background:var(--paper-dark); border:1px solid var(--paper-line); border-bottom:none;
    border-radius:3px 3px 0 0;
  }
  .group-card:not(.full):hover{transform:translateY(-2px); box-shadow:0 4px 0 rgba(43,38,32,0.1), 0 16px 28px -14px rgba(43,38,32,0.4);}
  .group-card button.select-btn{
    width:100%; margin-top:12px;
  }
  .group-icon{font-size:22px;}
  .group-name{font-family:'IBM Plex Mono',monospace; font-weight:600; font-size:14.5px; margin-top:6px;}
  .capacity-row{display:flex; align-items:center; gap:8px; margin-top:10px;}
  .capacity-bar{flex:1; height:7px; background:var(--paper); border:1px solid var(--paper-line); border-radius:99px; overflow:hidden;}
  .capacity-fill{height:100%; background:var(--carbon);}
  .capacity-text{font-family:'IBM Plex Mono',monospace; font-size:11px; color:var(--ink-soft); white-space:nowrap;}
  .points-text{font-family:'IBM Plex Mono',monospace; font-size:11px; color:var(--gold); margin-top:4px;}
  .group-card.full{opacity:.55;}
  .full-stamp{
    position:absolute; top:10px; right:10px;
    border:2px solid var(--stamp); color:var(--stamp);
    font-family:'Special Elite',monospace; font-size:11px; letter-spacing:.08em;
    padding:2px 6px; border-radius:2px; transform:rotate(-8deg);
    opacity:.85;
  }

  /* ---------- laufzettel / map ---------- */
  .status-bar{
    display:flex; justify-content:space-between; align-items:center; gap:10px;
    background:var(--paper-dark); border:1px solid var(--paper-line); border-radius:3px;
    padding:12px 14px; margin-bottom:20px; flex-wrap:wrap;
  }
  .status-bar .who{font-family:'IBM Plex Mono',monospace; font-size:12.5px;}
  .status-bar .who b{color:var(--carbon);}
  .status-actions{display:flex; gap:8px; align-items:center;}

  .laufzettel{
    background:var(--paper-dark);
    border:1px solid var(--paper-line);
    border-radius:3px;
    padding:22px 18px 26px;
    position:relative;
    box-shadow:var(--card-shadow);
  }
  .laufzettel::before{
    content:"";
    position:absolute; inset:8px;
    border:1px dashed var(--paper-line);
    pointer-events:none;
  }
  .laufzettel-head{text-align:center; margin-bottom:6px;}
  .laufzettel-head .eyebrow{display:block; margin-bottom:2px;}

  .stage-list{margin-top:22px; position:relative; padding-left:0;}
  .stage-line{
    position:absolute; left:27px; top:8px; bottom:8px; width:2px;
    background:repeating-linear-gradient(to bottom, var(--paper-line) 0 6px, transparent 6px 12px);
  }
  .stage-item{
    display:flex; gap:14px; align-items:flex-start;
    padding:12px 6px; position:relative; border-radius:3px;
    background:transparent; border:none; width:100%; text-align:left;
  }
  .stage-node{
    flex:0 0 auto; width:56px; height:56px; border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    font-size:22px; position:relative; z-index:1;
    border:2px solid var(--locked); background:var(--paper);
    color:var(--locked);
  }
  .stage-item.done .stage-node{border-color:var(--ok); color:var(--ok); background:#e9f0ea;}
  .stage-item.current .stage-node{border-color:var(--stamp); color:var(--stamp); background:#f7e9e5; box-shadow:0 0 0 4px rgba(163,49,31,0.12);}
  .stage-item.locked .stage-node{opacity:.55;}
  .stage-info{padding-top:6px; flex:1;}
  .stage-title{font-family:'IBM Plex Mono',monospace; font-weight:600; font-size:14px;}
  .stage-amt{font-size:12px; color:var(--ink-soft); font-family:'IBM Plex Mono',monospace;}
  .stage-item.locked .stage-title, .stage-item.locked .stage-amt{color:var(--locked);}
  .stage-cta{margin-top:6px;}
  .checkmark{font-family:'Special Elite',monospace; font-size:11px; color:var(--ok);}

  button.stage-item{cursor:default;}
  button.stage-item.current{cursor:pointer;}
  button.stage-item.current:hover .stage-node{transform:scale(1.05);}

  /* ---------- leaderboard ---------- */
  .board{
    margin-top:22px;
    background:var(--paper-dark); border:1px solid var(--paper-line); border-radius:3px;
    padding:16px 16px 12px;
  }
  .board-row{
    display:grid; grid-template-columns:22px 1fr auto; gap:10px; align-items:center;
    padding:8px 0; border-bottom:1px solid var(--paper-line);
  }
  .board-row:last-child{border-bottom:none;}
  .board-rank{font-family:'IBM Plex Mono',monospace; color:var(--ink-soft); font-size:13px;}
  .board-name{font-family:'IBM Plex Mono',monospace; font-size:13.5px; display:flex; align-items:center; gap:6px;}
  .board-bar-wrap{grid-column:1/-1; height:6px; background:var(--paper); border-radius:99px; overflow:hidden; margin-top:2px;}
  .board-bar{height:100%; background:var(--gold);}
  .board-points{font-family:'IBM Plex Mono',monospace; font-weight:600; font-size:13.5px; color:var(--carbon);}
  .board-row.mine .board-name{color:var(--stamp);}

  /* ---------- quiz modal ---------- */
  .overlay{
    position:fixed; inset:0; background:rgba(43,38,32,0.55);
    display:flex; align-items:flex-end; justify-content:center; z-index:50;
    padding:0;
  }
  @media(min-width:640px){ .overlay{align-items:center; padding:20px;} }
  .quiz-card{
    background:var(--paper); width:100%; max-width:520px;
    border-radius:8px 8px 0 0; padding:22px 20px 26px;
    max-height:88vh; overflow-y:auto;
    box-shadow:0 -10px 40px rgba(0,0,0,0.3);
    position:relative;
  }
  @media(min-width:640px){ .quiz-card{border-radius:6px;} }
  .quiz-amt{font-family:'IBM Plex Mono',monospace; font-size:11px; color:var(--ink-soft); text-transform:uppercase; letter-spacing:.08em;}
  .quiz-question{font-family:'Special Elite',monospace; font-size:19px; line-height:1.4; margin:8px 0 18px;}
  .option{
    display:block; width:100%; text-align:left; padding:12px 14px; margin-bottom:9px;
    border:1.5px solid var(--paper-line); border-radius:3px; background:var(--paper-dark);
    font-size:15.5px; color:var(--ink); transition:border-color .12s ease, background .12s ease;
  }
  .option:hover:not(:disabled){border-color:var(--carbon);}
  .option.correct{border-color:var(--ok); background:#e3efe6;}
  .option.wrong{border-color:var(--stamp); background:#f6e5e1;}
  .option:disabled{cursor:default;}
  .feedback{margin-top:14px; padding:12px 14px; border-radius:3px; font-size:14.5px; line-height:1.5;}
  .feedback.correct{background:#e3efe6; color:#284a34; border:1px solid var(--ok);}
  .feedback.wrong{background:#f6e5e1; color:#6b2216; border:1px solid var(--stamp);}
  .quiz-actions{margin-top:16px; display:flex; justify-content:flex-end; gap:10px;}
  .close-x{
    position:absolute; top:12px; right:14px; background:none; border:none; font-size:20px;
    color:var(--ink-soft); line-height:1;
  }

  /* stamp animation */
  .stamp-fx{
    position:fixed; inset:0; display:flex; align-items:center; justify-content:center;
    pointer-events:none; z-index:60;
  }
  .stamp-fx .stamp-mark{
    font-family:'Special Elite',monospace; font-size:44px; color:var(--stamp);
    border:5px solid var(--stamp); border-radius:10px; padding:10px 26px;
    transform:rotate(-10deg) scale(0.4); opacity:0;
    animation: stampdown .55s cubic-bezier(.2,1.4,.4,1) forwards;
    filter:url(#stampTexture);
    background:rgba(242,234,217,0.0);
  }
  @keyframes stampdown{
    0%{transform:rotate(-10deg) scale(2.2); opacity:0;}
    55%{transform:rotate(-10deg) scale(0.92); opacity:1;}
    70%{transform:rotate(-10deg) scale(1.04);}
    100%{transform:rotate(-10deg) scale(1); opacity:1;}
  }
  .stamp-fx.fadeout .stamp-mark{ transition:opacity .4s ease; opacity:0; }

  /* ---------- finished ---------- */
  .finished-card{
    text-align:center; background:var(--paper-dark); border:1px solid var(--paper-line);
    border-radius:3px; padding:34px 20px; box-shadow:var(--card-shadow);
  }
  .finished-card .stamp-mark{
    display:inline-block; font-family:'Special Elite',monospace; font-size:22px; color:var(--stamp);
    border:3px solid var(--stamp); border-radius:8px; padding:8px 16px; transform:rotate(-6deg); margin-bottom:14px;
  }

  footer.foot{margin-top:30px; text-align:center;}
  footer.foot button{font-size:11px; color:var(--ink-soft); background:none; border:none; text-decoration:underline; padding:4px;}

  .loading{padding:60px 0; text-align:center; color:var(--ink-soft); font-family:'IBM Plex Mono',monospace; font-size:13px;}

  @media (prefers-reduced-motion: reduce){
    .stamp-fx .stamp-mark{animation:none; opacity:1; transform:rotate(-10deg) scale(1);}
    .group-card, .stage-item.current .stage-node{transition:none;}
  }
</style>
</head>
<body>

<svg width="0" height="0" style="position:absolute">
  <filter id="stampTexture">
    <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" result="noise" seed="7"/>
    <feDisplacementMap in="SourceGraphic" in2="noise" scale="3"/>
  </filter>
</svg>

<div id="app"><div class="loading">Formular wird geladen …</div></div>

<script>
(function(){

  var GROUPS = [
    {id:'buergeramt', name:'Bürgeramt', icon:'🪪'},
    {id:'finanzamt', name:'Finanzamt', icon:'💶'},
    {id:'standesamt', name:'Standesamt', icon:'💍'},
    {id:'ordnungsamt', name:'Ordnungsamt', icon:'🚦'},
    {id:'auslaenderbehoerde', name:'Ausländerbehörde', icon:'🛂'},
    {id:'jugendamt', name:'Jugendamt', icon:'🧸'},
    {id:'bauamt', name:'Bauamt', icon:'🏗️'},
    {id:'sozialamt', name:'Sozialamt', icon:'🤝'},
    {id:'gesundheitsamt', name:'Gesundheitsamt', icon:'🩺'}
  ];
  var CAPACITY = 10;
  var POINTS_PER_STAGE = 10;

  var STAGES = [
    {
      id:'anmeldung', title:'Anmeldung nach Umzug', amt:'Bürgeramt', icon:'🪪',
      question:'Innerhalb welcher Frist muss man sich nach einem Umzug in Deutschland ummelden?',
      options:['48 Stunden','2 Wochen','1 Monat','Es gibt keine Frist'],
      correct:1,
      explanation:'Richtig: Nach dem Bundesmeldegesetz hat man 2 Wochen (14 Tage) Zeit, sich beim Bürgeramt umzumelden.'
    },
    {
      id:'steuerid', title:'Steuer-Identifikationsnummer', amt:'Finanzamt', icon:'💶',
      question:'Wer bekommt in Deutschland automatisch eine Steuer-ID zugeschickt?',
      options:['Nur Selbstständige','Jeder, der beim Bürgeramt gemeldet ist','Nur Rentner:innen','Nur Unternehmen'],
      correct:1,
      explanation:'Richtig: Die Steuer-ID wird automatisch an jede gemeldete Person vergeben – unabhängig vom Beruf.'
    },
    {
      id:'aufenthaltstitel', title:'Aufenthaltstitel', amt:'Ausländerbehörde', icon:'🛂',
      question:'Welches Dokument regelt, ob und wie lange sich eine Person ohne EU-Pass in Deutschland aufhalten darf?',
      options:['Meldebescheinigung','Aufenthaltstitel','Führungszeugnis','Lohnsteuerbescheinigung'],
      correct:1,
      explanation:'Richtig: Der Aufenthaltstitel wird von der Ausländerbehörde erteilt und regelt Dauer und Zweck des Aufenthalts.'
    },
    {
      id:'rundfunk', title:'Rundfunkbeitrag', amt:'Beitragsservice', icon:'📺',
      question:'Der Rundfunkbeitrag (früher „GEZ“) wird in Deutschland erhoben pro...',
      options:['Person','Fernsehgerät','Wohnung','Straßenzug'],
      correct:2,
      explanation:'Richtig: Seit 2013 zahlt jede Wohnung pauschal einen Beitrag – egal wie viele Geräte oder Personen dort leben.'
    },
    {
      id:'fuehrerschein', title:'Führerschein umschreiben', amt:'Führerscheinstelle', icon:'🚗',
      question:'Nach einem Umzug aus einem Nicht-EU-Land: Wie lange gilt der ausländische Führerschein in Deutschland meist noch, bevor man umschreiben muss?',
      options:['3 Monate','6 Monate','2 Jahre','Er bleibt für immer gültig'],
      correct:1,
      explanation:'Richtig: In der Regel gilt eine Frist von 6 Monaten ab Wohnsitznahme – danach ist eine Umschreibung nötig (Details variieren je nach Herkunftsland).'
    },
    {
      id:'muelltrennung', title:'Mülltrennung', amt:'Ordnungsamt', icon:'🗑️',
      question:'Welche Tonne ist in Deutschland typischerweise für Verpackungen aus Kunststoff und Metall gedacht?',
      options:['Blaue Tonne','Gelbe Tonne','Biotonne','Schwarze Restmülltonne'],
      correct:1,
      explanation:'Richtig: Leichtverpackungen aus Plastik und Metall gehören in die Gelbe Tonne bzw. den Gelben Sack.'
    },
    {
      id:'termin', title:'Termin-Etikette', amt:'Amt für Ordnung & Geduld', icon:'📅',
      question:'Was ist bei einem Behördentermin in Deutschland besonders wichtig?',
      options:['Pünktlich sein und alle Unterlagen vollständig mitbringen','Spontan ohne Termin vorbeikommen','Anzugpflicht beachten','Termine sind beliebig verschiebbar'],
      correct:0,
      explanation:'Richtig: Pünktlichkeit und vollständige Unterlagen sparen den meisten Ärger – ohne Termin kommt man meist gar nicht weiter.'
    }
  ];

  var app = document.getElementById('app');
  var state = {
    screen:'loading',
    nameInput:'',
    participant:null,
    groupsState:null,
    selectedGroupForJoin:null,
    activeQuizIndex:null,
    quizSelectedOption:null,
    quizAnswered:false,
    boardOpen:false,
    error:null
  };

  function uid(){
    return 'p_' + Math.random().toString(36).slice(2,10) + Date.now().toString(36);
  }

  function emptyGroupsState(){
    var g = {};
    GROUPS.forEach(function(gr){ g[gr.id] = {members:[], points:0}; });
    return g;
  }

  async function loadGroupsState(){
    try{
      var raw = localStorage.getItem('behoerdenrallye:groups-state');
      if(raw){ return JSON.parse(raw); }
    }catch(e){}
    var fresh = emptyGroupsState();
    try{ localStorage.setItem('behoerdenrallye:groups-state', JSON.stringify(fresh)); }catch(e){}
    return fresh;
  }

  async function saveGroupsState(gs){
    try{ localStorage.setItem('behoerdenrallye:groups-state', JSON.stringify(gs)); }catch(e){}
  }

  async function loadParticipant(){
    try{
      var raw = localStorage.getItem('behoerdenrallye:participant');
      if(raw){ return JSON.parse(raw); }
    }catch(e){}
    return null;
  }

  async function saveParticipant(p){
    try{ localStorage.setItem('behoerdenrallye:participant', JSON.stringify(p)); }catch(e){}
  }

  async function init(){
    state.groupsState = await loadGroupsState();
    var p = await loadParticipant();
    if(p && p.groupId){
      state.participant = p;
      state.screen = 'map';
    } else {
      state.screen = 'intro';
    }
    render();
    startPolling();
  }

  function startPolling(){
    setInterval(async function(){
      if(state.screen === 'map' || state.screen === 'finished'){
        var gs = await loadGroupsState();
        state.groupsState = gs;
        renderIfBoardVisible();
      }
    }, 6000);
  }

  function renderIfBoardVisible(){
    var boardEl = document.getElementById('liveBoard');
    if(boardEl){ boardEl.outerHTML = renderBoard(); }
    var statusPoints = document.getElementById('myGroupPoints');
    if(statusPoints && state.participant){
      var g = state.groupsState[state.participant.groupId];
      if(g) statusPoints.textContent = g.points + ' Punkte';
    }
  }

  function groupOccupancy(id){
    var g = state.groupsState[id];
    return g ? g.members.length : 0;
  }
  function groupPoints(id){
    var g = state.groupsState[id];
    return g ? g.points : 0;
  }

  async function handleJoin(groupId){
    state.error = null;
    var name = state.nameInput.trim();
    if(!name){ state.error = 'Bitte gib zuerst deinen Namen ein.'; render(); return; }

    var gs = await loadGroupsState();
    var g = gs[groupId];
    if(!g){ g = {members:[], points:0}; gs[groupId] = g; }
    if(g.members.length >= CAPACITY){
      state.groupsState = gs;
      state.error = 'Diese Gruppe ist gerade voll geworden. Wähle eine andere.';
      render();
      return;
    }
    var id = uid();
    g.members.push({id:id, name:name});
    await saveGroupsState(gs);
    state.groupsState = gs;

    var participant = {id:id, name:name, groupId:groupId, progress:{}};
    await saveParticipant(participant);
    state.participant = participant;
    state.screen = 'map';
    render();
  }

  function stageStatus(stageId, index){
    if(!state.participant) return 'locked';
    if(state.participant.progress[stageId]) return 'done';
    var firstUndone = STAGES.findIndex(function(s){ return !state.participant.progress[s.id]; });
    return index === firstUndone ? 'current' : 'locked';
  }

  function openQuiz(index){
    state.activeQuizIndex = index;
    state.quizSelectedOption = null;
    state.quizAnswered = false;
    render();
  }

  function closeQuiz(){
    state.activeQuizIndex = null;
    state.quizSelectedOption = null;
    state.quizAnswered = false;
    render();
  }

  async function selectOption(optIndex){
    if(state.quizAnswered) return;
    state.quizSelectedOption = optIndex;
    state.quizAnswered = true;
    render();

    var stage = STAGES[state.activeQuizIndex];
    var isCorrect = optIndex === stage.correct;

    if(isCorrect && !state.participant.progress[stage.id]){
      state.participant.progress[stage.id] = true;
      await saveParticipant(state.participant);

      var gs = await loadGroupsState();
      var g = gs[state.participant.groupId];
      if(g){ g.points = (g.points||0) + POINTS_PER_STAGE; }
      await saveGroupsState(gs);
      state.groupsState = gs;

      showStampFx();

      var allDone = STAGES.every(function(s){ return state.participant.progress[s.id]; });
      if(allDone){
        setTimeout(function(){ state.screen = 'finished'; state.activeQuizIndex = null; render(); }, 900);
      }
    }
  }

  function showStampFx(){
    var fx = document.createElement('div');
    fx.className = 'stamp-fx';
    fx.innerHTML = '<div class="stamp-mark">GENEHMIGT</div>';
    document.body.appendChild(fx);
    setTimeout(function(){
      fx.classList.add('fadeout');
      setTimeout(function(){ fx.remove(); }, 420);
    }, 900);
  }

  async function leaveGroup(){
    if(!confirm('Neu anmelden? Dein bisheriger Fortschritt auf diesem Gerät geht verloren (dein Platz in der alten Gruppe bleibt belegt).')) return;
    try{ localStorage.removeItem('behoerdenrallye:participant'); }catch(e){}
    state.participant = null;
    state.nameInput = '';
    state.screen = 'intro';
    render();
  }

  /* ---------------- render helpers ---------------- */

  function esc(s){
    return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  function renderMasthead(){
    return ''+
    '<div class="masthead">'+
      '<div class="masthead-title">'+
        '<span class="stamp-icon">🖋️</span>'+
        '<div><span class="eyebrow">Formular Nr. 09 / Amtliche Rallye</span><h1>Behördenrallye</h1></div>'+
      '</div>'+
      '<div class="masthead-meta">9 Ämter · je 10 Plätze<br>7 Etappen · 70 Punkte max.</div>'+
    '</div>';
  }

  function renderIntro(){
    return ''+
    renderMasthead()+
    '<div class="intro-card">'+
      '<p>Willkommen zur Behördenrallye! Trage deinen Namen ein, wähle dein Amt und arbeite dich Etappe für Etappe über deinen Laufzettel – jede Station wartet mit einer Quizfrage. Richtige Antworten bringen deinem Amt Punkte für die Rangliste.</p>'+
      '<div class="field" style="margin-top:16px;">'+
        '<label for="nameField">Dein Name</label>'+
        '<input type="text" id="nameField" placeholder="z. B. Max Mustermann" value="'+esc(state.nameInput)+'">'+
      '</div>'+
      (state.error ? '<p style="color:var(--stamp); font-size:14px; margin-top:10px;">'+esc(state.error)+'</p>' : '')+
      '<div style="margin-top:18px;">'+
        '<button class="btn btn-primary" id="toGroupsBtn">Amt auswählen →</button>'+
      '</div>'+
    '</div>';
  }

  function renderGroupSelect(){
    var cards = GROUPS.map(function(gr){
      var occ = groupOccupancy(gr.id);
      var pts = groupPoints(gr.id);
      var full = occ >= CAPACITY;
      var pct = Math.min(100, Math.round(occ/CAPACITY*100));
      return ''+
      '<div class="group-card'+(full?' full':'')+'">'+
        (full ? '<div class="full-stamp">VOLL</div>' : '')+
        '<div class="group-icon">'+gr.icon+'</div>'+
        '<div class="group-name">'+esc(gr.name)+'</div>'+
        '<div class="capacity-row">'+
          '<div class="capacity-bar"><div class="capacity-fill" style="width:'+pct+'%"></div></div>'+
          '<div class="capacity-text">'+occ+'/'+CAPACITY+'</div>'+
        '</div>'+
        '<div class="points-text">'+pts+' Punkte bisher</div>'+
        '<button class="btn select-btn" data-join="'+gr.id+'" '+(full?'disabled':'')+'>'+(full?'Belegt':'Diesem Amt beitreten')+'</button>'+
      '</div>';
    }).join('');

    return ''+
    renderMasthead()+
    '<div class="eyebrow" style="margin-bottom:6px;">Angemeldet als</div>'+
    '<h2 style="margin-bottom:14px;">'+esc(state.nameInput)+'</h2>'+
    (state.error ? '<p style="color:var(--stamp); font-size:14px;">'+esc(state.error)+'</p>' : '')+
    '<div class="group-grid">'+cards+'</div>'+
    '<div style="margin-top:18px;"><button class="btn btn-ghost" id="backToIntroBtn">← Name ändern</button></div>';
  }

  function renderBoard(){
    var rows = GROUPS.map(function(gr){ return {id:gr.id, name:gr.name, icon:gr.icon, points:groupPoints(gr.id)}; });
    rows.sort(function(a,b){ return b.points - a.points; });
    var maxPts = Math.max(1, rows[0].points);
    var mine = state.participant ? state.participant.groupId : null;

    var rowsHtml = rows.map(function(r, i){
      var pct = Math.round(r.points / maxPts * 100);
      return ''+
      '<div class="board-row'+(r.id===mine?' mine':'')+'">'+
        '<div class="board-rank">'+(i+1)+'.</div>'+
        '<div class="board-name">'+r.icon+' '+esc(r.name)+(r.id===mine?' <span style="font-size:10px;">(du)</span>':'')+'</div>'+
        '<div class="board-points">'+r.points+'</div>'+
        '<div class="board-bar-wrap"><div class="board-bar" style="width:'+pct+'%"></div></div>'+
      '</div>';
    }).join('');

    return '<div class="board" id="liveBoard"><div class="eyebrow" style="margin-bottom:8px;">Rangliste · live</div>'+rowsHtml+'</div>';
  }

  function renderMap(){
    var p = state.participant;
    var groupDef = GROUPS.filter(function(g){ return g.id === p.groupId; })[0];
    var myPoints = groupPoints(p.groupId);

    var stageLine = '<div class="stage-line"></div>';
    var items = STAGES.map(function(s, i){
      var status = stageStatus(s.id, i);
      var tag = status === 'current' ? 'button' : 'div';
      var clickAttr = status === 'current' ? ' data-stage="'+i+'"' : '';
      var nodeContent = status === 'done' ? '✓' : s.icon;
      var sub = status === 'done' ? '<span class="checkmark">GEPRÜFT &amp; GESTEMPELT</span>' :
                status === 'current' ? '<span class="stage-cta">Etappe starten →</span>' :
                '<span style="font-size:12px;">gesperrt</span>';
      return ''+
      '<'+tag+' class="stage-item '+status+'"'+clickAttr+'>'+
        '<div class="stage-node">'+nodeContent+'</div>'+
        '<div class="stage-info">'+
          '<div class="stage-title">'+(i+1)+'. '+esc(s.title)+'</div>'+
          '<div class="stage-amt">'+esc(s.amt)+'</div>'+
          sub+
        '</div>'+
      '</'+tag+'>';
    }).join('');

    return ''+
    renderMasthead()+
    '<div class="status-bar">'+
      '<div class="who">Amt: <b>'+groupDef.icon+' '+esc(groupDef.name)+'</b> · <span id="myGroupPoints">'+myPoints+' Punkte</span></div>'+
      '<div class="status-actions">'+
        '<button class="btn btn-ghost" id="toggleBoardBtn">'+(state.boardOpen?'Rangliste ausblenden':'Rangliste anzeigen')+'</button>'+
      '</div>'+
    '</div>'+
    (state.boardOpen ? renderBoard() : '')+
    '<div class="laufzettel">'+
      '<div class="laufzettel-head">'+
        '<span class="eyebrow">Laufzettel</span>'+
        '<h2>'+esc(p.name)+'s Route</h2>'+
        '<p class="muted" style="font-size:13.5px; margin:0;">Klicke auf die aktuelle Station, um die Etappe zu bearbeiten.</p>'+
      '</div>'+
      '<div class="stage-list">'+stageLine+items+'</div>'+
    '</div>'+
    '<footer class="foot"><button id="leaveBtn">Neu anmelden / Gerät wechseln</button></footer>';
  }

  function renderQuiz(){
    var i = state.activeQuizIndex;
    var s = STAGES[i];
    var optsHtml = s.options.map(function(opt, idx){
      var cls = 'option';
      if(state.quizAnswered){
        if(idx === s.correct) cls += ' correct';
        else if(idx === state.quizSelectedOption) cls += ' wrong';
      }
      return '<button class="'+cls+'" data-opt="'+idx+'" '+(state.quizAnswered?'disabled':'')+'>'+esc(opt)+'</button>';
    }).join('');

    var isCorrect = state.quizAnswered && state.quizSelectedOption === s.correct;
    var feedback = '';
    if(state.quizAnswered){
      feedback = '<div class="feedback '+(isCorrect?'correct':'wrong')+'">'+
        (isCorrect ? esc(s.explanation) : 'Nicht ganz. Schau dir die richtige Antwort oben an und versuch die nächste Etappe!')+
      '</div>';
    }

    var actionBtn = isCorrect
      ? '<button class="btn btn-primary" id="quizContinueBtn">Weiter zur Karte →</button>'
      : (state.quizAnswered ? '<button class="btn" id="quizRetryBtn">Nochmal versuchen</button>' : '');

    return ''+
    '<div class="overlay" id="quizOverlay">'+
      '<div class="quiz-card">'+
        '<button class="close-x" id="quizCloseBtn">✕</button>'+
        '<div class="quiz-amt">'+s.icon+' Station '+(i+1)+' · '+esc(s.amt)+'</div>'+
        '<div class="quiz-question">'+esc(s.question)+'</div>'+
        '<div class="options">'+optsHtml+'</div>'+
        feedback+
        '<div class="quiz-actions">'+actionBtn+'</div>'+
      '</div>'+
    '</div>';
  }

  function renderFinished(){
    var p = state.participant;
    var groupDef = GROUPS.filter(function(g){ return g.id === p.groupId; })[0];
    var myPoints = groupPoints(p.groupId);
    return ''+
    renderMasthead()+
    '<div class="finished-card">'+
      '<div class="stamp-mark">RALLYE ABGESCHLOSSEN</div>'+
      '<h2>Gut gemacht, '+esc(p.name)+'!</h2>'+
      '<p>Du hast alle 7 Etappen für <b>'+groupDef.icon+' '+esc(groupDef.name)+'</b> gestempelt und '+POINTS_PER_STAGE*7+' Punkte beigetragen.</p>'+
      '<p class="muted" style="font-size:13.5px;">Aktueller Stand deines Amts: '+myPoints+' Punkte.</p>'+
      '<button class="btn btn-ghost" id="toggleBoardBtn2" style="margin-top:6px;">'+(state.boardOpen?'Rangliste ausblenden':'Rangliste anzeigen')+'</button>'+
    '</div>'+
    (state.boardOpen ? renderBoard() : '')+
    '<footer class="foot"><button id="leaveBtn2">Neu anmelden / Gerät wechseln</button></footer>';
  }

  function render(){
    var html = '';
    if(state.screen === 'intro') html = renderIntro();
    else if(state.screen === 'select-group') html = renderGroupSelect();
    else if(state.screen === 'map') html = renderMap();
    else if(state.screen === 'finished') html = renderFinished();
    else html = '<div class="loading">Formular wird geladen …</div>';

    if(state.activeQuizIndex !== null){
      html += renderQuiz();
    }

    app.innerHTML = html;
    attachListeners();
  }

  function attachListeners(){
    var nameField = document.getElementById('nameField');
    if(nameField){
      nameField.addEventListener('input', function(e){ state.nameInput = e.target.value; });
      nameField.addEventListener('keydown', function(e){ if(e.key==='Enter'){ goToGroups(); } });
    }
    var toGroupsBtn = document.getElementById('toGroupsBtn');
    if(toGroupsBtn) toGroupsBtn.addEventListener('click', goToGroups);

    var backBtn = document.getElementById('backToIntroBtn');
    if(backBtn) backBtn.addEventListener('click', function(){ state.screen='intro'; state.error=null; render(); });

    document.querySelectorAll('[data-join]').forEach(function(btn){
      btn.addEventListener('click', function(){ handleJoin(btn.getAttribute('data-join')); });
    });

    document.querySelectorAll('[data-stage]').forEach(function(btn){
      btn.addEventListener('click', function(){ openQuiz(parseInt(btn.getAttribute('data-stage'),10)); });
    });

    var toggleBoardBtn = document.getElementById('toggleBoardBtn') || document.getElementById('toggleBoardBtn2');
    if(toggleBoardBtn) toggleBoardBtn.addEventListener('click', async function(){
      state.boardOpen = !state.boardOpen;
      if(state.boardOpen){ state.groupsState = await loadGroupsState(); }
      render();
    });

    var leaveBtn = document.getElementById('leaveBtn') || document.getElementById('leaveBtn2');
    if(leaveBtn) leaveBtn.addEventListener('click', leaveGroup);

    document.querySelectorAll('[data-opt]').forEach(function(btn){
      btn.addEventListener('click', function(){ selectOption(parseInt(btn.getAttribute('data-opt'),10)); });
    });

    var quizClose = document.getElementById('quizCloseBtn');
    if(quizClose) quizClose.addEventListener('click', closeQuiz);
    var quizOverlay = document.getElementById('quizOverlay');
    if(quizOverlay) quizOverlay.addEventListener('click', function(e){ if(e.target === quizOverlay) closeQuiz(); });
    var quizContinue = document.getElementById('quizContinueBtn');
    if(quizContinue) quizContinue.addEventListener('click', closeQuiz);
    var quizRetry = document.getElementById('quizRetryBtn');
    if(quizRetry) quizRetry.addEventListener('click', function(){ state.quizAnswered=false; state.quizSelectedOption=null; render(); });
  }

  function goToGroups(){
    state.error = null;
    if(!state.nameInput.trim()){ state.error = 'Bitte gib zuerst deinen Namen ein.'; render(); return; }
    state.screen = 'select-group';
    render();
  }

  init();
})();
</script>
</body>
</html>
