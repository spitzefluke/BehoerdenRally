<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Behördenrallye</title>
<link rel="icon" type="image/png" href="assets/favicon.png">
<link rel="apple-touch-icon" href="assets/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --primary:#C8102E;
    --primary-dark:#970B22;
    --primary-tint:#FFF5F6;
    --navy:#17324D;
    --navy-soft:#263F57;
    --blue:#2B6CA3;
    --blue-light:#EEF4F8;
    --bg:#F3F5F7;
    --surface:#FFFFFF;
    --text:#172B3A;
    --text-muted:#5F6F7D;
    --border:#CFD6DD;
    --success:#287A55;
    --success-tint:#EAF4EE;
    --warning:#A86616;
    --warning-tint:#FFF5E7;
    --error:#C8102E;
    --focus:#2B6CA3;
    --locked-bg:#EDF0F2;
    --tab-1:var(--primary);
    --tab-2:var(--blue);
    --tab-3:#0E7C86;
    --tab-4:#B98900;
    --tab-5:#2E8B57;
    --tab-6:#6B4FA0;
    --radius-sm:2px;
    --radius:4px;
    --card-shadow: 0 2px 8px rgba(14,42,67,0.08);
    --card-shadow-hover: 0 4px 14px rgba(14,42,67,0.12);
    --panel-shadow: 0 4px 16px rgba(14,42,67,0.16);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:'IBM Plex Sans', system-ui, -apple-system, 'Segoe UI', sans-serif;
    min-height:100vh;
    -webkit-font-smoothing:antialiased;
  }
  #app{position:relative; z-index:1; max-width:760px;margin:0 auto;padding:24px 16px 80px;}
  :focus-visible{outline:2.5px solid var(--focus); outline-offset:2px; border-radius:4px;}
  .icon{display:inline-flex; align-items:center; justify-content:center; line-height:0; flex:0 0 auto;}
  .tab-1{--tab:var(--tab-1);} .tab-2{--tab:var(--tab-2);} .tab-3{--tab:var(--tab-3);}
  .tab-4{--tab:var(--tab-4);} .tab-5{--tab:var(--tab-5);} .tab-6{--tab:var(--tab-6);}
  .eyebrow{
    font-family:'IBM Plex Mono',monospace;
    font-size:11px;
    letter-spacing:.12em;
    text-transform:uppercase;
    font-weight:600;
    color:var(--text-muted);
  }
  h1,h2,h3{
    font-family:'IBM Plex Sans', sans-serif;
    font-weight:700;
    letter-spacing:-.01em;
    margin:0 0 6px;
    color:var(--navy);
    text-wrap:balance;
  }
  h1{font-size:clamp(28px,6vw,40px); line-height:1.12;}
  h2{font-size:22px; line-height:1.25;}
  p{line-height:1.6; color:var(--text);}
  .muted{color:var(--text-muted);}
  a, button{font-family:inherit;}
  button{cursor:pointer;}

  /* ---------- buttons (Uiverse.io by Spacious74) ---------- */
  .btn{
    cursor:pointer;
    font-family:'IBM Plex Sans', sans-serif;
    font-weight:600;
    font-size:14px;
    border:none;
    border-radius:16px;
    padding:2px;
    min-height:44px;
    display:inline-flex; align-items:stretch; justify-content:center;
    position:relative; overflow:hidden;
    background:radial-gradient(circle 80px at 80% -10%, #ffffff, #181b1b);
    transition:transform .16s ease;
  }
  .btn::after{
    content:"";
    position:absolute; width:65%; height:60%;
    border-radius:120px; top:0; right:0;
    box-shadow:0 0 20px #ffffff38;
    z-index:0; pointer-events:none;
  }
  .btn .blob{
    position:absolute; width:70px; max-width:40%; height:100%;
    border-radius:16px; bottom:0; left:0;
    background:radial-gradient(circle 60px at 0% 100%, #3fe9ff, #0000ff80, transparent);
    box-shadow:-10px 10px 30px #0051ff2d;
    pointer-events:none;
  }
  .btn .inner{
    width:100%;
    padding:11px 20px;
    border-radius:14px;
    color:#fff;
    display:inline-flex; align-items:center; justify-content:center; gap:8px;
    z-index:3; position:relative;
    background:radial-gradient(circle 80px at 80% -50%, #777777, #0f1111);
  }
  .btn .inner::before{
    content:"";
    position:absolute; inset:0; border-radius:14px;
    background:radial-gradient(circle 60px at 0% 100%, #00e1ff1a, #0000ff11, transparent);
    pointer-events:none;
  }
  .btn:hover{transform:translateY(-2px);}
  .btn:active{transform:translateY(0) scale(.98);}
  .btn:disabled{opacity:.45; cursor:not-allowed; pointer-events:none; transform:none;}
  .btn.is-loading{opacity:.75; cursor:wait; pointer-events:none;}
  .btn-lg .inner{padding:15px 28px; font-size:15px;}
  .btn.menu-btn{width:44px; flex:0 0 auto;}
  .btn.menu-btn .inner{width:44px; height:44px; padding:0;}
  @media (prefers-reduced-motion: reduce){ .btn{transition:none;} }

  /* ---------- header / topbar ---------- */
  .topbar{
    position:sticky; top:0; z-index:40;
    background:rgba(255,255,255,0.96);
    border-bottom:1px solid var(--border);
  }
  .topbar-wave{height:2px; width:100%; background:var(--primary);}
  .topbar-inner{
    max-width:760px; margin:0 auto; padding:0 16px;
    height:56px; display:flex; align-items:center; justify-content:space-between; gap:10px;
  }
  .brand{display:flex; align-items:center; gap:10px; text-decoration:none; color:var(--navy); border:none; background:none; padding:6px 0; min-height:44px; min-width:0; flex:0 1 auto;}
  .brand-mark{
    width:30px; height:30px; border-radius:var(--radius-sm); flex:0 0 auto;
    background:var(--navy); color:#fff; position:relative; overflow:hidden;
    display:flex; align-items:center; justify-content:center;
    font-family:'IBM Plex Mono',monospace; font-weight:700; font-size:12px; letter-spacing:-.02em;
  }
  .brand-mark::after{content:""; position:absolute; left:0; right:0; bottom:2px; height:2px; background:var(--primary);}
  .brand-word{font-weight:700; font-size:15px; letter-spacing:-.01em; color:var(--navy); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; min-width:0;}
  .brand-word b{color:var(--primary);}
  .topbar-right{display:flex; align-items:center; gap:8px; position:relative; min-width:0; flex:0 1 auto; justify-content:flex-end;}
  .topbar-pill{
    font-family:'IBM Plex Mono',monospace; font-size:11.5px; font-weight:600;
    padding:6px 12px; border-radius:var(--radius-sm); background:var(--blue-light); color:var(--navy);
    display:inline-flex; align-items:center; gap:6px; white-space:nowrap;
    overflow:hidden; text-overflow:ellipsis; min-width:0; max-width:44vw;
  }
  .menu-panel{
    position:absolute; top:52px; right:0; z-index:41;
    background:var(--surface); border:1px solid var(--border); border-radius:var(--radius);
    box-shadow:var(--card-shadow-hover); padding:8px; min-width:230px;
    display:flex; flex-direction:column; gap:2px;
  }
  .menu-panel button{
    display:flex; align-items:center; gap:11px; width:100%; text-align:left;
    padding:10px 12px; border-radius:var(--radius-sm); border:none; background:none;
    font-size:14px; font-weight:500; color:var(--text); min-height:44px;
  }
  .menu-panel button:hover{background:var(--blue-light);}
  .menu-panel button.danger{color:var(--primary-dark);}

  /* ---------- onboarding steps ---------- */
  .steps{
    display:flex; align-items:center; justify-content:center; gap:6px;
    margin-bottom:18px; flex-wrap:wrap;
  }
  .step{
    font-family:'IBM Plex Mono',monospace; font-size:11px; letter-spacing:.05em; text-transform:uppercase; font-weight:600;
    color:var(--text-muted); padding:5px 12px; border:1px solid var(--border); border-radius:var(--radius-sm);
    background:var(--surface);
  }
  .step.active{color:#fff; background:var(--navy); border-color:var(--navy);}
  .step.done{color:var(--success); border-color:var(--success);}
  .step-sep{color:var(--text-muted); font-size:12px;}

  /* ---------- hero (Startseite) ---------- */
  .hero{
    position:relative; text-align:center;
    padding:36px 22px 30px;
    margin-bottom:22px;
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:var(--radius);
    box-shadow:var(--card-shadow);
  }
  .hero-inner{position:relative; z-index:2;}
  .hero-eyebrow{display:flex; align-items:center; justify-content:center; gap:8px; margin-bottom:12px;}
  .hero-eyebrow .eyebrow{color:var(--text-muted);}
  .hero-title{font-size:clamp(28px,6.5vw,42px); line-height:1.12; letter-spacing:-.01em; margin:0 0 10px; color:var(--navy);}
  .hero-title b{color:var(--primary); font-weight:800;}
  .hero-sub{max-width:46ch; margin:0 auto 22px; color:var(--text-muted); font-size:15.5px;}
  .hero-stats{display:flex; justify-content:center; gap:10px; flex-wrap:wrap; margin-top:8px;}
  .hero-stat{
    font-family:'IBM Plex Mono',monospace; font-size:11.5px; font-weight:600; color:var(--navy);
    border:1px solid var(--border); border-radius:var(--radius-sm); padding:6px 14px;
    background:var(--bg);
    display:inline-flex; align-items:center; gap:6px;
  }
  .hero-stat b{color:var(--primary); font-weight:700;}
  .hero-status{
    display:inline-flex; align-items:center; gap:7px; margin-top:16px;
    font-family:'IBM Plex Mono',monospace; font-size:11.5px; font-weight:600; color:var(--text-muted);
    letter-spacing:.03em;
  }
  .hero-status .dot{width:7px; height:7px; border-radius:50%; background:var(--success); flex:0 0 auto;}
  @keyframes livepulse{0%,100%{opacity:1;} 50%{opacity:.4;}}
  .hero-status .dot{animation:livepulse 2s ease-in-out infinite;}
  @media (prefers-reduced-motion: reduce){ .hero-status .dot{animation:none;} }

  /* ---------- intro ---------- */
  .intro-card{
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:var(--radius);
    padding:26px 24px;
    box-shadow:var(--card-shadow);
  }
  .field label{
    display:block; font-family:'IBM Plex Mono',monospace; font-size:11px; font-weight:600;
    text-transform:uppercase; letter-spacing:.06em; color:var(--text-muted); margin-bottom:7px;
  }
  input[type=text]{
    width:100%; font-family:'IBM Plex Sans', sans-serif; font-size:16px;
    padding:12px 14px; border:1.5px solid var(--border); border-radius:var(--radius);
    background:var(--surface); color:var(--text); min-height:44px;
  }
  input[type=text]:focus{outline:2.5px solid var(--focus); outline-offset:1px; border-color:var(--focus);}

  /* ---------- name field (Uiverse.io by 0xnihilism, adapted to brand colours) ---------- */
  .name-field-brutal{
    position:relative;
    background:var(--bg);
    border:3px solid var(--navy);
    padding:22px 16px 16px;
    max-width:380px;
    transform-style:preserve-3d;
    transform:rotateX(6deg) rotateY(-6deg);
    perspective:1000px;
    box-shadow:8px 8px 0 var(--navy);
    transition:transform .35s cubic-bezier(.23,1,.32,1), box-shadow .35s cubic-bezier(.23,1,.32,1);
  }
  .name-field-brutal .shadow__input{
    content:""; position:absolute; inset:0; z-index:-1;
    transform:translateZ(-40px);
    background:linear-gradient(45deg, rgba(200,16,46,.35) 0%, rgba(200,16,46,.08) 100%);
    filter:blur(20px);
  }
  .name-field-brutal label{
    position:absolute; top:-14px; left:14px; margin:0;
    background:var(--primary); color:#fff;
    font-family:'IBM Plex Mono',monospace; font-weight:700; font-size:11px;
    letter-spacing:.08em; text-transform:uppercase;
    padding:5px 10px; border:2px solid var(--navy);
    transform:translateZ(30px);
  }
  .name-field-brutal input[type=text]{
    border:2.5px solid var(--navy); border-radius:0;
    background:var(--surface);
    transform:translateZ(10px);
    transition:transform .3s cubic-bezier(.23,1,.32,1), box-shadow .3s cubic-bezier(.23,1,.32,1), background .3s ease;
  }
  .name-field-brutal input[type=text]:hover,
  .name-field-brutal input[type=text]:focus{
    background:var(--bg);
    transform:translateZ(20px) translateX(-3px) translateY(-3px);
    box-shadow:5px 5px 0 0 var(--navy);
  }
  .name-field-brutal input[type=text]:focus{outline:2.5px solid var(--focus); outline-offset:3px; border-color:var(--navy);}
  @media (hover:hover) and (pointer:fine){
    .name-field-brutal:hover{
      transform:rotateX(3deg) rotateY(1deg) scale(1.02);
      box-shadow:16px 16px 0 -4px var(--primary), 16px 16px 0 0 var(--navy);
    }
  }
  @media (prefers-reduced-motion: reduce){
    .name-field-brutal, .name-field-brutal input[type=text]{transition:none;}
    .name-field-brutal:hover, .name-field-brutal input[type=text]:hover{transform:none;}
  }

  /* ---------- group grid ---------- */
  .group-grid{
    display:grid; grid-template-columns:repeat(auto-fill,minmax(210px,1fr));
    gap:14px; margin-top:18px;
  }
  .group-card{
    position:relative;
    background:var(--surface);
    border:1px solid var(--border);
    border-top:3px solid var(--tab, var(--border));
    border-radius:var(--radius);
    padding:16px 15px 15px;
    text-align:left;
    box-shadow:var(--card-shadow);
  }
  .group-card button.select-btn{width:100%; margin-top:12px;}
  .group-head{display:flex; align-items:center; gap:10px;}
  .group-badge{
    flex:0 0 auto; width:36px; height:36px; border-radius:var(--radius-sm);
    display:flex; align-items:center; justify-content:center;
    font-family:'IBM Plex Mono', monospace; font-weight:700; font-size:15px;
    border:1.5px solid var(--tab, var(--text-muted)); color:var(--tab, var(--text-muted));
    background:var(--surface);
  }
  .group-name{font-family:'IBM Plex Sans',sans-serif; font-weight:700; font-size:14.5px; color:var(--navy);}
  .group-name .eyebrow{display:block; margin-bottom:1px;}
  .capacity-row{display:flex; align-items:center; gap:8px; margin-top:12px;}
  .capacity-bar{flex:1; height:6px; background:var(--locked-bg); border-radius:var(--radius-sm); overflow:hidden;}
  .capacity-fill{height:100%; background:var(--success); transition:background .2s ease;}
  .capacity-fill.mid{background:var(--tab-4);}
  .capacity-fill.high{background:var(--warning);}
  .capacity-fill.full{background:var(--primary);}
  .capacity-text{font-family:'IBM Plex Mono',monospace; font-size:11px; color:var(--text-muted); white-space:nowrap; font-variant-numeric:tabular-nums;}
  .points-text{font-family:'IBM Plex Mono',monospace; font-size:11px; color:var(--tab, var(--text-muted)); margin-top:4px; font-weight:700;}
  .group-card.full{opacity:.6;}
  .full-stamp{
    position:absolute; top:12px; right:12px;
    background:var(--primary-tint); color:var(--primary-dark);
    font-family:'IBM Plex Mono',monospace; font-size:10.5px; font-weight:700; letter-spacing:.05em;
    padding:3px 8px; border-radius:var(--radius-sm);
  }

  /* ---------- status badges ---------- */
  .status-badge{
    display:inline-flex; align-items:center; gap:5px;
    font-family:'IBM Plex Mono',monospace; font-size:10.5px; font-weight:700; letter-spacing:.04em; text-transform:uppercase;
    padding:4px 10px; border-radius:var(--radius-sm);
  }
  .status-badge.locked{background:var(--locked-bg); color:var(--text-muted);}
  .status-badge.current{background:var(--blue-light); color:var(--blue);}
  .status-badge.done{background:var(--success-tint); color:var(--success);}

  /* ---------- progress panel / map ---------- */
  .progress-panel{
    background:var(--navy); color:#fff;
    border-radius:var(--radius); padding:20px 20px 18px;
    margin-bottom:20px;
    position:relative;
  }
  .progress-head{display:flex; justify-content:space-between; align-items:center; gap:10px; flex-wrap:wrap; margin-bottom:14px; position:relative;}
  .progress-head .eyebrow{color:rgba(255,255,255,.62);}
  .progress-head .who{font-family:'IBM Plex Mono',monospace; font-size:12.5px; color:rgba(255,255,255,.72);}
  .progress-head .who b{font-weight:700; color:#fff;}
  .progress-bar-track{height:10px; border-radius:var(--radius-sm); background:rgba(255,255,255,0.12); overflow:hidden; position:relative;}
  .progress-bar-fill{height:100%; background:var(--primary); transition:width .5s cubic-bezier(.2,.8,.3,1);}
  .progress-stats{display:flex; justify-content:space-between; align-items:center; margin-top:12px; flex-wrap:wrap; gap:8px; position:relative;}
  .progress-fraction{font-family:'IBM Plex Mono',monospace; font-size:12px; color:rgba(255,255,255,.72);}
  .progress-meta{display:flex; gap:8px; flex-wrap:wrap;}
  .stat-chip{
    font-family:'IBM Plex Mono',monospace; font-size:11.5px; font-weight:600;
    border:1px solid rgba(255,255,255,.18); border-radius:var(--radius-sm); padding:5px 12px;
    background:rgba(255,255,255,0.08); color:#fff;
    display:inline-flex; align-items:center; gap:6px;
  }
  .status-actions{display:flex; gap:8px; align-items:center; position:relative; flex-wrap:wrap;}

  .missions-head{text-align:center; margin-bottom:16px;}
  .missions-head .eyebrow{display:block; margin-bottom:2px;}

  /* ---------- mission cards ("Fallakten") ---------- */
  .mission-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(240px,1fr)); gap:14px;}
  .mission-card{
    position:relative; text-align:left; width:100%;
    background:var(--surface); border:1px solid var(--border);
    border-radius:var(--radius); padding:16px 16px 15px;
    box-shadow:var(--card-shadow);
  }
  .mission-num{font-family:'IBM Plex Mono',monospace; font-size:10.5px; font-weight:600; letter-spacing:.1em; color:var(--text-muted); text-transform:uppercase;}
  .mission-card-head{display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:9px; gap:8px;}
  .mission-org{font-size:12.5px; color:var(--text-muted); margin-bottom:4px; display:flex; align-items:center; gap:6px;}
  .mission-title{font-family:'IBM Plex Sans',sans-serif; font-weight:700; font-size:15.5px; line-height:1.3; margin-bottom:12px; color:var(--navy);}
  .mission-footer{font-family:'IBM Plex Mono',monospace; font-size:11.5px; display:flex; align-items:center; gap:6px;}

  .mission-card.locked{background:var(--locked-bg);}
  .mission-card.locked .mission-title{color:var(--text-muted);}
  .mission-card.locked .mission-footer{color:var(--text-muted);}

  .mission-card.current{border-color:var(--blue); cursor:pointer;}
  .mission-card.current .mission-footer{color:var(--blue); font-weight:700;}
  .mission-card.done{border-color:var(--success);}
  .mission-card.done .mission-footer{color:var(--success); font-weight:700;}
  button.mission-card{font-family:inherit;}
  div.mission-card{cursor:default;}

  /* ---------- leaderboard ---------- */
  .board{
    margin-top:22px; background:var(--surface); border:1px solid var(--border);
    border-radius:var(--radius-sm); padding:0; box-shadow:var(--card-shadow); overflow:hidden;
  }
  .board-title{
    padding:12px 18px; border-bottom:1px solid var(--border);
    font-family:'IBM Plex Mono',monospace; font-size:11px; font-weight:700; letter-spacing:.08em;
    text-transform:uppercase; color:var(--navy);
  }
  .board-head{
    padding:10px 18px; border-bottom:1px solid var(--border);
    display:flex; align-items:center; gap:8px;
  }
  .board-head .live-dot{width:7px; height:7px; border-radius:50%; background:var(--primary); flex:0 0 auto;}
  @keyframes livepulse2{0%,100%{opacity:1;} 50%{opacity:.35;}}
  .board-head .live-dot{animation:livepulse2 2s ease-in-out infinite;}
  @media (prefers-reduced-motion: reduce){ .board-head .live-dot{animation:none;} }
  .board-head .live-label{
    font-family:'IBM Plex Mono',monospace; font-size:11px; font-weight:700; letter-spacing:.08em;
    text-transform:uppercase; color:var(--primary-dark);
  }
  .board-row{
    display:grid; grid-template-columns:42px minmax(0,1fr) 70px;
    grid-template-rows:auto auto; column-gap:12px; row-gap:8px; align-items:center;
    padding:14px 18px; border-bottom:1px solid var(--border); background:var(--surface);
  }
  .board-row:last-child{border-bottom:none;}
  .board-rank{
    grid-row:1 / span 2; display:flex; align-items:center; justify-content:center;
    width:34px; height:34px; background:var(--locked-bg); color:var(--text-muted);
    font-family:'IBM Plex Mono',monospace; font-size:13px; font-weight:700; border-radius:var(--radius-sm);
  }
  .board-row.top .board-rank{background:var(--navy); color:#fff;}
  .board-name{
    min-width:0; display:flex; align-items:center; gap:9px;
    color:var(--navy); font-family:'IBM Plex Sans',sans-serif; font-size:14px; font-weight:600;
  }
  .board-name span:first-of-type{overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .board-dot{width:8px; height:8px; border-radius:50%; background:var(--tab, var(--text-muted)); flex:0 0 auto;}
  .board-points{
    text-align:right; color:var(--text); font-family:'IBM Plex Mono',monospace;
    font-size:16px; font-weight:700; font-variant-numeric:tabular-nums;
  }
  .board-points::after{content:" P."; color:var(--text-muted); font-size:10px; font-weight:500;}
  .board-bar-wrap{
    grid-column:2 / 4; height:5px; background:var(--locked-bg); overflow:hidden; border-radius:var(--radius-sm);
  }
  .board-bar{height:100%; background:var(--tab, var(--blue)); transition:width .45s ease;}
  .board-row.mine{

  .option.wrong{border-color:var(--primary); background:var(--primary-tint);}

  var app = document.getElementById('app');
  var state = {
    screen:'loading',
    nameInput:'',
    recoveryInput:'',
    participant:null,
    groupsState:null,
    groupRows:[],
    participantRows:[],
    groupProgress:{},
    joiningGroupId:null,
    offline:false,
    countdownNumber:3,
    activeQuizIndex:null,
    quizQuestionIndex:0,
    quizSelectedOption:null,
    quizAnswered:false,
    quizCorrectCount:0,
    boardOpen:false,
    menuOpen:false,
    error:null
  };

  function uid(){
    return 'p_' + Math.random().toString(36).slice(2,10) + Date.now().toString(36);
  }

  function genRecoveryCode(){
    var chars = 'ABCDEFGHJKMNPQRSTUVWXYZ23456789'; // ohne 0/O/1/I/L zur besseren Lesbarkeit
    var s = '';
    for(var i=0;i<6;i++){ s += chars[Math.floor(Math.random()*chars.length)]; }
    return s;
  }

  function emptyGroupsState(){
    var g = {};
    GROUPS.forEach(function(gr){ g[gr.id] = {members:[], points:0}; });
    return g;
  }

  function countDone(progress){
    var n = 0;
    for(var k in (progress||{})){ if(progress[k]) n++; }
    return n;
  }

  // Liest die Punkte einer abgeschlossenen Station aus dem Fortschritt.
  // Ältere Einträge speichern nur "true" (vor der Frage-für-Frage-Wertung) -
  // die zählen als volle Punktzahl.
  function stagePoints(entry){
    if(!entry) return 0;
    if(typeof entry === 'object') return entry.points || 0;
    return POINTS_PER_STAGE;
  }

  function sumPoints(progress){
    var total = 0;
    for(var k in (progress||{})){ total += stagePoints(progress[k]); }
    return total;
  }

  function deriveGroupsState(groupRows, participantRows){
    var gs = emptyGroupsState();
    (participantRows||[]).forEach(function(p){
      var g = gs[p.group_id];
      if(g) g.members.push({id:p.id, name:p.name});
    });
    (groupRows||[]).forEach(function(row){
      var g = gs[row.id];
      if(g) g.points = sumPoints(row.progress);
    });
    return gs;
  }

  var sb = null;
  function initSupabase(){
    try{
      if(window.supabase && window.supabase.createClient){
        return window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
      }
    }catch(e){ console.warn('Behördenrallye: Supabase-Client konnte nicht erstellt werden.', e); }
    return null;
  }

  function cacheRemoteState(remote){
    try{ localStorage.setItem('behoerdenrallye:cache', JSON.stringify(remote)); }catch(e){ console.warn('Behördenrallye: Cache konnte nicht gespeichert werden.', e); }
  }
  function loadCachedRemoteState(){
    try{ var raw = localStorage.getItem('behoerdenrallye:cache'); if(raw) return JSON.parse(raw); }catch(e){ console.warn('Behördenrallye: Cache konnte nicht gelesen werden.', e); }
    return null;
  }

  async function fetchRemoteState(){
    if(!sb) return null;
    try{
      var groupsRes = await sb.from('groups').select('id,progress');
      var participantsRes = await sb.from('participants').select('id,name,group_id');
      if(groupsRes.error || participantsRes.error){
        console.warn('Behördenrallye: Laden von Supabase fehlgeschlagen.', groupsRes.error || participantsRes.error);
        return null;
      }
      return { groups: groupsRes.data, participants: participantsRes.data };
    }catch(e){
      console.warn('Behördenrallye: Laden von Supabase fehlgeschlagen.', e);
      return null;
    }
  }

  async function refreshGroupsState(){
    var remote = await fetchRemoteState();
    if(remote){
      state.groupRows = remote.groups || [];
      state.participantRows = remote.participants || [];
      state.offline = false;
      cacheRemoteState(remote);
    } else {
      var cached = loadCachedRemoteState();
      state.groupRows = cached ? cached.groups : [];
      state.participantRows = cached ? cached.participants : [];
      state.offline = true;
    }
    state.groupsState = deriveGroupsState(state.groupRows, state.participantRows);
    if(state.participant){
      var myRow = state.groupRows.filter(function(r){ return r.id === state.participant.groupId; })[0];
      state.groupProgress = myRow ? (myRow.progress || {}) : (state.groupProgress || {});
    }
  }

  async function loadParticipant(){
    try{
      var raw = localStorage.getItem('behoerdenrallye:participant');
      if(raw){ return JSON.parse(raw); }
    }catch(e){ console.warn('Behördenrallye: participant konnte nicht gelesen werden.', e); }
    return null;
  }

  async function saveParticipant(p){
    try{ localStorage.setItem('behoerdenrallye:participant', JSON.stringify(p)); }catch(e){
      console.warn('Behördenrallye: participant konnte nicht gespeichert werden.', e);
      showToast('Deine Anmeldung konnte auf diesem Gerät nicht zwischengespeichert werden.');
    }
  }

  var recentlyCompletedByMe = {};

  function subscribeRealtime(){
    if(!sb || !sb.channel) return;
    try{
      sb.channel('public:groups')
        .on('postgres_changes', {event:'*', schema:'public', table:'groups'}, handleRemoteGroupsChange)
        .subscribe();
      sb.channel('public:participants')
        .on('postgres_changes', {event:'*', schema:'public', table:'participants'}, handleRemoteParticipantsChange)
        .subscribe();
    }catch(e){ console.warn('Behördenrallye: Live-Verbindung konnte nicht aufgebaut werden.', e); }
  }

  function handleRemoteGroupsChange(payload){
    var row = payload.new;
    if(!row || !row.id) return;
    state.groupRows = (state.groupRows||[]).filter(function(r){ return r.id !== row.id; }).concat([row]);

    if(state.participant && state.participant.groupId === row.id){
      var oldProgress = state.groupProgress || {};
      var newlyDone = Object.keys(row.progress||{}).filter(function(k){ return row.progress[k] && !oldProgress[k]; });
      state.groupProgress = row.progress || {};
      newlyDone.forEach(function(stageId){
        if(recentlyCompletedByMe[stageId]) return;
        var stage = STAGES.filter(function(s){ return s.id === stageId; })[0];
        if(stage) showToast('⚡ Euer Team hat „' + stage.title + '" abgeschlossen!');
      });
    }

    state.groupsState = deriveGroupsState(state.groupRows, state.participantRows);
    cacheRemoteState({groups:state.groupRows, participants:state.participantRows});
    if(state.screen==='map' || state.screen==='finished' || state.screen==='select-group'){ render(); }
  }

  function handleRemoteParticipantsChange(payload){
    var row = payload.eventType === 'DELETE' ? payload.old : payload.new;
    if(!row) return;
    state.participantRows = (state.participantRows||[]).filter(function(r){ return r.id !== row.id; });
    if(payload.eventType !== 'DELETE'){ state.participantRows = state.participantRows.concat([row]); }
    state.groupsState = deriveGroupsState(state.groupRows, state.participantRows);
    cacheRemoteState({groups:state.groupRows, participants:state.participantRows});
    if(state.screen==='map' || state.screen==='finished' || state.screen==='select-group'){ render(); }
  }

  async function init(){
    sb = initSupabase();
    var p = await loadParticipant();
    await refreshGroupsState();
    if(p && p.groupId){
      state.participant = p;
      var myRow = state.groupRows.filter(function(r){ return r.id === p.groupId; })[0];
      state.groupProgress = myRow ? (myRow.progress || {}) : {};
      state.screen = 'map';
    } else {
      state.screen = 'intro';
    }
    render();
    subscribeRealtime();
    startPolling();
  }

  function startPolling(){
    setInterval(async function(){
      if(document.hidden) return;
      if(state.screen === 'map' || state.screen === 'finished' || state.screen === 'select-group'){
        await refreshGroupsState();
        render();
      }
    }, 15000);
  }

  function groupOccupancy(id){
    var g = state.groupsState[id];
    return g ? g.members.length : 0;
  }
  function groupPoints(id){
    var g = state.groupsState[id];
    return g ? g.points : 0;
  }

  async function handleJoin(groupId){
    state.error = null;
    var name = state.nameInput.trim();
    if(!name){ state.error = 'Bitte gib zuerst deinen Namen ein.'; render(); return; }
    if(!sb){
      state.error = 'Keine Verbindung zur Rallye-Datenbank. Bitte Internetverbindung prüfen und Seite neu laden.';
      render();
      return;
    }
    if(groupOccupancy(groupId) >= CAPACITY){
      state.error = 'Diese Gruppe ist gerade voll geworden. Wähle eine andere.';
      render();
      return;
    }

    state.joiningGroupId = groupId;
    render();

    var id = uid();
    var code = genRecoveryCode();
    var insertRes;
    try{
      insertRes = await sb.from('participants').insert({id:id, name:name, group_id:groupId, recovery_code:code}).select().single();
    }catch(e){
      insertRes = { error: e };
    }
    state.joiningGroupId = null;

    if(insertRes.error){
      var msg = String((insertRes.error && insertRes.error.message) || '');
      state.error = msg.indexOf('GROUP_FULL') !== -1
        ? 'Diese Gruppe ist gerade voll geworden. Wähle eine andere.'
        : 'Beitritt gerade nicht möglich. Bitte kurz erneut versuchen.';
      console.warn('Behördenrallye: Beitritt fehlgeschlagen.', insertRes.error);
      await refreshGroupsState();
      render();
      return;
    }

    var participant = {id:id, name:name, groupId:groupId, recoveryCode:code};
    await saveParticipant(participant);
    state.participant = participant;
    await refreshGroupsState();
    startCountdown();
  }

  async function handleRecover(){
    state.error = null;
    var code = (state.recoveryInput||'').trim().toUpperCase();
    if(!code){ state.error = 'Bitte gib deinen Code ein.'; render(); return; }
    if(!sb){ state.error = 'Keine Verbindung zur Rallye-Datenbank.'; render(); return; }
    var res;
    try{
      res = await sb.from('participants').select('*').eq('recovery_code', code).maybeSingle();
    }catch(e){
      res = { error: e };
    }
    if(res.error || !res.data){
      state.error = 'Code nicht gefunden. Bitte prüfen und erneut versuchen.';
      render();
      return;
    }
    var row = res.data;
    var participant = {id:row.id, name:row.name, groupId:row.group_id, recoveryCode:row.recovery_code};
    await saveParticipant(participant);
    state.participant = participant;
    await refreshGroupsState();
    state.screen = 'map';
    render();
  }

  function stageStatus(stageId, index){
    if(!state.participant) return 'locked';
    var progress = state.groupProgress || {};
    if(progress[stageId]) return 'done';
    var firstUndone = STAGES.findIndex(function(s){ return !progress[s.id]; });
    return index === firstUndone ? 'current' : 'locked';
  }

  function openQuiz(index){
    state.activeQuizIndex = index;
    state.quizQuestionIndex = 0;
    state.quizSelectedOption = null;
    state.quizAnswered = false;
    state.quizCorrectCount = 0;
    render();
  }

  function closeQuiz(){
    state.activeQuizIndex = null;
    state.quizQuestionIndex = 0;
    state.quizSelectedOption = null;
    state.quizAnswered = false;
    state.quizCorrectCount = 0;
    render();
  }

  function selectOption(optIndex){
    if(state.quizAnswered) return;
    state.quizSelectedOption = optIndex;
    state.quizAnswered = true;
    var stage = STAGES[state.activeQuizIndex];
    var q = stage.questions[state.quizQuestionIndex];
    if(optIndex === q.correct) state.quizCorrectCount++;
    render();
  }

  function advanceQuiz(){
    var stage = STAGES[state.activeQuizIndex];
    if(state.quizQuestionIndex < stage.questions.length - 1){
      state.quizQuestionIndex++;
      state.quizSelectedOption = null;
      state.quizAnswered = false;
      render();
    } else {
      finishStageQuiz();
    }
  }

  async function finishStageQuiz(){
    var stage = STAGES[state.activeQuizIndex];

    if(!(state.groupProgress && state.groupProgress[stage.id])){
      var earnedPoints = state.quizCorrectCount * POINTS_PER_CORRECT;
      state.groupProgress = Object.assign({}, state.groupProgress);
      state.groupProgress[stage.id] = {done:true, points:earnedPoints};
      recentlyCompletedByMe[stage.id] = Date.now();

      if(sb){
        try{
          var res = await sb.rpc('complete_stage', {p_group_id: state.participant.groupId, p_stage_id: stage.id, p_points: earnedPoints});
          if(res.error){
            console.warn('Behördenrallye: Mission konnte nicht mit dem Team synchronisiert werden.', res.error);
            showToast('Deine Antworten wurden gewertet, sind aber gerade nicht mit dem Team synchronisiert.');
          } else if(res.data){
            state.groupProgress = res.data;
          }
        }catch(e){
          console.warn('Behördenrallye: Mission konnte nicht mit dem Team synchronisiert werden.', e);
          showToast('Deine Antworten wurden gewertet, sind aber gerade nicht mit dem Team synchronisiert.');
        }
      }
      await refreshGroupsState();

      showStampFx(earnedPoints);

      var allDone = STAGES.every(function(s){ return state.groupProgress[s.id]; });
      if(allDone){
        setTimeout(function(){ state.screen = 'finished'; state.activeQuizIndex = null; render(); }, 900);
        return;
      }
    }
    closeQuiz();
  }

  function showStampFx(earnedPoints){
    var fx = document.createElement('div');
    fx.className = 'stamp-fx';
    fx.innerHTML = '<div><div class="stamp-mark">GENEHMIGT</div><div class="xp-pop">+'+earnedPoints+' XP</div></div>';
    document.body.appendChild(fx);
    setTimeout(function(){
      fx.classList.add('fadeout');
      setTimeout(function(){ fx.remove(); }, 420);
    }, 1100);
  }

  async function leaveGroup(){
    if(!confirm('Neu anmelden? Dein Name auf diesem Gerät geht verloren (dein Platz in der alten Gruppe bleibt belegt, ihr Team-Fortschritt bleibt erhalten). Mit deinem Code „'+((state.participant&&state.participant.recoveryCode)||'')+'" kannst du jederzeit zurückkehren.')) return;
    try{ localStorage.removeItem('behoerdenrallye:participant'); }catch(e){ console.warn('Behördenrallye: participant konnte nicht entfernt werden.', e); }
    stopMusic();
    state.participant = null;
    state.groupProgress = {};
    state.nameInput = '';
    state.screen = 'intro';
    render();
  }

  /* ---------------- Musik-Playlist ---------------- */
  var PLAYLIST = [
    'audio/elbe-akte-eins.mp3',
    'audio/behoerdenrally-hamburg.mp3',
    'audio/behoerdenrally-hamburg-2.mp3',
    'audio/behoerdenrally.mp3'
  ];
  var musicMuted = false;
  try{ musicMuted = localStorage.getItem('behoerdenrallye:muted') === '1'; }catch(e){}
  var audioEl = null;
  var lastTrackIndex = -1;

  function ensureAudio(){
    if(audioEl) return audioEl;
    try{
      audioEl = new Audio();
      audioEl.preload = 'none';
      audioEl.volume = 0.55;
      audioEl.muted = musicMuted;
      audioEl.addEventListener('ended', playRandomTrack);
      audioEl.addEventListener('error', function(){
        console.warn('Behördenrallye: Titel konnte nicht geladen werden, versuche einen anderen.', audioEl.error);
        playRandomTrack();
      });
    }catch(e){ console.warn('Behördenrallye: Audiowiedergabe ist hier nicht verfügbar.', e); audioEl = null; }
    return audioEl;
  }

  function playRandomTrack(){
    var el = ensureAudio();
    if(!el) return;
    var idx = Math.floor(Math.random()*PLAYLIST.length);
    if(PLAYLIST.length > 1 && idx === lastTrackIndex){ idx = (idx+1) % PLAYLIST.length; }
    lastTrackIndex = idx;
    el.src = PLAYLIST[idx];
    el.currentTime = 0;
    el.play().catch(function(e){ console.warn('Behördenrallye: Wiedergabe wurde blockiert.', e); });
  }

  function stopMusic(){
    if(audioEl){ audioEl.pause(); }
  }

  function toggleMute(){
    musicMuted = !musicMuted;
    try{ localStorage.setItem('behoerdenrallye:muted', musicMuted?'1':'0'); }catch(e){}
    if(musicMuted){
      if(audioEl) audioEl.muted = true;
    } else {
      var el = ensureAudio();
      el.muted = false;
      if(!el.src || el.ended || el.paused){ playRandomTrack(); }
    }
    render();
  }

  function startCountdown(){
    state.screen = 'countdown';
    state.countdownNumber = 3;
    render();
    if(!musicMuted){ playRandomTrack(); }
    var iv = setInterval(function(){
      state.countdownNumber--;
      if(state.countdownNumber < 0){
        clearInterval(iv);
        state.screen = 'map';
        render();
        if(state.participant){ showToast('🔑 Dein Code: ' + state.participant.recoveryCode + ' — merk ihn dir für ein anderes Gerät.'); }
        return;
      }
      render();
    }, 850);
  }

  var toastTimer = null;
  function showToast(text){
    var old = document.getElementById('toast');
    if(old) old.remove();
    if(toastTimer) clearTimeout(toastTimer);
    var t = document.createElement('div');
    t.id = 'toast';
    t.className = 'toast';
    t.setAttribute('role','status');
    t.setAttribute('aria-live','polite');
    t.textContent = text;
    document.body.appendChild(t);
    toastTimer = setTimeout(function(){
      t.classList.add('fadeout');
      setTimeout(function(){ t.remove(); }, 320);
    }, 3400);
  }

  /* ---------------- Easter Eggs ----------------
     Rein kosmetisch, blockieren keine bestehende Funktion. */
  var EASTER_MESSAGES = [
    '📋 Antrag auf Sofortbearbeitung wurde abgelehnt. Bitte in 6–8 Wochen erneut versuchen.',
    '🖨️ Der Drucker im Nebenzimmer ist zuständig. Bitte dort anfragen.',
    '🐌 Ihr Vorgang wurde archiviert. Aktenzeichen: XY-ungelöst-0815.'
  ];
  var eggKeyBuffer = '';
  function handleEasterKeydown(e){
    if(e.ctrlKey || e.metaKey || e.altKey) return;
    var k = (e.key || '').toLowerCase();
    if(k.length !== 1) { eggKeyBuffer=''; return; }
    eggKeyBuffer = (eggKeyBuffer + k).slice(-3);
    if(eggKeyBuffer === 'amt'){
      eggKeyBuffer = '';
      showToast(EASTER_MESSAGES[Math.floor(Math.random()*EASTER_MESSAGES.length)]);
    }
  }

  var stampClickCount = 0;
  var stampClickTimer = null;
  function handleStampIconClick(){
    stampClickCount++;
    clearTimeout(stampClickTimer);
    stampClickTimer = setTimeout(function(){ stampClickCount = 0; }, 2500);
    if(stampClickCount >= 5){
      stampClickCount = 0;
      showToast('🕵️ Geheime Prüfstelle aktiviert: Ihre Geduld wurde amtlich als „vorbildlich" eingestuft.');
    }
  }

  var TAGLINE_ALTS = [
    'Amtlich anerkannt von niemandem',
    'Bearbeitungszeit: sofort (Wunder inklusive)',
    'Mit Stempel, aber ohne echte Behörde dahinter'
  ];
  function handleEyebrowClick(e){
    var el = e.currentTarget;
    if(!el.dataset.original) el.dataset.original = el.textContent;
    el.textContent = TAGLINE_ALTS[Math.floor(Math.random()*TAGLINE_ALTS.length)];
    clearTimeout(el._resetTimer);
    el._resetTimer = setTimeout(function(){ el.textContent = el.dataset.original; }, 4000);
  }

  /* ---------------- render helpers ---------------- */

  function esc(s){
    return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  function btn(label, opts){
    opts = opts || {};
    var cls = 'btn' + (opts.cls ? ' '+opts.cls : '');
    var attrs = '';
    if(opts.id) attrs += ' id="'+opts.id+'"';
    if(opts.attrs) attrs += ' '+opts.attrs;
    return '<button type="button" class="'+cls+'"'+attrs+'><span class="blob"></span><span class="inner">'+label+'</span></button>';
  }

  function renderHero(){
    return ''+
    '<div class="hero">'+
      '<div class="hero-inner">'+
        '<div class="hero-eyebrow"><span class="eyebrow egg-eyebrow">Inoffizielles Fanprojekt · keine amtliche Website</span></div>'+
        '<h1 class="hero-title">Willkommen bei Behörden<b>Rallye</b></h1>'+
        '<p class="hero-sub">Dein digitales Behörden-Abenteuer beginnt hier. Team wählen, Fallakten bearbeiten, gemeinsam die Rallye abschließen.</p>'+
        '<div class="hero-stats">'+
          '<span class="hero-stat"><b>9</b> Teams</span>'+
          '<span class="hero-stat"><b>7</b> Fallakten</span>'+
          '<span class="hero-stat"><b>'+(POINTS_PER_STAGE*7)+'</b> XP max.</span>'+
        '</div>'+
        '<div class="hero-status"><span class="dot"></span><span>Wettbewerb läuft</span></div>'+
      '</div>'+
    '</div>';
  }

  function renderDisclaimer(){
    return '<p class="site-disclaimer">BehördenRallye ist ein kreatives Fanprojekt und keine amtliche Website einer Behörde oder der Stadt Hamburg.</p>';
  }

  function renderHeaderBar(){
    var showStatus = state.participant && (state.screen==='map' || state.screen==='finished' || state.screen==='countdown');
    var groupDef = showStatus ? GROUPS.filter(function(g){ return g.id === state.participant.groupId; })[0] : null;
    var myPoints = groupDef ? groupPoints(groupDef.id) : 0;
    return ''+
    '<div class="topbar-wave"></div>'+
    '<div class="topbar-inner">'+
      '<span class="brand"><span class="brand-mark egg-stamp">BR</span><span class="brand-word">Behörden<b>Rallye</b></span></span>'+
      '<div class="topbar-right">'+
        (groupDef ? '<span class="topbar-pill">'+esc(groupDef.name)+' · '+myPoints+' P.</span>' : '')+
        (state.participant ? '<button type="button" class="btn menu-btn" id="menuBtn" aria-haspopup="true" aria-expanded="'+(state.menuOpen?'true':'false')+'" aria-label="Menü öffnen"><span class="blob"></span><span class="inner">'+icon('menu')+'</span></button>' : '')+
        (state.participant && state.menuOpen ? renderMenuPanel() : '')+
      '</div>'+
    '</div>';
  }

  function renderMenuPanel(){
    return ''+
    '<div class="menu-panel" role="menu">'+
      '<button type="button" id="menuToggleBoard" role="menuitem">'+icon('list')+'<span>'+(state.boardOpen?'Rangliste ausblenden':'Rangliste anzeigen')+'</span></button>'+
      '<button type="button" id="menuToggleMute" role="menuitem">'+icon(musicMuted?'speakerOff':'speakerOn')+'<span>'+(musicMuted?'Musik einschalten':'Musik stummschalten')+'</span></button>'+
      '<button type="button" id="menuLeave" role="menuitem" class="danger">'+icon('logout')+'<span>Neu anmelden / Gerät wechseln</span></button>'+
    '</div>';
  }

  function renderSteps(activeIndex){
    var labels = ['Name', 'Team'];
    return '<div class="steps">'+labels.map(function(label, i){
      var cls = i === activeIndex ? 'active' : i < activeIndex ? 'done' : '';
      var mark = i < activeIndex ? '✓ ' : (i+1)+' · ';
      return '<span class="step '+cls+'">'+mark+label+'</span>'+(i < labels.length-1 ? '<span class="step-sep">→</span>' : '');
    }).join('')+'</div>';
  }

  function renderIntro(){
    return ''+
    renderHero()+
    renderSteps(0)+
    '<div class="intro-card">'+
      '<p>Willkommen zur Behördenrallye! Trage deinen Namen ein, wähle deine Gruppe und arbeite dich Etappe für Etappe über deine Missionen – jede Station wartet mit einer Quizfrage. Richtige Antworten bringen deiner Gruppe Punkte für die Rangliste.</p>'+
      '<div class="field name-field-brutal" style="margin-top:24px;">'+
        '<span class="shadow__input" aria-hidden="true"></span>'+
        '<label for="nameField">Name</label>'+
        '<input type="text" id="nameField" placeholder="z. B. Max Mustermann" value="'+esc(state.nameInput)+'">'+
      '</div>'+
      (state.error ? '<p style="color:var(--error); font-size:14px; margin-top:10px;">'+esc(state.error)+'</p>' : '')+
      '<div style="margin-top:18px;">'+
        btn('Team wählen &amp; starten →', {id:'toGroupsBtn', cls:'btn-lg'})+
      '</div>'+
    '</div>'+
    '<div class="recover-box">'+
      '<span class="eyebrow">Schon dabei?</span>'+
      '<div class="recover-row">'+
        '<input type="text" id="recoveryField" placeholder="z. B. AB3XZ9" value="'+esc(state.recoveryInput)+'" maxlength="6" style="text-transform:uppercase;">'+
        btn('Fortschritt laden', {id:'recoverBtn'})+
      '</div>'+
    '</div>';
  }

  function renderOfflineBanner(){
    if(!state.offline) return '';
    return '<p class="offline-banner">⚠ Keine Verbindung zur Live-Rangliste – zeige zwischengespeicherten Stand.</p>';
  }

  function renderGroupSelect(){
    var anyJoining = !!state.joiningGroupId;
    var cards = GROUPS.map(function(gr, i){
      var occ = groupOccupancy(gr.id);
      var pts = groupPoints(gr.id);
      var full = occ >= CAPACITY;
      var isJoiningThis = state.joiningGroupId === gr.id;
      var pct = Math.min(100, Math.round(occ/CAPACITY*100));
      var fillClass = full ? 'full' : pct>=90 ? 'high' : pct>=50 ? 'mid' : '';
      var tab = tabClass(i);
      var btnLabel = full ? 'Belegt' : isJoiningThis ? 'Wird angelegt…' : 'Dieser Gruppe beitreten';
      return ''+
      '<div class="group-card '+tab+(full?' full':'')+'">'+
        (full ? '<div class="full-stamp">VOLL</div>' : '')+
        '<div class="group-head">'+
          '<div class="group-badge">'+(i+1)+'</div>'+
          '<div class="group-name"><span class="eyebrow">Team</span>'+esc(gr.name)+'</div>'+
        '</div>'+
        '<div class="capacity-row">'+
          '<div class="capacity-bar"><div class="capacity-fill '+fillClass+'" style="width:'+pct+'%"></div></div>'+
          '<div class="capacity-text">'+occ+'/'+CAPACITY+'</div>'+
        '</div>'+
        '<div class="points-text">'+pts+' Punkte bisher</div>'+
        btn(btnLabel, {cls:'select-btn'+(isJoiningThis?' is-loading':''), attrs:'data-join="'+gr.id+'" '+((full||anyJoining)?'disabled':'')})+
      '</div>';
    }).join('');

    return ''+
    renderSteps(1)+
    '<div class="page-lead">'+
      '<div class="eyebrow" style="margin-bottom:6px;">Angemeldet als</div>'+
      '<h1 style="margin-bottom:14px;">'+esc(state.nameInput)+'</h1>'+
    '</div>'+
    renderOfflineBanner()+
    (state.error ? '<p style="color:var(--error); font-size:14px;">'+esc(state.error)+'</p>' : '')+
    '<div class="group-grid">'+cards+'</div>'+
    '<div style="margin-top:18px;">'+btn('← Name ändern', {id:'backToIntroBtn'})+'</div>';
  }

  function renderBoard(){
    var rows = GROUPS.map(function(gr, i){ return {id:gr.id, name:gr.name, tab:tabClass(i), points:groupPoints(gr.id)}; });
    rows.sort(function(a,b){ return b.points - a.points; });
    var maxPts = Math.max(1, rows[0].points);
    var mine = state.participant ? state.participant.groupId : null;

    var rowsHtml = rows.map(function(r, i){
      var pct = Math.round(r.points / maxPts * 100);
      return ''+
      '<div class="board-row '+r.tab+(i===0?' top':'')+(r.id===mine?' mine':'')+'">'+
        '<div class="board-rank">'+String(i+1).padStart(2,'0')+'</div>'+
        '<div class="board-name"><span class="board-dot"></span><span>'+esc(r.name)+'</span>'+(r.id===mine?' <span class="du-badge">Du</span>':'')+'</div>'+
        '<div class="board-points">'+r.points+'</div>'+
        '<div class="board-bar-wrap"><div class="board-bar" style="width:'+pct+'%"></div></div>'+
      '</div>';
    }).join('');

    return ''+
    '<div class="board" id="liveBoard">'+
      '<div class="board-title">Aktueller Wettbewerbsstand</div>'+
      '<div class="board-head"><span class="live-dot"></span><span class="live-label">Rangliste · live</span></div>'+
      rowsHtml+
    '</div>';
  }

  function renderMap(){
    var p = state.participant;
    var groupIdx = GROUPS.findIndex(function(g){ return g.id === p.groupId; });
    var groupDef = GROUPS[groupIdx];
    var myPoints = groupPoints(p.groupId);
    var progress = state.groupProgress || {};
    var doneCount = STAGES.filter(function(s){ return progress[s.id]; }).length;
    var donePct = Math.round(doneCount/STAGES.length*100);

    var cards = STAGES.map(function(s, i){
      var status = stageStatus(s.id, i);
      var tag = status === 'current' ? 'button' : 'div';
      var clickAttr = status === 'current' ? ' data-stage="'+i+'"' : '';
      var statusIcon = status === 'done' ? 'check' : status === 'current' ? 'bolt' : 'lock';
      var statusLabel = status === 'done' ? 'Abgeschlossen' : status === 'current' ? 'Aktiv' : 'Gesperrt';
      var footer = status === 'done' ? icon('star')+'<span>Bearbeitet · +'+stagePoints(progress[s.id])+' XP</span>' :
                status === 'current' ? '<span>Fallakte bearbeiten →</span>' :
                '<span>Erst vorherige Fallakte abschließen</span>';
      var ariaLabel = status === 'current' ? ' aria-label="Fallakte '+(i+1)+' bearbeiten: '+esc(s.title)+'"' :
                       status === 'done' ? ' aria-label="Fallakte '+(i+1)+' abgeschlossen: '+esc(s.title)+'"' :
                       ' aria-label="Fallakte '+(i+1)+' gesperrt: '+esc(s.title)+'"';
      return ''+
      '<'+tag+' class="mission-card '+status+'" style="--i:'+i+'"'+clickAttr+ariaLabel+'>'+
        '<div class="mission-card-head">'+
          '<span class="mission-num">Fallakte Nr. '+String(i+1).padStart(2,'0')+'</span>'+
          '<span class="status-badge '+status+'">'+icon(statusIcon)+'<span>'+statusLabel+'</span></span>'+
        '</div>'+
        '<div class="mission-org">'+s.icon+' '+esc(s.amt)+'</div>'+
        '<div class="mission-title">'+esc(s.title)+'</div>'+
        '<div class="mission-footer">'+footer+'</div>'+
      '</'+tag+'>';
    }).join('');

    return ''+
    renderOfflineBanner()+
    '<div class="progress-panel">'+
      '<div class="progress-head">'+
        '<span class="eyebrow">Rallye-Fortschritt · ganzes Team</span>'+
        '<div class="who">Team: <b class="'+tabClass(groupIdx)+'" style="color:var(--tab)">'+esc(groupDef.name)+'</b></div>'+
      '</div>'+
      '<div class="progress-bar-track" role="progressbar" aria-valuenow="'+doneCount+'" aria-valuemin="0" aria-valuemax="'+STAGES.length+'" aria-label="Rallye-Fortschritt">'+
        '<div class="progress-bar-fill" style="width:'+donePct+'%"></div>'+
      '</div>'+
      '<div class="progress-stats">'+
        '<span class="progress-fraction">'+doneCount+' / '+STAGES.length+' Fallakten bearbeitet</span>'+
        '<div class="progress-meta">'+
          '<span class="stat-chip" id="myGroupPoints">'+icon('star')+'<span>'+myPoints+' Punkte</span></span>'+
          '<span class="stat-chip">'+icon('trophy')+'<span>'+esc(rankForPoints(myPoints))+'</span></span>'+
          '<span class="stat-chip" title="Merk dir diesen Code, um auf einem anderen Gerät weiterzumachen">'+icon('key')+'<span>'+esc(p.recoveryCode||'')+'</span></span>'+
        '</div>'+
      '</div>'+
    '</div>'+
    (state.boardOpen ? renderBoard() : '')+
    '<div class="missions-head">'+
      '<span class="eyebrow">Team '+esc(groupDef.name)+'s Fallakten</span>'+
      '<h2>Eure Vorgänge</h2>'+
      '<p class="muted" style="font-size:13.5px; margin:0;">Jede Fallakte gilt fürs ganze Team – wer zuerst antwortet, entsperrt die nächste für alle.</p>'+
    '</div>'+
    '<div class="mission-grid">'+cards+'</div>';
  }

  function renderQuiz(){
    var i = state.activeQuizIndex;
    var stage = STAGES[i];
    var qi = state.quizQuestionIndex;
    var s = stage.questions[qi];
    var isLast = qi === stage.questions.length - 1;

    var optsHtml = s.options.map(function(opt, idx){
      var cls = 'option';
      if(state.quizAnswered){
        if(idx === s.correct) cls += ' correct';
        else if(idx === state.quizSelectedOption) cls += ' wrong';
      }
      return '<button class="'+cls+'" data-opt="'+idx+'" '+(state.quizAnswered?'disabled':'')+'>'+esc(opt)+'</button>';
    }).join('');

    var isCorrect = state.quizAnswered && state.quizSelectedOption === s.correct;
    var feedback = '';
    if(state.quizAnswered){
      feedback = '<div class="feedback '+(isCorrect?'correct':'wrong')+'">'+
        (isCorrect ? esc(s.explanation) : 'Nicht ganz. Richtige Antwort: „'+esc(s.options[s.correct])+'“')+
      '</div>';
    }

    var actionBtn = state.quizAnswered
      ? btn(isLast ? 'Fallakte abschließen →' : 'Nächste Frage →', {id:'quizNextBtn'})
      : '';

    return ''+
    '<div class="overlay" id="quizOverlay">'+
      '<div class="quiz-card" role="dialog" aria-modal="true" aria-labelledby="quizQuestion">'+
        '<button class="close-x" id="quizCloseBtn" aria-label="Quiz schließen">'+icon('close')+'</button>'+
        '<div class="quiz-amt">'+stage.icon+' Station '+(i+1)+' · '+esc(stage.amt)+' · Frage '+(qi+1)+'/'+stage.questions.length+'</div>'+
        '<div class="quiz-question" id="quizQuestion">'+esc(s.question)+'</div>'+
        '<div class="options">'+optsHtml+'</div>'+
        feedback+
        '<div class="quiz-actions">'+actionBtn+'</div>'+
      '</div>'+
    '</div>';
  }

  function renderFinished(){
    var p = state.participant;
    var groupIdx = GROUPS.findIndex(function(g){ return g.id === p.groupId; });
    var groupDef = GROUPS[groupIdx];
    var myPoints = groupPoints(p.groupId);
    return ''+
    renderOfflineBanner()+
    '<div class="finished-card">'+
      '<div class="stamp-mark">'+icon('check')+'<span>Rallye abgeschlossen</span></div>'+
      '<h2>Gut gemacht, '+esc(p.name)+'!</h2>'+
      '<p>Euer Team <b class="'+tabClass(groupIdx)+'" style="color:var(--tab)">'+esc(groupDef.name)+'</b> hat alle 7 Fallakten bearbeitet und '+myPoints+' Punkte gesammelt.</p>'+
      '<div class="hero-stats" style="margin-top:4px;">'+
        '<span class="hero-stat">'+icon('star')+'<span>'+myPoints+' Punkte</span></span>'+
        '<span class="hero-stat">'+icon('trophy')+'<span>'+esc(rankForPoints(myPoints))+'</span></span>'+
      '</div>'+
    '</div>'+
    (state.boardOpen ? renderBoard() : '');
  }

  function renderCountdown(){
    var groupDef = GROUPS.filter(function(g){ return g.id === state.participant.groupId; })[0];
    var n = state.countdownNumber;
    var label = n > 0 ? String(n) : 'LOS!';
    return ''+
    '<div class="countdown-screen">'+
      '<div class="countdown-card">'+
        '<div class="countdown-label">Eure Mission beginnt in</div>'+
        '<div class="countdown-number">'+label+'</div>'+
        '<div class="countdown-team">Team <b>'+esc(groupDef.name)+'</b> ist bereit.</div>'+
      '</div>'+
    '</div>';
  }

  function render(){
    var html = '';
    if(state.screen === 'intro') html = renderIntro();
    else if(state.screen === 'select-group') html = renderGroupSelect();
    else if(state.screen === 'countdown') html = renderCountdown();
    else if(state.screen === 'map') html = renderMap();
    else if(state.screen === 'finished') html = renderFinished();
    else html = '<div class="boot-screen"><div class="boot-text">Rallye-System wird initialisiert<span class="boot-dots"></span></div></div>';

    var quizHtml = state.activeQuizIndex !== null ? renderQuiz() : '';

    app.innerHTML = '<div class="screen">'+html+renderDisclaimer()+'</div>'+quizHtml;
    attachListeners();

    var topbar = document.getElementById('topbar');
    if(topbar){ topbar.innerHTML = renderHeaderBar(); attachHeaderListeners(); }
  }

  function attachHeaderListeners(){
    var menuBtn = document.getElementById('menuBtn');
    if(menuBtn) menuBtn.addEventListener('click', function(){ state.menuOpen = !state.menuOpen; render(); });

    var menuToggleBoard = document.getElementById('menuToggleBoard');
    if(menuToggleBoard) menuToggleBoard.addEventListener('click', async function(){
      state.boardOpen = !state.boardOpen;
      state.menuOpen = false;
      if(state.boardOpen){ await refreshGroupsState(); }
      render();
    });

    var menuToggleMute = document.getElementById('menuToggleMute');
    if(menuToggleMute) menuToggleMute.addEventListener('click', function(){ state.menuOpen = false; toggleMute(); });

    var menuLeave = document.getElementById('menuLeave');
    if(menuLeave) menuLeave.addEventListener('click', function(){ state.menuOpen = false; leaveGroup(); });

    document.querySelectorAll('#topbar .egg-stamp').forEach(function(el){
      el.addEventListener('click', handleStampIconClick);
    });
  }

  function attachListeners(){
    var nameField = document.getElementById('nameField');
    if(nameField){
      nameField.addEventListener('input', function(e){ state.nameInput = e.target.value; });
      nameField.addEventListener('keydown', function(e){ if(e.key==='Enter'){ goToGroups(); } });
    }
    var toGroupsBtn = document.getElementById('toGroupsBtn');
    if(toGroupsBtn) toGroupsBtn.addEventListener('click', goToGroups);

    var backBtn = document.getElementById('backToIntroBtn');
    if(backBtn) backBtn.addEventListener('click', function(){ state.screen='intro'; state.error=null; render(); });

    document.querySelectorAll('[data-join]').forEach(function(btn){
      btn.addEventListener('click', function(){
        ensureAudio(); // Audio-Element im Klick-Handler anlegen (Autoplay-Regeln)
        handleJoin(btn.getAttribute('data-join'));
      });
    });

    var recoveryField = document.getElementById('recoveryField');
    if(recoveryField){
      recoveryField.addEventListener('input', function(e){ state.recoveryInput = e.target.value; });
      recoveryField.addEventListener('keydown', function(e){ if(e.key==='Enter'){ handleRecover(); } });
    }
    var recoverBtn = document.getElementById('recoverBtn');
    if(recoverBtn) recoverBtn.addEventListener('click', handleRecover);

    document.querySelectorAll('[data-stage]').forEach(function(btn){
      btn.addEventListener('click', function(){ openQuiz(parseInt(btn.getAttribute('data-stage'),10)); });
    });

    document.querySelectorAll('[data-opt]').forEach(function(btn){
      btn.addEventListener('click', function(){ selectOption(parseInt(btn.getAttribute('data-opt'),10)); });
    });

    document.querySelectorAll('.egg-eyebrow').forEach(function(el){
      el.addEventListener('click', handleEyebrowClick);
    });

    var quizClose = document.getElementById('quizCloseBtn');
    if(quizClose) quizClose.addEventListener('click', closeQuiz);
    var quizOverlay = document.getElementById('quizOverlay');
    if(quizOverlay) quizOverlay.addEventListener('click', function(e){ if(e.target === quizOverlay) closeQuiz(); });
    var quizNext = document.getElementById('quizNextBtn');
    if(quizNext) quizNext.addEventListener('click', advanceQuiz);
  }

  function goToGroups(){
    state.error = null;
    if(!state.nameInput.trim()){ state.error = 'Bitte gib zuerst deinen Namen ein.'; render(); return; }
    state.screen = 'select-group';
    render();
  }

  document.addEventListener('keydown', function(e){
    handleEasterKeydown(e);
    if(e.key === 'Escape' && state.activeQuizIndex !== null){ closeQuiz(); return; }
    if(e.key === 'Escape' && state.menuOpen){ state.menuOpen = false; render(); }
  });

  init();
})();
</script>
</body>
</html>
