  function renderBoard(){
    var rows = GROUPS.map(function(gr, i){ return {id:gr.id, name:gr.name, tab:tabClass(i), points:groupPoints(gr.id)}; });
    var ranked = rows.slice().sort(function(a,b){ return b.points - a.points; });
    var maxPts = Math.max(1, ranked[0].points);
    var mine = state.participant ? state.participant.groupId : null;
    var pulseActive = Date.now() < (state.boardPulseUntil||0);
    var now = Date.now();

    // Reihenfolge im DOM bleibt stabil (nach Gruppe, nicht nach Rang) - nur die
    // Position wird per transform animiert, damit Zeilen beim Umsortieren sanft
    // an ihren neuen Platz gleiten statt hart neu gerendert zu wirken.
    var rowsHtml = rows.map(function(r){
      var rank = ranked.findIndex(function(x){ return x.id === r.id; });
      var pct = Math.round(r.points / maxPts * 100);
      var isMine = r.id === mine;

      var prevRank = lastRanks[r.id];
      if(prevRank !== undefined && prevRank !== rank){
        rankFlashInfo[r.id] = { dir: rank < prevRank ? 'up' : 'down', until: now + 1400 };
        setTimeout(function(){ if(document.getElementById('liveBoard')) render(); }, 1450);
        if(isMine){
          announce('Euer Team ist jetzt auf Platz '+(rank+1)+'.');
        }
      }
      lastRanks[r.id] = rank;
      var flash = rankFlashInfo[r.id];
      var arrowHtml = (flash && now < flash.until)
        ? '<span class="rank-arrow '+flash.dir+'" aria-hidden="true">'+(flash.dir==='up'?'▲':'▼')+'</span>'
        : '';

      var prevPoints = lastBoardPoints[r.id];
      var animateFrom = (prevPoints !== undefined && prevPoints !== r.points) ? prevPoints : null;
      lastBoardPoints[r.id] = r.points;
      var pointsAttrs = animateFrom !== null ? ' data-from="'+animateFrom+'" data-to="'+r.points+'"' : '';
      var pointsDisplay = animateFrom !== null ? animateFrom : r.points;

      return ''+
      '<div class="board-row '+r.tab+(rank<3?' place-'+(rank+1):'')+(isMine?' mine':'')+(isMine&&pulseActive?' pulse':'')+'" style="transform:translateY('+(rank*BOARD_ROW_H)+'px)">'+
        '<div class="board-rank">'+String(rank+1).padStart(2,'0')+arrowHtml+'</div>'+
        '<div class="board-name"><span class="board-dot"></span><span>'+esc(r.name)+'</span>'+(isMine?' <span class="du-badge">Du</span>':'')+'</div>'+
        '<div class="board-points"'+pointsAttrs+'>'+pointsDisplay+'</div>'+
        '<div class="board-bar-wrap"><div class="board-bar" style="width:'+pct+'%"></div></div>'+
      '</div>';
    }).join('');

    return ''+
    '<div class="board" id="liveBoard">'+
      '<div class="board-title">Aktueller Wettbewerbsstand</div>'+
      renderPodium(ranked)+
      '<div class="board-head"><span class="live-dot"></span><span class="live-label">Rangliste · live</span></div>'+
      '<div class="board-rows" style="height:'+(GROUPS.length*BOARD_ROW_H)+'px">'+rowsHtml+'</div>'+
    '</div>';
  }

  function renderMap(){
    var p = state.participant;
    var groupIdx = GROUPS.findIndex(function(g){ return g.id === p.groupId; });
    var groupDef = GROUPS[groupIdx];
    var myPoints = groupPoints(p.groupId);
    var progress = state.groupProgress || {};
    var doneCount = STAGES.filter(function(s){ return progress[s.id]; }).length;
    var donePct = Math.round(doneCount/STAGES.length*100);

    var cards = STAGES.map(function(s, i){
      var status = stageStatus(s.id, i);
      var tag = status === 'current' ? 'button' : 'div';
      var clickAttr = status === 'current' ? ' data-stage="'+i+'"' : '';
      var statusIcon = status === 'done' ? 'check' : status === 'current' ? 'bolt' : 'lock';
      var statusLabel = status === 'done' ? 'Abgeschlossen' : status === 'current' ? 'Aktiv' : 'Gesperrt';
      var footer = status === 'done' ? icon('star')+'<span>Bearbeitet · +'+stagePoints(progress[s.id])+' XP</span>' :
                status === 'current' ? '<span>Fallakte bearbeiten →</span>' :
                '<span>Erst vorherige Fallakte abschließen</span>';
      var ariaLabel = status === 'current' ? ' aria-label="Fallakte '+(i+1)+' bearbeiten: '+esc(s.title)+'"' :
                       status === 'done' ? ' aria-label="Fallakte '+(i+1)+' abgeschlossen: '+esc(s.title)+'"' :
                       ' aria-label="Fallakte '+(i+1)+' gesperrt: '+esc(s.title)+'"';
      var address = stageAddress(s.id);
      var due = stageDueTime(p.groupId, s.id);
      var dueHint = due ? '<div class="mission-address">'+icon('clock')+'<span>Ziel-Ankunft: '+formatClockTime(due)+' Uhr'+(stageIsBreak(p.groupId, s.id)?' · danach Pause':'')+'</span></div>' : '';
      return ''+
      '<'+tag+' class="mission-card '+status+'" style="--i:'+i+'"'+clickAttr+ariaLabel+'>'+
        '<div class="mission-card-head">'+
          '<span class="mission-num">Fallakte Nr. '+String(i+1).padStart(2,'0')+'</span>'+
          '<span class="status-badge '+status+'">'+icon(statusIcon)+'<span>'+statusLabel+'</span></span>'+
        '</div>'+
        '<div class="mission-org">'+s.icon+' '+esc(s.amt)+'</div>'+
        '<div class="mission-title">'+esc(s.title)+'</div>'+
        (address ? '<div class="mission-address">'+icon('pin')+'<span>'+esc(address)+'</span></div>' : '')+
        dueHint+
        '<div class="mission-footer">'+footer+'</div>'+
      '</'+tag+'>';
    }).join('');

    return ''+
    renderOfflineBanner()+
    '<div class="progress-panel">'+
      '<div class="progress-head">'+
        '<span class="eyebrow">Rallye-Fortschritt · ganzes Team</span>'+
        '<div class="who">Team: <b class="'+tabClass(groupIdx)+'" style="color:var(--tab)">'+esc(groupDef.name)+'</b></div>'+
      '</div>'+
      '<div class="progress-bar-track" role="progressbar" aria-valuenow="'+doneCount+'" aria-valuemin="0" aria-valuemax="'+STAGES.length+'" aria-label="Rallye-Fortschritt">'+
        '<div class="progress-bar-fill" style="width:'+donePct+'%"></div>'+
      '</div>'+
      '<div class="progress-stats">'+
        '<span class="progress-fraction">'+doneCount+' / '+STAGES.length+' Fallakten bearbeitet</span>'+
        '<div class="progress-meta">'+
          '<span class="stat-chip" id="myGroupPoints">'+icon('star')+'<span>'+myPoints+' Punkte</span></span>'+
          '<span class="stat-chip">'+icon('trophy')+'<span>'+esc(rankForPoints(myPoints))+'</span></span>'+
        '</div>'+
      '</div>'+
    '</div>'+
    (state.boardOpen ? renderBoard() : '')+
    '<div class="missions-head">'+
      '<span class="eyebrow">Team '+esc(groupDef.name)+'s Fallakten</span>'+
      '<h2>Eure Vorgänge</h2>'+
      '<p class="muted" style="font-size:13.5px; margin:0;">Jede Fallakte gilt fürs ganze Team – wer zuerst antwortet, entsperrt die nächste für alle.</p>'+
    '</div>'+
    '<div class="mission-grid">'+cards+'</div>';
  }

  function renderQuiz(){
    var i = state.activeQuizIndex;
    var stage = STAGES[i];
    var qList = stageQuestions(state.participant.groupId, stage.id);
    var qi = state.quizQuestionIndex;
    var s = qList[qi];
    var isLast = qi === qList.length - 1;

    var optsHtml = s.options.map(function(opt, idx){
      var cls = 'option';
      if(state.quizAnswered){
        if(idx === s.correct) cls += ' correct';
        else if(idx === state.quizSelectedOption) cls += ' wrong';
      }
      return '<button class="'+cls+'" data-opt="'+idx+'" '+(state.quizAnswered?'disabled':'')+'>'+esc(opt)+'</button>';
    }).join('');

    var isCorrect = state.quizAnswered && state.quizSelectedOption === s.correct;
    var feedback = '';
    if(state.quizAnswered){
      feedback = '<div class="feedback '+(isCorrect?'correct':'wrong')+'">'+
        (isCorrect ? esc(s.explanation) : 'Nicht ganz. Richtige Antwort: „'+esc(s.options[s.correct])+'“')+
      '</div>';
    }

    var actionBtn = state.quizAnswered
      ? btn(isLast ? 'Fallakte abschließen →' : 'Nächste Frage →', {id:'quizNextBtn'})
      : '';

    var dotsHtml = qList.map(function(_, idx){
      var dotCls = idx < qi ? 'dot done' : idx === qi ? 'dot current' : 'dot';
      return '<span class="'+dotCls+'"></span>';
    }).join('');

    return ''+
    '<div class="overlay" id="quizOverlay">'+
      '<div class="quiz-card" role="dialog" aria-modal="true" aria-labelledby="quizQuestion">'+
        '<button class="close-x" id="quizCloseBtn" aria-label="Quiz schließen">'+icon('close')+'</button>'+
        '<div class="quiz-amt">'+stage.icon+' Station '+(i+1)+' · '+esc(stage.amt)+' · Frage '+(qi+1)+'/'+qList.length+'</div>'+
        '<div class="quiz-dots" aria-hidden="true">'+dotsHtml+'</div>'+
        '<div class="quiz-question" id="quizQuestion">'+esc(s.question)+'</div>'+
        '<div class="options">'+optsHtml+'</div>'+
        feedback+
        '<div class="quiz-actions">'+actionBtn+'</div>'+
      '</div>'+
    '</div>';
  }

  function renderFinished(){
    var p = state.participant;
    var groupIdx = GROUPS.findIndex(function(g){ return g.id === p.groupId; });
    var groupDef = GROUPS[groupIdx];
    var myPoints = groupPoints(p.groupId);
    return ''+
    renderOfflineBanner()+
    '<div class="finished-card">'+
      '<div class="stamp-mark">'+icon('check')+'<span>Rallye abgeschlossen</span></div>'+
      '<h2>Gut gemacht, Team '+esc(groupDef.name)+'!</h2>'+
      '<p>Euer Team <b class="'+tabClass(groupIdx)+'" style="color:var(--tab)">'+esc(groupDef.name)+'</b> hat alle 7 Fallakten bearbeitet und '+myPoints+' Punkte gesammelt.</p>'+
      '<div class="hero-stats" style="margin-top:4px;">'+
        '<span class="hero-stat">'+icon('star')+'<span>'+myPoints+' Punkte</span></span>'+
        '<span class="hero-stat">'+icon('trophy')+'<span>'+esc(rankForPoints(myPoints))+'</span></span>'+
      '</div>'+
      '<div style="margin-top:18px;">'+
        btn('Team-Zertifikat herunterladen '+icon('download'), {id:'certDownloadBtn'})+
      '</div>'+
    '</div>'+
    (state.boardOpen ? renderBoard() : '');
  }

  function downloadCertificate(){
    var p = state.participant;
    var groupIdx = GROUPS.findIndex(function(g){ return g.id === p.groupId; });
    var groupDef = GROUPS[groupIdx];
    var myPoints = groupPoints(p.groupId);
    var rankLabel = rankForPoints(myPoints);

    var canvas = document.createElement('canvas');
    canvas.width = 1200; canvas.height = 800;
    var ctx = canvas.getContext('2d');

    ctx.fillStyle = '#F3F5F7'; ctx.fillRect(0, 0, 1200, 800);
    ctx.strokeStyle = '#17324D'; ctx.lineWidth = 10; ctx.strokeRect(30, 30, 1140, 740);
    ctx.strokeStyle = '#C8102E'; ctx.lineWidth = 2; ctx.strokeRect(48, 48, 1104, 704);

    ctx.textAlign = 'center';
    ctx.fillStyle = '#17324D';
    ctx.font = '600 22px "IBM Plex Mono", monospace';
    ctx.fillText('OFFIZIELLE URKUNDE · BEHÖRDENRALLYE 2026', 600, 150);

    ctx.font = '700 56px "IBM Plex Sans", sans-serif';
    ctx.fillText('Team ' + groupDef.name, 600, 260);

    ctx.font = '400 26px "IBM Plex Sans", sans-serif';
    ctx.fillStyle = '#172B3A';
    ctx.fillText('hat die Behördenrallye erfolgreich abgeschlossen', 600, 320);
    ctx.fillText('und alle 7 Fallakten bearbeitet.', 600, 358);

    ctx.font = '700 44px "IBM Plex Mono", monospace';
    ctx.fillStyle = '#C8102E';
    ctx.fillText(myPoints + ' Punkte', 600, 470);

    ctx.font = '600 26px "IBM Plex Mono", monospace';
    ctx.fillStyle = '#2B6CA3';
    ctx.fillText(rankLabel, 600, 520);

    ctx.font = '700 30px "IBM Plex Mono", monospace';
    ctx.fillStyle = '#17324D';
    ctx.strokeStyle = '#17324D'; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.arc(600, 630, 60, 0, Math.PI*2); ctx.stroke();
    ctx.fillText('✓', 600, 642);

    ctx.font = '400 15px "IBM Plex Mono", monospace';
    ctx.fillStyle = '#5A6B78';
    ctx.fillText('Behördenrallye · Jahrgang 2026', 600, 730);

    var link = document.createElement('a');
    link.download = 'zertifikat-' + groupDef.id + '.png';
    link.href = canvas.toDataURL('image/png');
    document.body.appendChild(link);
    link.click();
    link.remove();
  }

  function renderCountdown(){
    var groupDef = GROUPS.filter(function(g){ return g.id === state.participant.groupId; })[0];
    var n = state.countdownNumber;
    var label = n > 0 ? String(n) : 'LOS!';
    return ''+
    '<div class="countdown-screen">'+
      '<div class="countdown-card">'+
        '<div class="countdown-label">Eure Mission beginnt in</div>'+
        '<div class="countdown-number">'+label+'</div>'+
        '<div class="countdown-team">Team <b>'+esc(groupDef.name)+'</b> ist bereit.</div>'+
      '</div>'+
    '</div>';
  }

  function renderWaiting(){
    var stage = STAGES[state.waitStageIndex];
    var remaining = Math.max(0, state.waitTargetTime - Date.now());
    var timeText = esc(formatDuration(remaining));
    var isBreak = state.waitIsBreak;
    var address = stageAddress(stage.id);
    var farBuildings = '<span></span><span></span><span></span><span></span><span></span><span></span>';
    var nearTrees = '<span></span><span></span><span></span><span></span>';
    var animHtml = isBreak
      ? '<div class="wait-anim wait-anim-break" aria-hidden="true">'+
          '<span class="wait-cloud c1"></span><span class="wait-cloud c2"></span>'+
          '<div class="break-sun"></div>'+
          '<div class="break-scene">'+
            '<span class="break-steam s1"></span><span class="break-steam s2"></span><span class="break-steam s3"></span>'+
            '<div class="break-cup">☕</div>'+
            '<div class="break-bench"></div>'+
          '</div>'+
        '</div>'
      : '<div class="wait-anim wait-anim-bus" aria-hidden="true">'+
          '<span class="wait-cloud c1"></span><span class="wait-cloud c2"></span>'+
          '<div class="bus-far">'+farBuildings+farBuildings+'</div>'+
          '<div class="bus-near">'+nearTrees+nearTrees+'</div>'+
          '<div class="bus-road-strip"></div>'+
          '<div class="bus-dashes"><span></span><span></span><span></span></div>'+
          '<div class="bus-scene">'+
            '<span class="bus-exhaust e1"></span><span class="bus-exhaust e2"></span>'+
            '<div class="bus-body">🚌</div>'+
          '</div>'+
        '</div>';
    var textHtml = isBreak
      ? '<div class="wait-label">Ihr habt nun Pause, genießt es.</div><div class="wait-timer" id="waitTimer">'+timeText+'</div>'
      : '<div class="wait-label">Ihr müsst in <b id="waitTimer">'+timeText+'</b> bei</div>'+
        '<div class="wait-address">'+esc(address)+'</div>'+
        '<div class="wait-label-sub">sein.</div>';
    return ''+
    '<div class="countdown-screen">'+
      '<div class="countdown-card wait-card" role="status" aria-live="polite">'+
        animHtml+
        textHtml+
      '</div>'+
    '</div>';
  }

  function render(){
    var html = '';
    if(state.screen === 'intro') html = renderIntro();
    else if(state.screen === 'countdown') html = renderCountdown();
    else if(state.screen === 'map') html = renderMap();
    else if(state.screen === 'waiting') html = renderWaiting();
    else if(state.screen === 'finished') html = renderFinished();
    else if(state.screen === 'adminLogin') html = renderAdminLogin();
    else if(state.screen === 'admin') html = renderAdmin();
    else html = '<div class="boot-screen"><div class="boot-text">Rallye-System wird initialisiert<span class="boot-dots"></span></div></div>';

    var quizHtml = state.activeQuizIndex !== null ? renderQuiz() : '';

    app.innerHTML = '<div class="screen">'+html+renderDisclaimer()+'</div>'+quizHtml;
    attachListeners();
    animatePendingBoardPoints();

    var topbar = document.getElementById('topbar');
    if(topbar){ topbar.innerHTML = renderHeaderBar(); attachHeaderListeners(); }
  }

  function prefersReducedMotion(){
    return !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches);
  }

  function animateCount(el, from, to, duration){
    if(prefersReducedMotion()){ el.textContent = to; return; }
    var start = performance.now();
    function step(now){
      var t = Math.min(1, (now-start)/duration);
      var eased = 1 - Math.pow(1-t, 3);
      el.textContent = Math.round(from + (to-from)*eased);
      if(t < 1) requestAnimationFrame(step);
      else el.textContent = to;
    }
    requestAnimationFrame(step);
  }

  function animatePendingBoardPoints(){
    document.querySelectorAll('.board-points[data-from]').forEach(function(el){
      var from = parseInt(el.getAttribute('data-from'), 10);
      var to = parseInt(el.getAttribute('data-to'), 10);
      el.removeAttribute('data-from');
      el.removeAttribute('data-to');
      animateCount(el, from, to, 650);
    });
  }

  function attachHeaderListeners(){
    var menuBtn = document.getElementById('menuBtn');
    if(menuBtn) menuBtn.addEventListener('click', function(){ state.menuOpen = !state.menuOpen; render(); });

    var menuToggleBoard = document.getElementById('menuToggleBoard');
    if(menuToggleBoard) menuToggleBoard.addEventListener('click', async function(){
      state.boardOpen = !state.boardOpen;
      state.menuOpen = false;
      if(state.boardOpen){ await refreshGroupsState(); }
      render();
    });

    var menuHelp = document.getElementById('menuHelp');
    if(menuHelp) menuHelp.addEventListener('click', function(){ state.menuOpen = false; render(); showHelpDialog(); });

    var menuLeave = document.getElementById('menuLeave');
    if(menuLeave) menuLeave.addEventListener('click', function(){ state.menuOpen = false; render(); leaveGroup(); });

    var brandHome = document.getElementById('brandHome');
    if(brandHome) brandHome.addEventListener('click', function(){
      state.menuOpen = false;
      state.activeQuizIndex = null;
      state.quizQuestionIndex = 0;
      state.quizSelectedOption = null;
      state.quizAnswered = false;
      state.quizCorrectCount = 0;
      enterMap();
    });

    document.querySelectorAll('#topbar .egg-stamp').forEach(function(el){
      el.addEventListener('click', handleStampIconClick);
    });
  }

  document.addEventListener('click', function(e){
    if(!state.menuOpen) return;
    if(e.target.closest('.menu-panel') || e.target.closest('#menuBtn')) return;
    state.menuOpen = false;
    render();
  });

  function attachListeners(){
    var passwordField = document.getElementById('passwordField');
    if(passwordField){
      passwordField.addEventListener('input', function(e){ state.passwordInput = e.target.value; });
      passwordField.addEventListener('keydown', function(e){ if(e.key==='Enter'){ handlePasswordSubmit(); } });
    }
    var passwordSubmitBtn = document.getElementById('passwordSubmitBtn');
    if(passwordSubmitBtn) passwordSubmitBtn.addEventListener('click', handlePasswordSubmit);

    var adminPasswordField = document.getElementById('adminPasswordField');
    if(adminPasswordField){
      adminPasswordField.addEventListener('input', function(e){ state.adminPasswordInput = e.target.value; });
      adminPasswordField.addEventListener('keydown', function(e){ if(e.key==='Enter'){ handleAdminPasswordSubmit(); } });
    }
    var adminSubmitBtn = document.getElementById('adminSubmitBtn');
    if(adminSubmitBtn) adminSubmitBtn.addEventListener('click', handleAdminPasswordSubmit);

    var adminRefreshBtn = document.getElementById('adminRefreshBtn');
    if(adminRefreshBtn) adminRefreshBtn.addEventListener('click', async function(){ await refreshGroupsState(); render(); });

    var adminExportBtn = document.getElementById('adminExportBtn');
    if(adminExportBtn) adminExportBtn.addEventListener('click', exportResultsCsv);

    var adminAnnounceInput = document.getElementById('adminAnnounceInput');
    if(adminAnnounceInput) adminAnnounceInput.addEventListener('input', function(e){ state.adminAnnounceInput = e.target.value; });
    var adminAnnounceBtn = document.getElementById('adminAnnounceBtn');
    if(adminAnnounceBtn) adminAnnounceBtn.addEventListener('click', async function(){
      var text = (state.adminAnnounceInput||'').trim();
      if(!text) return;
      await sendAnnouncement(text);
      state.adminAnnounceInput = '';
      state.adminAnnounceSent = true;
      render();
      setTimeout(function(){ state.adminAnnounceSent = false; }, 4000);
    });

    var adminSaveAddressesBtn = document.getElementById('adminSaveAddressesBtn');
    if(adminSaveAddressesBtn) adminSaveAddressesBtn.addEventListener('click', saveAdminAddresses);

    var adminGenerateBtn = document.getElementById('adminGenerateBtn');
    if(adminGenerateBtn) adminGenerateBtn.addEventListener('click', generateAllSchedules);

    document.querySelectorAll('[data-save-schedule-group]').forEach(function(btn){
      btn.addEventListener('click', function(){ saveGroupSchedule(btn.getAttribute('data-save-schedule-group')); });
    });

    document.querySelectorAll('[data-admin-tab]').forEach(function(btn){
      btn.addEventListener('click', function(){ state.adminTab = btn.getAttribute('data-admin-tab'); render(); });
    });

    var adminQGroup = document.getElementById('adminQGroup');
    if(adminQGroup) adminQGroup.addEventListener('change', function(e){ state.adminQuestionsGroup = e.target.value; render(); });
    var adminQStage = document.getElementById('adminQStage');
    if(adminQStage) adminQStage.addEventListener('change', function(e){ state.adminQuestionsStage = parseInt(e.target.value, 10); render(); });
    var adminSaveQuestionsBtn = document.getElementById('adminSaveQuestionsBtn');
    if(adminSaveQuestionsBtn) adminSaveQuestionsBtn.addEventListener('click', saveGroupQuestions);

    document.querySelectorAll('[data-stage]').forEach(function(btn){
      btn.addEventListener('click', function(){ openQuiz(parseInt(btn.getAttribute('data-stage'),10)); });
    });

    document.querySelectorAll('[data-opt]').forEach(function(btn){
      btn.addEventListener('click', function(){ selectOption(parseInt(btn.getAttribute('data-opt'),10)); });
    });

    document.querySelectorAll('.egg-eyebrow').forEach(function(el){
      el.addEventListener('click', handleEyebrowClick);
    });

    var certBtn = document.getElementById('certDownloadBtn');
    if(certBtn) certBtn.addEventListener('click', downloadCertificate);

    var quizClose = document.getElementById('quizCloseBtn');
    if(quizClose) quizClose.addEventListener('click', closeQuiz);
    var quizOverlay = document.getElementById('quizOverlay');
    if(quizOverlay) quizOverlay.addEventListener('click', function(e){ if(e.target === quizOverlay) closeQuiz(); });
    var quizNext = document.getElementById('quizNextBtn');
    if(quizNext) quizNext.addEventListener('click', advanceQuiz);

    var quizCard = quizOverlay ? quizOverlay.querySelector('.quiz-card') : null;
    if(quizCard){
      trapFocus(quizCard);
      if(!quizFocusApplied){
        quizFocusApplied = true;
        if(quizClose) quizClose.focus();
      }
    }
  }

  document.addEventListener('keydown', function(e){
    handleEasterKeydown(e);
    if(e.key === 'Escape' && state.activeQuizIndex !== null){ closeQuiz(); return; }
    if(e.key === 'Escape' && state.menuOpen){ state.menuOpen = false; render(); }
  });

  init();
})();
</script>
</body>
</html>
