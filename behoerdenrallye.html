<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Behördenrallye</title>
<link rel="icon" type="image/png" href="assets/favicon.png">
<link rel="apple-touch-icon" href="assets/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --primary:#C8102E;
    --primary-dark:#970B22;
    --primary-tint:#FFF5F6;
    --navy:#17324D;
    --navy-soft:#263F57;
    --blue:#2B6CA3;
    --blue-light:#EEF4F8;
    --bg:#F3F5F7;
    --surface:#FFFFFF;
    --text:#172B3A;
    --text-muted:#5F6F7D;
    --border:#CFD6DD;
    --success:#287A55;
    --success-tint:#EAF4EE;
    --warning:#A86616;
    --warning-tint:#FFF5E7;
    --error:#C8102E;
    --focus:#2B6CA3;
    --locked-bg:#EDF0F2;
    --tab-1:var(--primary);
    --tab-2:var(--blue);
    --tab-3:#0E7C86;
    --tab-4:#B98900;
    --tab-5:#2E8B57;
    --tab-6:#6B4FA0;
    --radius-sm:2px;
    --radius:4px;
    --card-shadow: 0 2px 8px rgba(14,42,67,0.08);
    --card-shadow-hover: 0 4px 14px rgba(14,42,67,0.12);
    --panel-shadow: 0 4px 16px rgba(14,42,67,0.16);
    --bgfx-yellow:#F4D614;
    --bgfx-pink:#E1095C;
    --bgfx-purple:#7E6AA9;
    --bgfx-green:#84AF22;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:'IBM Plex Sans', system-ui, -apple-system, 'Segoe UI', sans-serif;
    min-height:100vh;
    -webkit-font-smoothing:antialiased;
  }
  /* ---------- shooting-stars background (Uiverse.io by marsella_3472: concept + ZAF colours kept,
     re-implemented with real elements + transform instead of animating background-position across
     36 gradient layers - the original measured ~1.6fps in this project's perf harness, the same
     background-position-on-many-gradients trap the rain background hit earlier. ---------- */
  #starfx{position:fixed; inset:0; z-index:0; pointer-events:none; overflow:hidden; background:#000;}
  #starfx span{
    position:absolute; top:-25vh; width:2.5px;
    border-radius:3px;
    background:linear-gradient(to bottom, transparent, var(--star-color, var(--bgfx-purple)) 80%, var(--star-color, var(--bgfx-purple)));
    opacity:.85;
    transform:rotate(45deg);
    animation-name:starfall; animation-timing-function:linear; animation-iteration-count:infinite;
    will-change:transform;
  }
  #starfx span::after{
    content:""; position:absolute; left:50%; bottom:-1px; width:5px; height:5px;
    transform:translateX(-50%); border-radius:50%;
    background:var(--star-color, var(--bgfx-purple));
    box-shadow:0 0 6px 1px var(--star-color, var(--bgfx-purple));
  }
  @keyframes starfall{
    from{ transform:rotate(45deg) translateY(0); }
    to{ transform:rotate(45deg) translateY(145vh); }
  }
  @media (prefers-reduced-motion: reduce){ #starfx span{animation:none; opacity:.4;} }

  #app{position:relative; z-index:1; max-width:760px;margin:0 auto;padding:24px 16px 80px;}
  :focus-visible{outline:2.5px solid var(--focus); outline-offset:2px; border-radius:4px;}
  .icon{display:inline-flex; align-items:center; justify-content:center; line-height:0; flex:0 0 auto;}
  .sr-only{position:absolute; width:1px; height:1px; padding:0; margin:-1px; overflow:hidden; clip:rect(0,0,0,0); white-space:nowrap; border:0;}
  .tab-1{--tab:var(--tab-1);} .tab-2{--tab:var(--tab-2);} .tab-3{--tab:var(--tab-3);}
  .tab-4{--tab:var(--tab-4);} .tab-5{--tab:var(--tab-5);} .tab-6{--tab:var(--tab-6);}
  .eyebrow{
    font-family:'IBM Plex Mono',monospace;
    font-size:11px;
    letter-spacing:.12em;
    text-transform:uppercase;
    font-weight:600;
    color:var(--text-muted);
  }
  h1,h2,h3{
    font-family:'IBM Plex Sans', sans-serif;
    font-weight:700;
    letter-spacing:-.01em;
    margin:0 0 6px;
    color:var(--navy);
    text-wrap:balance;
  }
  h1{font-size:clamp(28px,6vw,40px); line-height:1.12;}
  h2{font-size:22px; line-height:1.25;}
  p{line-height:1.6; color:var(--text);}
  .muted{color:var(--text-muted);}
  a, button{font-family:inherit;}
  button{cursor:pointer;}

  /* ---------- buttons (Uiverse.io by Spacious74) ---------- */
  .btn{
    cursor:pointer;
    font-family:'IBM Plex Sans', sans-serif;
    font-weight:600;
    font-size:14px;
    border:none;
    border-radius:16px;
    padding:2px;
    min-height:44px;
    display:inline-flex; align-items:stretch; justify-content:center;
    position:relative; overflow:hidden;
    background:radial-gradient(circle 80px at 80% -10%, #ffffff, #181b1b);
    transition:transform .16s ease;
  }
  .btn::after{
    content:"";
    position:absolute; width:65%; height:60%;
    border-radius:120px; top:0; right:0;
    box-shadow:0 0 20px #ffffff38;
    z-index:0; pointer-events:none;
  }
  .btn .blob{
    position:absolute; width:70px; max-width:40%; height:100%;
    border-radius:16px; bottom:0; left:0;
    background:radial-gradient(circle 60px at 0% 100%, #3fe9ff, #0000ff80, transparent);
    box-shadow:-10px 10px 30px #0051ff2d;
    pointer-events:none;
  }
  .btn .inner{
    width:100%;
    padding:11px 20px;
    border-radius:14px;
    color:#fff;
    display:inline-flex; align-items:center; justify-content:center; gap:8px;
    z-index:3; position:relative;
    background:radial-gradient(circle 80px at 80% -50%, #777777, #0f1111);
  }
  .btn .inner::before{
    content:"";
    position:absolute; inset:0; border-radius:14px;
    background:radial-gradient(circle 60px at 0% 100%, #00e1ff1a, #0000ff11, transparent);
    pointer-events:none;
  }
  .btn:hover{transform:translateY(-2px);}
  .btn:active{transform:translateY(0) scale(.98);}
  .btn:disabled{opacity:.45; cursor:not-allowed; pointer-events:none; transform:none;}
  .btn.is-loading{opacity:.75; cursor:wait; pointer-events:none;}
  .btn-lg .inner{padding:15px 28px; font-size:15px;}
  .btn.menu-btn{width:44px; flex:0 0 auto;}
  .btn.menu-btn .inner{width:44px; height:44px; padding:0;}
  @media (prefers-reduced-motion: reduce){ .btn{transition:none;} }

  /* ---------- header / topbar ---------- */
  .topbar{
    position:sticky; top:0; z-index:40;
    background:rgba(255,255,255,0.96);
    border-bottom:1px solid var(--border);
  }
  .topbar-wave{height:2px; width:100%; background:var(--primary);}
  .topbar-inner{
    max-width:760px; margin:0 auto; padding:0 16px;
    height:56px; display:flex; align-items:center; justify-content:space-between; gap:10px;
  }
  .brand{display:flex; align-items:center; gap:10px; text-decoration:none; color:var(--navy); border:none; background:none; padding:6px 0; min-height:44px; min-width:0; flex:0 1 auto;}
  .brand-mark{
    width:30px; height:30px; border-radius:var(--radius-sm); flex:0 0 auto;
    background:var(--navy); color:#fff; position:relative; overflow:hidden;
    display:flex; align-items:center; justify-content:center;
    font-family:'IBM Plex Mono',monospace; font-weight:700; font-size:12px; letter-spacing:-.02em;
  }
  .brand-mark::after{content:""; position:absolute; left:0; right:0; bottom:2px; height:2px; background:var(--primary);}
  .brand-word{font-weight:700; font-size:15px; letter-spacing:-.01em; color:var(--navy); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; min-width:0;}
  .brand-word b{color:var(--primary);}
  .topbar-right{display:flex; align-items:center; gap:8px; position:relative; min-width:0; flex:0 1 auto; justify-content:flex-end;}
  .topbar-pill{
    font-family:'IBM Plex Mono',monospace; font-size:11.5px; font-weight:600;
    padding:6px 12px; border-radius:var(--radius-sm); background:var(--blue-light); color:var(--navy);
    display:inline-flex; align-items:center; gap:6px; white-space:nowrap;
    overflow:hidden; text-overflow:ellipsis; min-width:0; max-width:44vw;
  }
  .menu-panel{
    position:absolute; top:52px; right:0; z-index:41;
    background:var(--surface); border:1px solid var(--border); border-radius:var(--radius);
    box-shadow:var(--card-shadow-hover); padding:8px; min-width:230px;
    display:flex; flex-direction:column; gap:2px;
  }
  .menu-panel button{
    display:flex; align-items:center; gap:11px; width:100%; text-align:left;
    padding:10px 12px; border-radius:var(--radius-sm); border:none; background:none;
    font-size:14px; font-weight:500; color:var(--text); min-height:44px;
  }
  .menu-panel button:hover{background:var(--blue-light);}
  .menu-panel button.danger{color:var(--primary-dark);}

  /* ---------- hero (Startseite) ---------- */
  .hero{
    position:relative; text-align:center;
    padding:36px 22px 30px;
    margin-bottom:22px;
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:var(--radius);
    box-shadow:var(--card-shadow);
  }
  .hero-inner{position:relative; z-index:2;}
  @keyframes fadeUp{from{opacity:0; transform:translateY(10px);} to{opacity:1; transform:translateY(0);}}
  .hero-eyebrow{display:flex; align-items:center; justify-content:center; gap:8px; margin-bottom:12px; animation:fadeUp .55s cubic-bezier(.2,.8,.3,1) .04s both;}
  .hero-eyebrow .eyebrow{color:var(--text-muted);}
  .hero-title{font-size:clamp(28px,6.5vw,42px); line-height:1.12; letter-spacing:-.01em; margin:0 0 10px; color:var(--navy); animation:fadeUp .55s cubic-bezier(.2,.8,.3,1) .12s both;}
  .hero-title b{color:var(--primary); font-weight:800;}
  .hero-sub{max-width:46ch; margin:0 auto 22px; color:var(--text-muted); font-size:15.5px; animation:fadeUp .55s cubic-bezier(.2,.8,.3,1) .2s both;}
  .hero-stats{display:flex; justify-content:center; gap:10px; flex-wrap:wrap; margin-top:8px; animation:fadeUp .55s cubic-bezier(.2,.8,.3,1) .28s both;}
  .hero-stat{
    font-family:'IBM Plex Mono',monospace; font-size:11.5px; font-weight:600; color:var(--navy);
    border:1px solid var(--border); border-radius:var(--radius-sm); padding:6px 14px;
    background:var(--bg);
    display:inline-flex; align-items:center; gap:6px;
  }
  .hero-stat b{color:var(--primary); font-weight:700;}
  .hero-status{
    display:inline-flex; align-items:center; gap:7px; margin-top:16px; flex-wrap:wrap; justify-content:center;
    font-family:'IBM Plex Mono',monospace; font-size:11.5px; font-weight:600; color:var(--text-muted);
    letter-spacing:.03em; animation:fadeUp .55s cubic-bezier(.2,.8,.3,1) .36s both;
  }
  .hero-status .dot{width:7px; height:7px; border-radius:50%; background:var(--success); flex:0 0 auto;}
  @keyframes livepulse{0%,100%{opacity:1;} 50%{opacity:.4;}}
  .hero-status .dot{animation:livepulse 2s ease-in-out infinite;}
  .hero-countdown{font-variant-numeric:tabular-nums; color:var(--text-muted);}
  @media (prefers-reduced-motion: reduce){
    .hero-status .dot{animation:none;}
    .hero-eyebrow, .hero-title, .hero-sub, .hero-stats, .hero-status{animation:none;}
  }

  /* ---------- intro ---------- */
  .intro-card{
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:var(--radius);
    padding:26px 24px;
    box-shadow:var(--card-shadow);
  }
  .field label{
    display:block; font-family:'IBM Plex Mono',monospace; font-size:11px; font-weight:600;
    text-transform:uppercase; letter-spacing:.06em; color:var(--text-muted); margin-bottom:7px;
  }
  input[type=text], input[type=password]{
    width:100%; font-family:'IBM Plex Sans', sans-serif; font-size:16px;
    padding:12px 14px; border:1.5px solid var(--border); border-radius:var(--radius);
    background:var(--surface); color:var(--text); min-height:44px;
  }
  input[type=text]:focus, input[type=password]:focus{outline:2.5px solid var(--focus); outline-offset:1px; border-color:var(--focus);}

  /* ---------- name field (Uiverse.io by 0xnihilism, adapted to brand colours) ---------- */
  .name-class-row{display:flex; gap:20px; flex-wrap:wrap;}
  .name-class-row .name-field-brutal{flex:1 1 220px;}
  .name-field-brutal{
    position:relative;
    background:var(--bg);
    border:3px solid var(--navy);
    padding:22px 16px 16px;
    max-width:380px;
    transform-style:preserve-3d;
    transform:rotateX(6deg) rotateY(-6deg);
    perspective:1000px;
    box-shadow:8px 8px 0 var(--navy);
    transition:transform .35s cubic-bezier(.23,1,.32,1), box-shadow .35s cubic-bezier(.23,1,.32,1);
  }
  .name-field-brutal .shadow__input{
    content:""; position:absolute; inset:0; z-index:-1;
    transform:translateZ(-40px);
    background:linear-gradient(45deg, rgba(200,16,46,.35) 0%, rgba(200,16,46,.08) 100%);
    filter:blur(20px);
  }
  .name-field-brutal label{
    position:absolute; top:-14px; left:14px; margin:0;
    background:var(--primary); color:#fff;
    font-family:'IBM Plex Mono',monospace; font-weight:700; font-size:11px;
    letter-spacing:.08em; text-transform:uppercase;
    padding:5px 10px; border:2px solid var(--navy);
    transform:translateZ(30px);
  }
  .name-field-brutal input[type=text], .name-field-brutal input[type=password]{
    border:2.5px solid var(--navy); border-radius:0;
    background:var(--surface);
    transform:translateZ(10px);
    transition:transform .3s cubic-bezier(.23,1,.32,1), box-shadow .3s cubic-bezier(.23,1,.32,1), background .3s ease;
  }
  .name-field-brutal input[type=text]:hover, .name-field-brutal input[type=password]:hover,
  .name-field-brutal input[type=text]:focus, .name-field-brutal input[type=password]:focus{
    background:var(--bg);
    transform:translateZ(20px) translateX(-3px) translateY(-3px);
    box-shadow:5px 5px 0 0 var(--navy);
  }
  .name-field-brutal input[type=text]:focus, .name-field-brutal input[type=password]:focus{outline:2.5px solid var(--focus); outline-offset:3px; border-color:var(--navy);}
  @media (hover:hover) and (pointer:fine){
    .name-field-brutal:hover{
      transform:rotateX(3deg) rotateY(1deg) scale(1.02);
      box-shadow:16px 16px 0 -4px var(--primary), 16px 16px 0 0 var(--navy);
    }
  }
  @media (prefers-reduced-motion: reduce){
    .name-field-brutal, .name-field-brutal input[type=text], .name-field-brutal input[type=password]{transition:none;}
    .name-field-brutal:hover, .name-field-brutal input[type=text]:hover, .name-field-brutal input[type=password]:hover{transform:none;}
  }


  /* ---------- status badges ---------- */
  .status-badge{
    display:inline-flex; align-items:center; gap:5px;
    font-family:'IBM Plex Mono',monospace; font-size:10.5px; font-weight:700; letter-spacing:.04em; text-transform:uppercase;
    padding:4px 10px; border-radius:var(--radius-sm);
  }
  .status-badge.locked{background:var(--locked-bg); color:var(--text-muted);}
  .status-badge.current{background:var(--blue-light); color:var(--blue);}
  .status-badge.done{background:var(--success-tint); color:var(--success);}

  /* ---------- progress panel / map ---------- */
  .progress-panel{
    background:var(--navy); color:#fff;
    border-radius:var(--radius); padding:20px 20px 18px;
    margin-bottom:20px;
    position:relative;
  }
  .progress-head{display:flex; justify-content:space-between; align-items:center; gap:10px; flex-wrap:wrap; margin-bottom:14px; position:relative;}
  .progress-head .eyebrow{color:rgba(255,255,255,.62);}
  .progress-head .who{font-family:'IBM Plex Mono',monospace; font-size:12.5px; color:rgba(255,255,255,.72);}
  .progress-head .who b{font-weight:700; color:#fff;}
  .progress-bar-track{height:10px; border-radius:var(--radius-sm); background:rgba(255,255,255,0.12); overflow:hidden; position:relative;}
  .progress-bar-fill{height:100%; background:var(--primary); transition:width .5s cubic-bezier(.2,.8,.3,1);}
  .progress-stats{display:flex; justify-content:space-between; align-items:center; margin-top:12px; flex-wrap:wrap; gap:8px; position:relative;}
  .progress-fraction{font-family:'IBM Plex Mono',monospace; font-size:12px; color:rgba(255,255,255,.72);}
  .progress-meta{display:flex; gap:8px; flex-wrap:wrap;}
  .stat-chip{
    font-family:'IBM Plex Mono',monospace; font-size:11.5px; font-weight:600;
    border:1px solid rgba(255,255,255,.18); border-radius:var(--radius-sm); padding:5px 12px;
    background:rgba(255,255,255,0.08); color:#fff;
    display:inline-flex; align-items:center; gap:6px;
  }
  .status-actions{display:flex; gap:8px; align-items:center; position:relative; flex-wrap:wrap;}

  .missions-head{text-align:center; margin-bottom:16px;}
  .missions-head .eyebrow{display:block; margin-bottom:2px; color:rgba(255,255,255,.6);}
  .missions-head h2{color:#fff;}
  .missions-head .muted{color:rgba(255,255,255,.55);}

  /* ---------- mission cards ("Fallakten") ---------- */
  .mission-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(240px,1fr)); gap:14px;}
  @keyframes cardIn{from{opacity:0; transform:translateY(12px) scale(.985);} to{opacity:1; transform:translateY(0) scale(1);}}
  .mission-card{
    position:relative; text-align:left; width:100%;
    background:var(--surface); border:1px solid var(--border);
    border-radius:var(--radius); padding:16px 16px 15px;
    box-shadow:var(--card-shadow);
    transition:transform .18s ease, box-shadow .18s ease;
    animation:cardIn .5s cubic-bezier(.2,.8,.3,1) both;
    animation-delay:calc(var(--i, 0) * 55ms);
  }
  .mission-card.current:hover{transform:translateY(-2px); box-shadow:var(--card-shadow-hover);}
  @media (prefers-reduced-motion: reduce){ .mission-card{animation:none; transition:none;} .mission-card.current:hover{transform:none;} }
  .mission-num{font-family:'IBM Plex Mono',monospace; font-size:10.5px; font-weight:600; letter-spacing:.1em; color:var(--text-muted); text-transform:uppercase;}
  .mission-card-head{display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:9px; gap:8px;}
  .mission-org{font-size:12.5px; color:var(--text-muted); margin-bottom:4px; display:flex; align-items:center; gap:6px;}
  .mission-title{font-family:'IBM Plex Sans',sans-serif; font-weight:700; font-size:15.5px; line-height:1.3; margin-bottom:12px; color:var(--navy);}
  .mission-footer{font-family:'IBM Plex Mono',monospace; font-size:11.5px; display:flex; align-items:center; gap:6px;}
  .mission-address{font-size:11.5px; color:var(--text-muted); display:flex; align-items:flex-start; gap:5px; margin-bottom:10px; line-height:1.4;}
  .mission-address .icon{margin-top:1px; flex:0 0 auto;}

  .mission-card.locked{background:var(--locked-bg);}
  .mission-card.locked .mission-title{color:var(--text-muted);}
  .mission-card.locked .mission-footer{color:var(--text-muted);}

  .mission-card.current{border-color:var(--blue); cursor:pointer;}
  .mission-card.current .mission-footer{color:var(--blue); font-weight:700;}
  .mission-card.done{border-color:var(--success);}
  .mission-card.done .mission-footer{color:var(--success); font-weight:700;}
  button.mission-card{font-family:inherit;}
  div.mission-card{cursor:default;}

  /* ---------- leaderboard ---------- */
  .board{
    margin-top:22px; background:var(--surface); border:1px solid var(--border);
    border-radius:var(--radius-sm); padding:0; box-shadow:var(--card-shadow); overflow:hidden;
  }
  .board-title{
    padding:12px 18px; border-bottom:1px solid var(--border);
    font-family:'IBM Plex Mono',monospace; font-size:11px; font-weight:700; letter-spacing:.08em;
    text-transform:uppercase; color:var(--navy);
  }
  .board-head{
    padding:10px 18px; border-bottom:1px solid var(--border);
    display:flex; align-items:center; gap:8px;
  }
  .board-head .live-dot{width:7px; height:7px; border-radius:50%; background:var(--primary); flex:0 0 auto;}
  @keyframes livepulse2{0%,100%{opacity:1;} 50%{opacity:.35;}}
  .board-head .live-dot{animation:livepulse2 2s ease-in-out infinite;}
  @media (prefers-reduced-motion: reduce){ .board-head .live-dot{animation:none;} }
  .board-head .live-label{
    font-family:'IBM Plex Mono',monospace; font-size:11px; font-weight:700; letter-spacing:.08em;
    text-transform:uppercase; color:var(--primary-dark);
  }
  .board-rows{position:relative;}
  .board-row{
    position:absolute; left:0; right:0; top:0;
    display:grid; grid-template-columns:42px minmax(0,1fr) 70px;
    grid-template-rows:auto auto; column-gap:12px; row-gap:8px; align-items:center;
    padding:14px 18px; border-bottom:1px solid var(--border); background:var(--surface);
    transition:transform .55s cubic-bezier(.2,.8,.3,1);
  }
  @keyframes boardPulse{
    0%{box-shadow:inset 4px 0 0 var(--primary), 0 0 0 0 rgba(200,16,46,.35);}
    60%{box-shadow:inset 4px 0 0 var(--primary), 0 0 0 8px rgba(200,16,46,0);}
    100%{box-shadow:inset 4px 0 0 var(--primary), 0 0 0 0 rgba(200,16,46,0);}
  }
  .board-row.pulse{animation:boardPulse 1.1s ease;}
  @media (prefers-reduced-motion: reduce){ .board-row{transition:none;} .board-row.pulse{animation:none;} }
  .board-rank{
    grid-row:1 / span 2; display:flex; align-items:center; justify-content:center;
    width:34px; height:34px; background:var(--locked-bg); color:var(--text-muted);
    font-family:'IBM Plex Mono',monospace; font-size:13px; font-weight:700; border-radius:var(--radius-sm);
    position:relative;
  }
  .board-row.place-1 .board-rank{background:#E8B923; color:var(--navy);}
  .board-row.place-2 .board-rank{background:#C3C9D1; color:var(--navy);}
  .board-row.place-3 .board-rank{background:#D08A4C; color:var(--navy);}
  .rank-arrow{
    position:absolute; top:-6px; right:-6px; font-size:11px; line-height:1;
    width:16px; height:16px; border-radius:50%; display:flex; align-items:center; justify-content:center;
    animation:rankArrowIn .5s cubic-bezier(.2,.8,.3,1) both;
  }
  .rank-arrow.up{background:var(--success); color:#fff;}
  .rank-arrow.down{background:var(--primary); color:#fff;}
  @keyframes rankArrowIn{from{opacity:0; transform:scale(.5);} to{opacity:1; transform:scale(1);}}
  @media (prefers-reduced-motion: reduce){ .rank-arrow{animation:none;} }
  .board-name{
    min-width:0; display:flex; align-items:center; gap:9px;
    color:var(--navy); font-family:'IBM Plex Sans',sans-serif; font-size:14px; font-weight:600;
  }
  .board-name span:first-of-type{overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .board-dot{width:8px; height:8px; border-radius:50%; background:var(--tab, var(--text-muted)); flex:0 0 auto;}
  .board-points{
    text-align:right; color:var(--text); font-family:'IBM Plex Mono',monospace;
    font-size:16px; font-weight:700; font-variant-numeric:tabular-nums;
  }
  .board-points::after{content:" P."; color:var(--text-muted); font-size:10px; font-weight:500;}
  .board-bar-wrap{
    grid-column:2 / 4; height:5px; background:var(--locked-bg); overflow:hidden; border-radius:var(--radius-sm);
  }
  .board-bar{height:100%; background:var(--tab, var(--blue)); transition:width .45s ease;}
  .board-row.mine{
    position:relative; background:var(--primary-tint);
    box-shadow:inset 4px 0 0 var(--primary);
  }
  .board-row.mine .board-name{color:var(--primary-dark); font-weight:700;}
  .board-row.mine .board-points{color:var(--primary-dark);}
  .board-row.mine .board-name .du-badge{
    padding:2px 6px; background:var(--primary); color:#fff; border-radius:var(--radius-sm);
    font-family:'IBM Plex Mono',monospace; font-size:9px; font-weight:700; text-transform:uppercase;
    flex:0 0 auto;
  }
  @media (max-width:420px){
    .board-row{grid-template-columns:34px minmax(0,1fr) 60px; padding:12px 14px;}
    .board-points{font-size:14.5px;}
  }

  /* ---------- podium (Top 3) ---------- */
  .podium{display:flex; align-items:flex-end; justify-content:center; gap:10px; padding:20px 14px 0;}
  .podium-slot{display:flex; flex-direction:column; align-items:center; width:88px; text-align:center; min-width:0;}
  .podium-team{font-size:12px; font-weight:700; color:var(--navy); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:100%;}
  .podium-pts{font-family:'IBM Plex Mono',monospace; font-size:11px; color:var(--text-muted); margin-bottom:6px;}
  .podium-crown{font-size:20px; margin-bottom:2px; line-height:1;}
  .podium-block{
    width:100%; border-radius:var(--radius-sm) var(--radius-sm) 0 0;
    font-family:'IBM Plex Mono',monospace; font-weight:800; color:var(--navy);
    display:flex; align-items:flex-start; justify-content:center; padding-top:6px;
  }
  .podium-slot.place-1 .podium-block{height:64px; background:#E8B923; font-size:20px;}
  .podium-slot.place-2 .podium-block{height:46px; background:#C3C9D1; font-size:17px;}
  .podium-slot.place-3 .podium-block{height:34px; background:#D08A4C; font-size:16px;}
  @media (max-width:380px){ .podium-slot{width:72px;} }

  /* ---------- quiz modal ---------- */
  .overlay{
    position:fixed; inset:0; background:rgba(14,42,67,0.5);
    display:flex; align-items:flex-end; justify-content:center; z-index:50;
    padding:0; animation:overlayFade .2s ease both;
  }
  @keyframes overlayFade{from{opacity:0;} to{opacity:1;}}
  @media(min-width:640px){ .overlay{align-items:center; padding:20px;} }
  .quiz-card{
    background:var(--surface); width:100%; max-width:520px;
    border-radius:var(--radius) var(--radius) 0 0; padding:24px 22px 26px;
    max-height:88vh; overflow-y:auto;
    box-shadow:0 -8px 28px rgba(14,42,67,0.2);
    position:relative;
    animation:modalIn .26s cubic-bezier(.2,.8,.3,1) both;
  }
  @keyframes modalIn{from{opacity:0; transform:translateY(16px);} to{opacity:1; transform:translateY(0);}}
  @media(min-width:640px){ .quiz-card{border-radius:var(--radius);} }
  @media (prefers-reduced-motion: reduce){ .overlay, .quiz-card{animation:none;} }
  .quiz-amt{font-family:'IBM Plex Mono',monospace; font-size:11px; font-weight:600; color:var(--text-muted); text-transform:uppercase; letter-spacing:.06em; display:flex; align-items:center; gap:6px;}
  .quiz-dots{display:flex; gap:6px; margin:10px 0 4px;}
  .quiz-dots .dot{width:8px; height:8px; border-radius:50%; background:var(--locked-bg); flex:0 0 auto; transition:background .2s ease, transform .2s ease;}
  .quiz-dots .dot.done{background:var(--success);}
  .quiz-dots .dot.current{background:var(--blue); transform:scale(1.25);}
  @media (prefers-reduced-motion: reduce){ .quiz-dots .dot{transition:none;} }
  .quiz-question{font-family:'IBM Plex Sans',sans-serif; font-weight:700; font-size:19px; line-height:1.35; margin:10px 0 18px; color:var(--navy);}
  .option{
    display:block; width:100%; text-align:left; padding:13px 14px; margin-bottom:9px;
    border:1.5px solid var(--border); border-radius:var(--radius); background:var(--surface);
    font-size:15.5px; color:var(--text); transition:border-color .14s ease, background .14s ease;
    min-height:44px;
  }
  .option:hover:not(:disabled){border-color:var(--blue); background:var(--blue-light);}
  @keyframes optPop{0%{transform:scale(1);} 45%{transform:scale(1.015);} 100%{transform:scale(1);}}
  @keyframes optShake{0%,100%{transform:translateX(0);} 25%{transform:translateX(-3px);} 75%{transform:translateX(3px);}}
  .option.correct{border-color:var(--success); background:var(--success-tint); animation:optPop .4s ease;}
  .option.wrong{border-color:var(--primary); background:var(--primary-tint); animation:optShake .28s ease;}
  .option:disabled{cursor:default;}
  @keyframes feedIn{from{opacity:0; transform:translateY(-6px);} to{opacity:1; transform:translateY(0);}}
  .feedback{margin-top:14px; padding:13px 14px; border-radius:var(--radius); font-size:14.5px; line-height:1.5; animation:feedIn .3s cubic-bezier(.2,.8,.3,1) both;}
  .feedback.correct{background:var(--success-tint); color:#154a34; border:1px solid var(--success);}
  .feedback.wrong{background:var(--primary-tint); color:#7A0C1E; border:1px solid var(--primary);}
  @media (prefers-reduced-motion: reduce){ .option.correct, .option.wrong, .feedback{animation:none;} }
  .quiz-actions{margin-top:16px; display:flex; justify-content:flex-end; gap:10px;}
  .close-x{
    position:absolute; top:4px; right:6px; background:none; border:none;
    color:var(--text-muted); padding:12px; min-width:44px; min-height:44px;
    display:flex; align-items:center; justify-content:center; border-radius:var(--radius);
  }
  .close-x:hover{background:var(--locked-bg);}

  /* ---------- generic info/confirm dialog (reuses .overlay/.quiz-card) ---------- */
  .info-card h3{font-size:17px; margin:0 0 4px; color:var(--navy);}
  .info-card p{font-size:14.5px; margin:0 0 12px;}
  .info-card ul{margin:0 0 16px; padding-left:20px;}
  .info-card li{font-size:14.5px; line-height:1.55; margin-bottom:6px; color:var(--text);}
  .info-card .quiz-actions{justify-content:flex-end;}
  .fb-question{margin-bottom:18px;}
  .fb-question > label{display:block; font-weight:700; font-size:14px; color:var(--navy); margin-bottom:8px;}
  .fb-question textarea{
    width:100%; font-family:'IBM Plex Sans',sans-serif; font-size:14px; padding:10px 12px;
    border:1.5px solid var(--border); border-radius:var(--radius); background:var(--surface); color:var(--text); resize:vertical;
  }
  .fb-option{
    display:flex; align-items:center; gap:9px; padding:10px 12px; margin-bottom:6px;
    border:1.5px solid var(--border); border-radius:var(--radius); font-size:14px; cursor:pointer;
  }
  .fb-option:hover{border-color:var(--blue); background:var(--blue-light);}
  .fb-option input{flex:0 0 auto; width:18px; height:18px;}
  .fb-scale{display:flex; align-items:center; gap:10px;}
  .fb-scale-options{display:flex; gap:6px; flex:1 1 auto; justify-content:space-between;}
  .fb-scale-option{
    display:flex; flex-direction:column; align-items:center; gap:5px; padding:8px 4px; flex:1 1 0;
    border:1.5px solid var(--border); border-radius:var(--radius); font-size:14px; font-weight:700; cursor:pointer;
  }
  .fb-scale-option:hover{border-color:var(--blue); background:var(--blue-light);}
  .fb-scale-option input{width:16px; height:16px;}
  .fb-scale-label{font-size:11px; color:var(--text-muted); flex:0 0 60px; text-align:center;}
  .btn-plain{
    background:none; border:none; padding:11px 16px; min-height:44px;
    font-weight:600; font-size:14px; color:var(--text-muted); border-radius:var(--radius);
  }
  .btn-plain:hover{background:var(--locked-bg); color:var(--text);}

  /* ---------- stamp / approval effect ----------
     Der Ein-/Ausblend-Zeitpunkt wird von der <stamp-overlay>-Komponente per
     Inline-Style synchron zum 3D-Stempel-Aufprall gesteuert, nicht per
     CSS-Animation - diese Klassen liefern hier nur noch die Text-Optik. */
  .stamp-mark{
    font-family:'IBM Plex Mono',monospace; font-weight:700; font-size:30px; letter-spacing:.06em; text-transform:uppercase;
    color:var(--primary); border:3px solid var(--primary); border-radius:var(--radius); padding:14px 30px;
    display:flex; align-items:center; gap:10px;
    background:rgba(255,255,255,0.9);
  }
  .xp-pop{
    margin-top:10px; text-align:center;
    font-family:'IBM Plex Mono',monospace; font-weight:700; font-size:18px;
    color:var(--tab-4);
  }

  /* ---------- finish celebration (one-shot, transform-only confetti) ---------- */
  .finish-fx{position:fixed; inset:0; display:flex; align-items:center; justify-content:center; pointer-events:none; z-index:61; overflow:hidden;}
  .finish-fx .stamp-mark{
    font-family:'IBM Plex Mono',monospace; font-weight:700; font-size:24px; letter-spacing:.05em; text-transform:uppercase;
    color:var(--primary); border:3px solid var(--primary); border-radius:var(--radius); padding:16px 26px;
    display:flex; align-items:center; gap:10px;
    transform:scale(0.4); opacity:0;
    animation: finishStampIn .5s cubic-bezier(.2,1.4,.4,1) forwards;
    background:rgba(255,255,255,0.95);
  }
  @keyframes finishStampIn{
    0%{transform:scale(2); opacity:0;}
    60%{transform:scale(0.94); opacity:1;}
    100%{transform:scale(1); opacity:1;}
  }
  .finish-fx.fadeout .stamp-mark{transition:opacity .4s ease; opacity:0;}
  .finish-fx .confetti{
    position:absolute; top:50%; left:50%; width:8px; height:14px; border-radius:2px;
    opacity:0; animation:confettiBurst 1.1s ease-out forwards;
  }
  @keyframes confettiBurst{
    0%{transform:translate(-50%,-50%) rotate(0) scale(.6); opacity:1;}
    100%{transform:translate(calc(-50% + var(--dx)), calc(-50% + var(--dy))) rotate(var(--rot)) scale(.9); opacity:0;}
  }
  .finish-fx.fadeout .confetti{opacity:0;}
  @media (prefers-reduced-motion: reduce){
    .finish-fx .stamp-mark{animation:none; opacity:1; transform:scale(1);}
    .finish-fx .confetti{display:none;}
  }
  .winner-stamp .stamp-mark{
    font-size:32px; padding:22px 34px; color:#8a5a00; border-color:#E8B923;
    background:linear-gradient(180deg, #fff8e6, #fff);
    box-shadow:0 8px 30px rgba(232,185,35,.45);
  }

  /* ---------- boot screen ---------- */
  .boot-screen{padding:90px 0 70px; text-align:center; font-family:'IBM Plex Mono',monospace; color:var(--text-muted);}
  .boot-text{font-size:12.5px; letter-spacing:.06em; text-transform:uppercase;}
  .boot-dots::after{content:''; animation:bootdots 1.2s steps(4,end) infinite;}
  @keyframes bootdots{0%{content:'';} 25%{content:'.';} 50%{content:'..';} 75%{content:'...';} 100%{content:'';}}
  @media (prefers-reduced-motion: reduce){ .boot-dots::after{animation:none; content:'...';} }

  /* ---------- toast ---------- */
  .toast{
    position:fixed; left:50%; bottom:22px; transform:translateX(-50%) translateY(0);
    max-width:min(92vw,420px); z-index:70;
    background:var(--navy); color:#fff;
    border-radius:var(--radius); padding:13px 18px; box-shadow:var(--panel-shadow);
    font-size:14px; line-height:1.4; text-align:center;
    animation:toastIn .3s cubic-bezier(.2,.8,.3,1) both;
  }
  .toast.fadeout{animation:toastOut .3s ease both;}
  @keyframes toastIn{from{opacity:0; transform:translateX(-50%) translateY(14px);} to{opacity:1; transform:translateX(-50%) translateY(0);}}
  @keyframes toastOut{from{opacity:1;} to{opacity:0;}}
  @media (prefers-reduced-motion: reduce){ .toast{animation:none;} .toast.fadeout{animation:none; opacity:0;} }

  /* ---------- offline ---------- */
  .offline-banner{
    display:flex; align-items:center; gap:8px;
    font-family:'IBM Plex Mono',monospace; font-size:12.5px; font-weight:600; color:var(--warning);
    background:var(--warning-tint); border:1px solid var(--warning);
    border-radius:var(--radius); padding:10px 14px; margin-bottom:14px;
  }

  /* ---------- admin (internes Orga-Team) ---------- */
  .admin-banner{
    display:flex; align-items:center; gap:8px;
    font-family:'IBM Plex Mono',monospace; font-size:12px; font-weight:700; letter-spacing:.03em;
    color:#fff; background:var(--navy); border-radius:var(--radius); padding:10px 14px; margin-bottom:16px;
  }
  .admin-online{display:flex; align-items:center; gap:6px; margin-left:auto; font-weight:600; color:rgba(255,255,255,.85); text-transform:none; letter-spacing:normal;}
  .admin-online-dot{width:7px; height:7px; border-radius:50%; background:#3ddc84; box-shadow:0 0 0 3px rgba(61,220,132,.25); flex:0 0 auto;}
  .admin-announce-list{list-style:none; margin:12px 0 0; padding:0; display:flex; flex-direction:column; gap:8px;}
  .admin-announce-list li{display:flex; gap:10px; align-items:baseline; font-size:13.5px; border-bottom:1px solid var(--border); padding-bottom:8px;}
  .admin-announce-time{font-family:'IBM Plex Mono',monospace; font-size:11px; color:var(--text-muted); flex:0 0 auto;}
  .admin-table{width:100%; border-collapse:collapse; margin-top:12px; font-size:13.5px;}
  .admin-table th{
    text-align:left; font-family:'IBM Plex Mono',monospace; font-size:10px; text-transform:uppercase;
    letter-spacing:.05em; color:rgba(255,255,255,.6); padding:8px 10px; border-bottom:2px solid rgba(255,255,255,.18);
  }
  .admin-table td{padding:10px; border-bottom:1px solid rgba(255,255,255,.12); color:#fff;}
  .admin-table tr:last-child td{border-bottom:none;}
  .admin-actions{display:flex; gap:10px; flex-wrap:wrap; margin:18px 0;}
  .admin-announce{display:flex; gap:10px; flex-wrap:wrap; align-items:flex-end; margin-top:12px;}
  .admin-announce .field{flex:1 1 220px; margin:0;}
  .admin-note{font-size:12.5px; color:var(--text-muted); margin-top:8px;}
  .admin-schedule-row{display:flex; align-items:center; gap:10px; flex-wrap:wrap; padding:9px 0; border-bottom:1px solid var(--border);}
  .admin-schedule-row:last-of-type{border-bottom:none;}
  .admin-schedule-row label{font-size:13px; color:var(--text-muted); flex:1 1 220px; min-width:0;}
  .admin-schedule-row input[type=text],
  .admin-schedule-row input[type=datetime-local]{flex:1 1 200px; min-height:38px; padding:8px 10px; font-size:13.5px;}
  .admin-schedule-row input[type=number]{min-height:38px; padding:8px 10px; font-size:13.5px; width:80px; flex:0 0 auto;}
  .admin-schedule-group{border:1px solid var(--border); border-radius:var(--radius); margin-bottom:10px; overflow:hidden;}
  .admin-schedule-group summary{

    display:flex; align-items:center; justify-content:space-between; gap:10px; background:var(--bg);
  }

  .admin-nav{display:flex; gap:6px; flex-wrap:wrap; margin-bottom:16px; overflow-x:auto; padding-bottom:2px;}
  .admin-nav-btn{
    display:inline-flex; align-items:center; gap:7px; padding:9px 14px; border:1px solid var(--border);
    border-radius:var(--radius); background:var(--surface); color:var(--text-muted);
    font-size:13px; font-weight:600; white-space:nowrap; flex:0 0 auto; min-height:40px;
  }
  .admin-nav-btn:hover{background:var(--locked-bg);}
  .admin-nav-btn.active{background:var(--navy); border-color:var(--navy); color:#fff;}

  .admin-questions-picker{display:flex; gap:10px; flex-wrap:wrap; margin-bottom:6px;}
  .admin-questions-picker select{flex:1 1 200px; min-height:44px; padding:9px 10px; font-size:14px; border:1.5px solid var(--border); border-radius:var(--radius); background:var(--surface); color:var(--text);}
  .admin-questions-source{font-size:12.5px; color:var(--text-muted); margin:0 0 16px;}
  .admin-question-block{border:1px solid var(--border); border-radius:var(--radius); padding:14px; margin-bottom:12px; background:var(--bg);}
  .admin-question-num{font-family:'IBM Plex Mono',monospace; font-size:11px; font-weight:700; letter-spacing:.06em; text-transform:uppercase; color:var(--text-muted); margin-bottom:8px;}
  .admin-question-block label{display:block; font-size:11.5px; font-weight:600; color:var(--text-muted); margin:10px 0 5px;}
  .admin-question-block textarea, .admin-question-block input[type=text]{
    width:100%; font-family:'IBM Plex Sans',sans-serif; font-size:13.5px; padding:9px 10px;
    border:1.5px solid var(--border); border-radius:var(--radius); background:var(--surface); color:var(--text); resize:vertical;
  }
  .admin-option-row{display:flex; align-items:center; gap:8px; margin-bottom:6px;}
  .admin-option-row input[type=text]{flex:1;}
  .admin-option-row input[type=radio]{flex:0 0 auto; width:18px; height:18px;}

  .btn-sm .inner{padding:8px 14px; font-size:12.5px;}
  .admin-template-list{display:flex; flex-direction:column; gap:8px;}
  .admin-template-row{
    display:flex; align-items:center; justify-content:space-between; gap:10px;
    border:1px solid var(--border); border-radius:var(--radius); padding:10px 12px; background:var(--bg);
  }
  .admin-template-info{display:flex; align-items:center; gap:10px; min-width:0;}
  .admin-template-icon{font-size:22px; flex:0 0 auto;}
  .admin-template-title{font-weight:700; font-size:14px; color:var(--navy);}
  .admin-template-sub{font-size:12px; color:var(--text-muted);}
  .admin-template-form{border:1.5px solid var(--navy); border-radius:var(--radius); padding:16px; margin-top:16px; background:var(--surface);}
  .admin-template-form h4{margin:0 0 12px;}
  .admin-template-form label{display:block; font-size:11.5px; font-weight:600; color:var(--text-muted); margin:10px 0 5px;}
  .admin-template-form input[type=text], .admin-template-form input[type=number]{
    width:100%; font-family:'IBM Plex Sans',sans-serif; font-size:13.5px; padding:9px 10px;
    border:1.5px solid var(--border); border-radius:var(--radius); background:var(--surface); color:var(--text);

  .admin-fb-textlist{margin:0; padding-left:20px;}
  .admin-fb-textlist li{font-size:13.5px; line-height:1.5; margin-bottom:6px; color:var(--text);}

  /* ---------- countdown ---------- */
  .countdown-screen{min-height:52vh; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center;}
  .countdown-card{
    background:var(--navy); color:#fff; border-radius:var(--radius);
    padding:40px 30px; box-shadow:var(--panel-shadow); max-width:400px; width:100%;
  }
  .countdown-label{font-family:'IBM Plex Mono',monospace; font-size:12px; font-weight:600; letter-spacing:.14em; text-transform:uppercase; color:rgba(255,255,255,.62);}
  .countdown-number{
    font-family:'IBM Plex Mono',monospace; font-weight:700; font-variant-numeric:tabular-nums;
    font-size:clamp(72px,20vw,120px); color:var(--primary); line-height:1; margin:14px 0;
  }
  .countdown-team{font-size:14.5px; color:rgba(255,255,255,.85);}

  .wait-card{padding-top:24px;}
  .wait-anim{
    position:relative; height:116px; margin-bottom:18px; border-radius:10px; overflow:hidden;
    background:linear-gradient(180deg, #1c3a57 0%, #17324d 60%, #142a40 100%);
  }

  /* Wolken (beide Szenen) */
  .wait-cloud{position:absolute; top:14px; width:34px; height:11px; border-radius:20px; background:rgba(255,255,255,.2);}
  .wait-cloud::before, .wait-cloud::after{content:''; position:absolute; border-radius:50%; background:rgba(255,255,255,.2);}
  .wait-cloud::before{width:16px; height:16px; top:-7px; left:4px;}
  .wait-cloud::after{width:12px; height:12px; top:-4px; left:18px;}
  .wait-cloud.c1{left:-15%; animation:cloudDrift 16s linear infinite;}
  .wait-cloud.c2{left:-15%; top:34px; transform:scale(.8); animation:cloudDrift 22s linear infinite; animation-delay:-9s;}
  @keyframes cloudDrift{from{transform:translateX(0);} to{transform:translateX(480px);}}

  /* Bus-Szene: parallaxe Skyline + Bäume + Straße mit fahrendem Bus */
  .bus-far{position:absolute; left:0; bottom:34px; height:34px; width:200%; display:flex; align-items:flex-end; gap:16px; animation:scrollFar 10s linear infinite;}
  .bus-far span{display:block; width:18px; background:rgba(255,255,255,.12); border-radius:2px 2px 0 0;}
  .bus-far span:nth-child(odd){height:22px;}
  .bus-far span:nth-child(even){height:32px;}
  @keyframes scrollFar{from{transform:translateX(0);} to{transform:translateX(-50%);}}

  .bus-near{position:absolute; left:0; bottom:34px; height:24px; width:200%; display:flex; align-items:flex-end; gap:30px; animation:scrollNear 4.2s linear infinite;}
  .bus-near span{display:block; position:relative; width:4px; height:14px; background:rgba(255,255,255,.22);}
  .bus-near span::before{content:''; position:absolute; bottom:11px; left:50%; transform:translateX(-50%); width:16px; height:16px; border-radius:50%; background:rgba(255,255,255,.22);}
  @keyframes scrollNear{from{transform:translateX(0);} to{transform:translateX(-50%);}}

  .bus-road-strip{position:absolute; left:0; right:0; bottom:26px; height:3px; background:rgba(255,255,255,.25);}
  .bus-dashes{position:absolute; left:0; right:0; bottom:24px; height:2px; overflow:hidden;}
  .bus-dashes span{position:absolute; top:0; width:16px; height:2px; background:rgba(255,255,255,.4); animation:dashMove 0.85s linear infinite;}
  .bus-dashes span:nth-child(1){left:5%; animation-delay:0s;}
  .bus-dashes span:nth-child(2){left:40%; animation-delay:-.28s;}
  .bus-dashes span:nth-child(3){left:75%; animation-delay:-.56s;}
  @keyframes dashMove{from{transform:translateX(0);} to{transform:translateX(-46px);}}

  .bus-scene{position:absolute; left:50%; bottom:22px; transform:translateX(-50%); width:120px; height:50px; text-align:center;}
  .bus-body{position:relative; z-index:2; font-size:40px; line-height:1; animation:busBounce 1s ease-in-out infinite;}
  @keyframes busBounce{0%,100%{transform:translateY(0) rotate(0deg);} 50%{transform:translateY(-5px) rotate(-1.5deg);}}
  .bus-exhaust{position:absolute; bottom:8px; right:calc(50% + 22px); width:6px; height:6px; border-radius:50%; background:rgba(255,255,255,.45); opacity:0; animation:exhaustPuff 1.3s ease-out infinite;}
  .bus-exhaust.e2{animation-delay:.65s;}
  @keyframes exhaustPuff{0%{opacity:.5; transform:translate(0,0) scale(.6);} 100%{opacity:0; transform:translate(-20px,-12px) scale(1.4);}}

  /* Pause-Szene: Sonne, Bank, dampfende Tasse */
  .break-sun{
    position:absolute; top:10px; right:16px; width:20px; height:20px; border-radius:50%;
    background:radial-gradient(circle, #ffe27a, #ffb84d); box-shadow:0 0 14px 4px rgba(255,200,90,.3);
    animation:sunPulse 3s ease-in-out infinite;
  }
  @keyframes sunPulse{0%,100%{transform:scale(1);} 50%{transform:scale(1.08);}}
  .break-scene{position:absolute; left:50%; bottom:22px; transform:translateX(-50%); width:120px; height:56px; text-align:center;}
  .break-bench{position:absolute; bottom:0; left:50%; transform:translateX(-50%); width:56px; height:4px; background:rgba(255,255,255,.32); border-radius:2px;}
  .break-bench::before, .break-bench::after{content:''; position:absolute; bottom:-9px; width:4px; height:9px; background:rgba(255,255,255,.28);}
  .break-bench::before{left:4px;}
  .break-bench::after{right:4px;}
  .break-cup{position:absolute; z-index:2; bottom:2px; left:50%; transform:translateX(-50%); font-size:34px; line-height:1;}
  .break-steam{
    position:absolute; bottom:52px; width:3px; height:14px; border-radius:2px;
    background:rgba(255,255,255,.5); opacity:0; animation:steamRise 2.2s ease-in-out infinite;
  }
  .break-steam.s1{left:calc(50% - 16px); animation-delay:0s;}
  .break-steam.s2{left:50%; animation-delay:.5s;}
  .break-steam.s3{left:calc(50% + 16px); animation-delay:1s;}
  @keyframes steamRise{0%{opacity:0; transform:translateY(0) scale(1);} 30%{opacity:.7;} 100%{opacity:0; transform:translateY(-26px) scale(1.4);}}

  @media (prefers-reduced-motion: reduce){
    .wait-cloud, .bus-far, .bus-near, .bus-dashes span, .bus-body, .bus-exhaust, .break-sun, .break-steam{animation:none;}
    .break-steam{opacity:.4;}
  }
  .wait-label{font-size:15px; color:rgba(255,255,255,.85); margin-bottom:4px;}
  .wait-label b{color:#fff;}
  .wait-timer{font-family:'IBM Plex Mono',monospace; font-size:34px; font-weight:800; color:#fff; font-variant-numeric:tabular-nums; margin:6px 0 4px;}
  .wait-address{font-family:'IBM Plex Mono',monospace; font-size:17px; font-weight:700; color:#fff; margin:2px 0;}
  .wait-label-sub{font-size:15px; color:rgba(255,255,255,.85);}

  /* ---------- finished ---------- */
  .finished-card{
    text-align:center; background:var(--surface); border:1px solid var(--border);
    border-radius:var(--radius); padding:36px 22px; box-shadow:var(--card-shadow);
  }
  .finished-card .stamp-mark{
    display:inline-flex; align-items:center; gap:8px;
    font-family:'IBM Plex Mono',monospace; font-weight:700; font-size:16px; letter-spacing:.05em; text-transform:uppercase;
    color:var(--primary); border:2px solid var(--primary); border-radius:var(--radius); padding:9px 18px;
    margin-bottom:16px;
  }

  footer.foot{margin-top:30px; text-align:center;}
  footer.foot button{font-size:12.5px; color:rgba(255,255,255,.6); background:none; border:none; text-decoration:underline; padding:10px; min-height:44px;}
  .site-disclaimer{margin-top:36px; text-align:center; font-size:11.5px; color:rgba(255,255,255,.45); line-height:1.5; padding:0 12px;}

  @media (prefers-reduced-motion: reduce){
    .screen{animation:none;}
  }
  .screen{animation:screenIn .38s cubic-bezier(.2,.8,.3,1) both;}
  @keyframes screenIn{from{opacity:0; transform:translateY(10px);} to{opacity:1; transform:translateY(0);}}
</style>
