  function uid(){
    return 'p_' + Math.random().toString(36).slice(2,10) + Date.now().toString(36);
  }

  function genRecoveryCode(){
    var chars = 'ABCDEFGHJKMNPQRSTUVWXYZ23456789'; // ohne 0/O/1/I/L zur besseren Lesbarkeit
    var s = '';
    for(var i=0;i<6;i++){ s += chars[Math.floor(Math.random()*chars.length)]; }
    return s;
  }

  function emptyGroupsState(){
    var g = {};
    GROUPS.forEach(function(gr){ g[gr.id] = {members:[], points:0}; });
    return g;
  }

  function countDone(progress){
    var n = 0;
    for(var k in (progress||{})){ if(progress[k]) n++; }
    return n;
  }

  // Liest die Punkte einer abgeschlossenen Station aus dem Fortschritt.
  // Ältere Einträge speichern nur "true" (vor der Frage-für-Frage-Wertung) -
  // die zählen als volle Punktzahl.
  function stagePoints(entry){
    if(!entry) return 0;
    if(typeof entry === 'object') return entry.points || 0;
    return POINTS_PER_STAGE;
  }

  function sumPoints(progress){
    var total = 0;
    for(var k in (progress||{})){ total += stagePoints(progress[k]); }
    return total;
  }

  // ---------------- Stations-Vorlagen & Routen (Admin-Panel) ----------------
  // Der Admin pflegt einen Vorrat an "Amt"-Vorlagen (Titel, Amt, Icon,
  // Adresse, 5 Fragen mit je eigenen Punkten) und weist jeder Gruppe eine
  // eigene Route von 4 Vorlagen in beliebiger Reihenfolge zu.
  // DEFAULT_TEMPLATES dient nur als Startbestand, damit die Seite auch ohne
  // jede Admin-Pflege sofort spielbar ist - sobald der Admin eine Vorlage
  // mit derselben ID bearbeitet oder neue anlegt, gewinnt state.stationTemplates.
  function allTemplates(){
    var map = {};
    DEFAULT_TEMPLATES.forEach(function(t){ map[t.id] = t; });
    Object.keys(state.stationTemplates||{}).forEach(function(id){ map[id] = state.stationTemplates[id]; });
    return Object.keys(map).map(function(id){ return map[id]; });
  }

  function getTemplate(id){
    if(state.stationTemplates && state.stationTemplates[id]) return state.stationTemplates[id];
    return DEFAULT_TEMPLATES.filter(function(t){ return t.id === id; })[0] || null;
  }

  function groupRoute(groupId){
    var route = state.groupRoutes && state.groupRoutes[groupId];
    if(route && route.length === STATIONS_PER_GROUP && route.every(function(id){ return getTemplate(id); })){
      return route;
    }
    // Fallback ohne konfigurierte Route: die ersten 4 Vorlagen, damit die
    // Rallye auch vor jeder Admin-Pflege sofort spielbar ist.
    return allTemplates().slice(0, STATIONS_PER_GROUP).map(function(t){ return t.id; });
  }

  function groupStages(groupId){
    return groupRoute(groupId).map(function(id){ return getTemplate(id); }).filter(Boolean);
  }

  function stageAddress(stageId){
    var t = getTemplate(stageId);
    return t ? t.address : '';
  }

  // Effektives Passwort einer Gruppe: admin-editiertes Passwort (Tab
  // "Passwörter"), sonst der eingebaute Standard (rallyeN) - so bleibt die
  // Anmeldung auch vor jeder Admin-Pflege sofort nutzbar.
  function groupPassword(groupId){
    var custom = state.groupPasswords && state.groupPasswords[groupId];
    return (custom && String(custom).trim()) ? String(custom).trim() : DEFAULT_GROUP_PASSWORDS[groupId];
  }

  function resolveGroupIdByPassword(pw){
    var lower = (pw||'').toLowerCase();
    var match = GROUPS.filter(function(g){ return groupPassword(g.id).toLowerCase() === lower; })[0];
    return match ? match.id : null;
  }

  // groupId wird nicht mehr für die Fragenauswahl gebraucht (Fragen hängen
  // jetzt an der Vorlage, nicht mehr an der Gruppe) - Parameter bleibt aus
  // Kompatibilitätsgründen an den Aufrufstellen erhalten.
  function stageQuestions(groupId, stageId){
    var t = getTemplate(stageId);
    return t ? t.questions : [];
  }

  // ---------------- Zeitpläne (Admin-Panel) ----------------
  // Optionale, im Admin-Panel gepflegte Ankunftszeiten pro Gruppe/Station.
  // Ist für eine Station/Gruppe nichts hinterlegt, verhält sich die App
  // exakt wie ohne Zeitplan (keine Sperre).
  function stageDueTime(groupId, stageId){
    var sched = state.schedules && state.schedules[groupId];
    return (sched && sched.stage_times && sched.stage_times[stageId]) || null;
  }

  function stageIsBreak(groupId, stageId){
    var sched = state.schedules && state.schedules[groupId];
    return !!(sched && Array.isArray(sched.break_stages) && sched.break_stages.indexOf(stageId) !== -1);
  }

  function deriveGroupsState(groupRows, participantRows){
    var gs = emptyGroupsState();
    (participantRows||[]).forEach(function(p){
      var g = gs[p.group_id];
      if(g) g.members.push({id:p.id, name:p.name});
    });
    (groupRows||[]).forEach(function(row){
      var g = gs[row.id];
      if(g) g.points = sumPoints(row.progress);
    });
    return gs;
  }

  var sb = null;
  function initSupabase(){
    try{
      if(window.supabase && window.supabase.createClient){
        return window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
      }
    }catch(e){ console.warn('Behördenrallye: Supabase-Client konnte nicht erstellt werden.', e); }
    return null;
  }

  function cacheRemoteState(remote){
    try{ localStorage.setItem('behoerdenrallye:cache', JSON.stringify(remote)); }catch(e){ console.warn('Behördenrallye: Cache konnte nicht gespeichert werden.', e); }
  }
  function loadCachedRemoteState(){
    try{ var raw = localStorage.getItem('behoerdenrallye:cache'); if(raw) return JSON.parse(raw); }catch(e){ console.warn('Behördenrallye: Cache konnte nicht gelesen werden.', e); }
    return null;
  }

  async function fetchRemoteState(){
    if(!sb) return null;
    try{
      var groupsRes = await sb.from('groups').select('id,progress');
      var participantsRes = await sb.from('participants').select('id,name,group_id');
      if(groupsRes.error || participantsRes.error){
        console.warn('Behördenrallye: Laden von Supabase fehlgeschlagen.', groupsRes.error || participantsRes.error);
        return null;
      }
      // Zeitpläne sind optional (eigene Tabelle, siehe supabase-setup.sql) -
      // ein Fehler hier (z.B. Tabelle noch nicht angelegt) darf die Rallye
      // selbst nicht offline werfen, es gibt dann einfach keine Zeitsperren.
      var schedules = {};
      try{
        var schedulesRes = await sb.from('schedules').select('*');
        if(!schedulesRes.error && schedulesRes.data){
          schedulesRes.data.forEach(function(row){ schedules[row.id] = row; });
        }
      }catch(e){ /* Zeitplan-Tabelle evtl. noch nicht angelegt - kein Problem */ }

      // Stations-Vorlagen (Amt-Pool) sind ebenso optional (siehe
      // station_templates in supabase-setup.sql) - fehlt die Tabelle, gelten
      // einfach die im Code hinterlegten Standardvorlagen weiter.
      var stationTemplates = {};
      try{
        var templatesRes = await sb.from('station_templates').select('*');
        if(!templatesRes.error && templatesRes.data){
          templatesRes.data.forEach(function(row){
            stationTemplates[row.id] = {id:row.id, title:row.title, amt:row.amt, icon:row.icon, address:row.address, questions:row.questions};
          });
        }
      }catch(e){ /* Tabelle evtl. noch nicht angelegt - kein Problem */ }

      // Pro-Gruppe-Routen (welche 4 Vorlagen in welcher Reihenfolge) sind
      // ebenso optional - ohne Eintrag nutzt groupRoute() automatisch die
      // ersten 4 verfügbaren Vorlagen.
      var groupRoutes = {};
      try{
        var routesRes = await sb.from('group_routes').select('*');
        if(!routesRes.error && routesRes.data){
          routesRes.data.forEach(function(row){ groupRoutes[row.group_id] = row.template_ids || []; });
        }
      }catch(e){ /* Tabelle evtl. noch nicht angelegt - kein Problem */ }

      // Feedback-Formular (Fragenkatalog + Zeitpunkt) ist ebenso optional -
      // ohne Tabelle gibt es einfach kein Feedback-Popup.
      var feedbackForm = null;
      try{
        var feedbackRes = await sb.from('feedback_form').select('*').eq('id', 'main').maybeSingle();
        if(!feedbackRes.error && feedbackRes.data){
          feedbackForm = feedbackRes.data;
        }
      }catch(e){ /* Tabelle evtl. noch nicht angelegt - kein Problem */ }

      // Gruppen-Passwörter sind ebenso optional - ohne Tabelle/Eintrag gilt
      // einfach das eingebaute Standard-Passwort (rallyeN) weiter.
      var groupPasswords = {};
      try{
        var passwordsRes = await sb.from('group_passwords').select('*');
        if(!passwordsRes.error && passwordsRes.data){
          passwordsRes.data.forEach(function(row){ groupPasswords[row.group_id] = row.password; });
        }
      }catch(e){ /* Tabelle evtl. noch nicht angelegt - kein Problem */ }

      // Namensliste der Teammitglieder je Gruppe ist ebenso optional - rein
      // organisatorisch fürs Orga-Team, hat keinen Einfluss auf Login/Spiel.
      var groupMembers = {};
      try{
        var membersRes = await sb.from('group_members').select('*');
        if(!membersRes.error && membersRes.data){
          membersRes.data.forEach(function(row){ groupMembers[row.group_id] = row.names || []; });
        }
      }catch(e){ /* Tabelle evtl. noch nicht angelegt - kein Problem */ }

      return { groups: groupsRes.data, participants: participantsRes.data, schedules: schedules, stationTemplates: stationTemplates, groupRoutes: groupRoutes, feedbackForm: feedbackForm, groupPasswords: groupPasswords, groupMembers: groupMembers };
    }catch(e){
      console.warn('Behördenrallye: Laden von Supabase fehlgeschlagen.', e);
      return null;
    }
  }

  async function refreshGroupsState(){
    var remote = await fetchRemoteState();
    if(remote){
      state.groupRows = remote.groups || [];
      state.participantRows = remote.participants || [];
      state.schedules = remote.schedules || {};
      state.stationTemplates = remote.stationTemplates || {};
      state.groupRoutes = remote.groupRoutes || {};
      state.feedbackForm = remote.feedbackForm || state.feedbackForm;
      state.groupPasswords = remote.groupPasswords || {};
      state.groupMembers = remote.groupMembers || {};
      if(state.offline) showToast('✓ Verbindung wiederhergestellt – Rangliste ist wieder live.');
      state.offline = false;
      cacheRemoteState(remote);
    } else {
      var cached = loadCachedRemoteState();
      state.groupRows = cached ? cached.groups : [];
      state.participantRows = cached ? cached.participants : [];
      state.schedules = cached ? (cached.schedules || {}) : (state.schedules || {});
      state.stationTemplates = cached ? (cached.stationTemplates || {}) : (state.stationTemplates || {});
      state.groupRoutes = cached ? (cached.groupRoutes || {}) : (state.groupRoutes || {});
      state.feedbackForm = cached ? (cached.feedbackForm || state.feedbackForm) : state.feedbackForm;
      state.groupPasswords = cached ? (cached.groupPasswords || {}) : (state.groupPasswords || {});
      state.groupMembers = cached ? (cached.groupMembers || {}) : (state.groupMembers || {});
      state.offline = true;
    }
    state.groupsState = deriveGroupsState(state.groupRows, state.participantRows);
    if(state.participant){
      var myRow = state.groupRows.filter(function(r){ return r.id === state.participant.groupId; })[0];
      state.groupProgress = myRow ? (myRow.progress || {}) : (state.groupProgress || {});
    }
    maybeShowFeedback();
  }

  async function loadParticipant(){
    try{
      var raw = localStorage.getItem('behoerdenrallye:participant');
      if(raw){ return JSON.parse(raw); }
    }catch(e){ console.warn('Behördenrallye: participant konnte nicht gelesen werden.', e); }
    return null;
  }

  async function saveParticipant(p){
    try{ localStorage.setItem('behoerdenrallye:participant', JSON.stringify(p)); }catch(e){
      console.warn('Behördenrallye: participant konnte nicht gespeichert werden.', e);
      showToast('Deine Anmeldung konnte auf diesem Gerät nicht zwischengespeichert werden.');
    }
  }

  var recentlyCompletedByMe = {};

  var announceChannel = null;
  function subscribeRealtime(){
    if(!sb || !sb.channel) return;
    try{
      sb.channel('public:groups')
        .on('postgres_changes', {event:'*', schema:'public', table:'groups'}, handleRemoteGroupsChange)
        .subscribe();
      sb.channel('public:participants')
        .on('postgres_changes', {event:'*', schema:'public', table:'participants'}, handleRemoteParticipantsChange)
        .subscribe();
      sb.channel('public:schedules')
        .on('postgres_changes', {event:'*', schema:'public', table:'schedules'}, handleRemoteScheduleChange)
        .subscribe();
      sb.channel('public:station_templates')
        .on('postgres_changes', {event:'*', schema:'public', table:'station_templates'}, handleRemoteTemplateChange)
        .subscribe();
      sb.channel('public:group_routes')
        .on('postgres_changes', {event:'*', schema:'public', table:'group_routes'}, handleRemoteRouteChange)
        .subscribe();
      sb.channel('public:group_passwords')
        .on('postgres_changes', {event:'*', schema:'public', table:'group_passwords'}, handleRemoteGroupPasswordChange)
        .subscribe();
      sb.channel('public:group_members')
        .on('postgres_changes', {event:'*', schema:'public', table:'group_members'}, handleRemoteGroupMembersChange)
        .subscribe();
      sb.channel('public:announcements')
        .on('postgres_changes', {event:'INSERT', schema:'public', table:'announcements'}, handleRemoteAnnouncementInsert)
        .subscribe();
      announceChannel = sb.channel('behoerdenrallye:announcements');
      announceChannel
        .on('broadcast', {event:'announcement'}, function(msg){
          var text = msg && msg.payload && msg.payload.text;
          if(text) showToast('📣 ' + text);
        })
        .on('broadcast', {event:'winner'}, function(msg){
          var groupId = msg && msg.payload && msg.payload.groupId;
          if(state.participant && groupId === state.participant.groupId) showWinnerFx();
        })
        .subscribe();
    }catch(e){ console.warn('Behördenrallye: Live-Verbindung konnte nicht aufgebaut werden.', e); }
  }

  async function sendAnnouncement(text){
    if(!announceChannel) return {error:'no-channel'};
    var res = await announceChannel.send({type:'broadcast', event:'announcement', payload:{text:text}});
    // Zusätzlich in der DB ablegen, damit alle gerade eingeloggten Admins
    // (nicht nur der, der sie geschrieben hat) die zuletzt gesendeten
    // Durchsagen im Panel sehen - der Broadcast selbst wird nirgends
    // gespeichert und würde für später eingeloggte Admins verloren gehen.
    if(sb){
      try{ await sb.from('announcements').insert({text: text}); }
      catch(e){ console.warn('Behördenrallye: Durchsage konnte nicht im Verlauf gespeichert werden.', e); }
    }
    return res;
  }

  // Zeigt an, wie viele Admin-Panels (egal welche Rolle) gerade verbunden
  // sind - reine Live-Anwesenheit über Supabase Realtime Presence, es wird
  // nichts in der Datenbank gespeichert.
  var adminPresenceChannel = null;
  function subscribeAdminPresence(){
    if(adminPresenceChannel || !sb || !sb.channel) return;
    try{
      adminPresenceChannel = sb.channel('behoerdenrallye:admin-presence', {config:{presence:{key: uid()}}});
      adminPresenceChannel
        .on('presence', {event:'sync'}, function(){
          state.adminOnlineCount = Object.keys(adminPresenceChannel.presenceState()).length;
          if(state.screen === 'admin') render();
        })
        .subscribe(async function(status){
          if(status === 'SUBSCRIBED'){
            await adminPresenceChannel.track({online_at: new Date().toISOString()});
          }
        });
    }catch(e){ console.warn('Behördenrallye: Admin-Anwesenheit konnte nicht aufgebaut werden.', e); }
  }

  async function loadRecentAnnouncements(){
    if(!sb) return;
    try{
      var res = await sb.from('announcements').select('*').order('created_at', {ascending:false}).limit(10);
      if(!res.error && res.data) state.recentAnnouncements = res.data;
    }catch(e){ console.warn('Behördenrallye: Durchsagen-Verlauf konnte nicht geladen werden.', e); }
  }

  // Löst bei der Siegerehrung auf dem Gerät des aktuell führenden Teams eine
  // große Sieger-Animation aus (per Realtime-Broadcast, nichts wird
  // gespeichert). Andere Teams bekommen nichts angezeigt.
  async function triggerWinnerAnimation(){
    var ranked = GROUPS.map(function(gr){ return {id: gr.id, name: gr.name, points: groupPoints(gr.id)}; })
      .sort(function(a,b){ return b.points - a.points; });
    var leader = ranked[0];
    if(!leader || leader.points <= 0){ showToast('Noch keine Punkte - es gibt noch kein führendes Team.'); return; }
    if(!announceChannel){ showToast('Keine Live-Verbindung.'); return; }
    await announceChannel.send({type:'broadcast', event:'winner', payload:{groupId: leader.id}});
    state.adminWinnerSent = true;
    render();
    setTimeout(function(){ state.adminWinnerSent = false; render(); }, 5000);
  }

  function handleRemoteGroupsChange(payload){
    var row = payload.new;
    if(!row || !row.id) return;
    state.groupRows = (state.groupRows||[]).filter(function(r){ return r.id !== row.id; }).concat([row]);

    if(state.participant && state.participant.groupId === row.id){
      var oldProgress = state.groupProgress || {};
      var newlyDone = Object.keys(row.progress||{}).filter(function(k){ return row.progress[k] && !oldProgress[k]; });
      state.groupProgress = row.progress || {};
      newlyDone.forEach(function(stageId){
        if(recentlyCompletedByMe[stageId]) return;
        var stage = getTemplate(stageId);
        if(stage) showToast('⚡ Euer Team hat „' + stage.title + '" abgeschlossen!');
      });
    }

    state.groupsState = deriveGroupsState(state.groupRows, state.participantRows);
    cacheRemoteState({groups:state.groupRows, participants:state.participantRows, schedules:state.schedules, stationTemplates:state.stationTemplates, groupRoutes:state.groupRoutes, groupPasswords:state.groupPasswords, groupMembers:state.groupMembers});
    if(state.screen==='map' || state.screen==='finished' || state.screen==='admin'){ render(); }
  }

  function handleRemoteParticipantsChange(payload){
    var row = payload.eventType === 'DELETE' ? payload.old : payload.new;
    if(!row) return;
    state.participantRows = (state.participantRows||[]).filter(function(r){ return r.id !== row.id; });
    if(payload.eventType !== 'DELETE'){ state.participantRows = state.participantRows.concat([row]); }
    state.groupsState = deriveGroupsState(state.groupRows, state.participantRows);
    cacheRemoteState({groups:state.groupRows, participants:state.participantRows, schedules:state.schedules, stationTemplates:state.stationTemplates, groupRoutes:state.groupRoutes, groupPasswords:state.groupPasswords, groupMembers:state.groupMembers});
    if(state.screen==='map' || state.screen==='finished' || state.screen==='admin'){ render(); }
  }

  function handleRemoteScheduleChange(payload){
    var row = payload.eventType === 'DELETE' ? payload.old : payload.new;
    if(!row || !row.id) return;
    if(payload.eventType === 'DELETE'){ delete state.schedules[row.id]; }
    else { state.schedules[row.id] = row; }
    cacheRemoteState({groups:state.groupRows, participants:state.participantRows, schedules:state.schedules, stationTemplates:state.stationTemplates, groupRoutes:state.groupRoutes, groupPasswords:state.groupPasswords, groupMembers:state.groupMembers});

    if(state.participant && row.id === state.participant.groupId){
      if(state.screen === 'waiting'){
        // Admin könnte den Zeitplan gerade angepasst haben - neu bewerten.
        var gate = nextGateCheck();
        if(gate){
          state.waitTargetTime = gate.dueMs;
          state.waitIsBreak = stageIsBreak(state.participant.groupId, groupStages(state.participant.groupId)[gate.index].id);
          render();
        } else {
          enterMap();
        }
      } else if(state.screen === 'map'){
        render();
      }
    } else if(state.screen === 'admin'){
      render();
    }
  }

  function handleRemoteTemplateChange(payload){
    var row = payload.eventType === 'DELETE' ? payload.old : payload.new;
    if(!row || !row.id) return;
    if(payload.eventType === 'DELETE'){ delete state.stationTemplates[row.id]; }
    else { state.stationTemplates[row.id] = {id:row.id, title:row.title, amt:row.amt, icon:row.icon, address:row.address, questions:row.questions}; }
    cacheRemoteState({groups:state.groupRows, participants:state.participantRows, schedules:state.schedules, stationTemplates:state.stationTemplates, groupRoutes:state.groupRoutes, groupPasswords:state.groupPasswords, groupMembers:state.groupMembers});
    if(state.screen === 'map' || state.screen === 'admin'){ render(); }
  }

  function handleRemoteRouteChange(payload){
    var row = payload.eventType === 'DELETE' ? payload.old : payload.new;
    if(!row || !row.group_id) return;
    if(payload.eventType === 'DELETE'){ delete state.groupRoutes[row.group_id]; }
    else { state.groupRoutes[row.group_id] = row.template_ids || []; }
    cacheRemoteState({groups:state.groupRows, participants:state.participantRows, schedules:state.schedules, stationTemplates:state.stationTemplates, groupRoutes:state.groupRoutes, groupPasswords:state.groupPasswords, groupMembers:state.groupMembers});
    if(state.screen === 'map' || state.screen === 'admin'){ render(); }
  }

  function handleRemoteGroupPasswordChange(payload){
    var row = payload.eventType === 'DELETE' ? payload.old : payload.new;
    if(!row || !row.group_id) return;
    if(payload.eventType === 'DELETE'){ delete state.groupPasswords[row.group_id]; }
    else { state.groupPasswords[row.group_id] = row.password; }
    cacheRemoteState({groups:state.groupRows, participants:state.participantRows, schedules:state.schedules, stationTemplates:state.stationTemplates, groupRoutes:state.groupRoutes, groupPasswords:state.groupPasswords, groupMembers:state.groupMembers});
    if(state.screen === 'admin'){ render(); }
  }

  function handleRemoteGroupMembersChange(payload){
    var row = payload.eventType === 'DELETE' ? payload.old : payload.new;
    if(!row || !row.group_id) return;
    if(payload.eventType === 'DELETE'){ delete state.groupMembers[row.group_id]; }
    else { state.groupMembers[row.group_id] = row.names || []; }
    cacheRemoteState({groups:state.groupRows, participants:state.participantRows, schedules:state.schedules, stationTemplates:state.stationTemplates, groupRoutes:state.groupRoutes, groupPasswords:state.groupPasswords, groupMembers:state.groupMembers});
    if(state.screen === 'admin'){ render(); }
  }

  function handleRemoteAnnouncementInsert(payload){
    var row = payload.new;
    if(!row) return;
    state.recentAnnouncements = [row].concat(state.recentAnnouncements||[]).slice(0, 10);
    if(state.screen === 'admin'){ render(); }
  }

  function isAdminUrl(){
    return location.hash === '#admin';
  }

  async function init(){
    sb = initSupabase();
    try{ state.feedbackSubmitted = localStorage.getItem('behoerdenrallye:feedback_done') === '1'; }catch(e){}
    if(isAdminUrl()){
      state.screen = 'adminLogin';
      render();
      subscribeRealtime();
      return;
    }
    var p = await loadParticipant();
    await refreshGroupsState();
    if(p && p.groupId){
      state.participant = p;
      var myRow = state.groupRows.filter(function(r){ return r.id === p.groupId; })[0];
      state.groupProgress = myRow ? (myRow.progress || {}) : {};
      var allDone = groupStages(p.groupId).every(function(s){ return state.groupProgress[s.id]; });
      if(allDone){ state.screen = 'finished'; state.boardOpen = true; }
      else { state.screen = 'map'; }
    } else {
      state.screen = 'intro';
    }
    render();
    subscribeRealtime();
    startPolling();
    if(state.screen === 'map'){
      var gate = nextGateCheck();
      if(gate) startWaitScreen(gate.index);
    }
    maybeShowFeedback();
  }

  function startPolling(){
    setInterval(async function(){
      if(document.hidden) return;
      if(state.screen === 'map' || state.screen === 'finished' || state.screen === 'admin'){
        await refreshGroupsState();
        render();
      }
    }, 15000);
  }

  function groupOccupancy(id){
    var g = state.groupsState[id];
    return g ? g.members.length : 0;
  }
  function groupPoints(id){
    var g = state.groupsState[id];
    return g ? g.points : 0;
  }

  async function handlePasswordSubmit(){
    state.error = null;
    var pw = (state.passwordInput||'').trim().toLowerCase();
    if(!pw){ state.error = 'Bitte gib das Passwort eurer Gruppe ein.'; render(); return; }
    var groupId = resolveGroupIdByPassword(pw);
    if(!groupId){ state.error = 'Unbekanntes Passwort. Bitte bei der Rallye-Leitung nachfragen.'; render(); return; }
    if(!sb){
      state.error = 'Keine Verbindung zur Rallye-Datenbank. Bitte Internetverbindung prüfen und Seite neu laden.';
      render();
      return;
    }
    if(groupOccupancy(groupId) >= CAPACITY){
      state.error = 'Eure Gruppe hat bereits '+CAPACITY+' Mitglieder auf Geräten angemeldet.';
      render();
      return;
    }

    state.joining = true;
    render();

    var id = uid();
    var code = genRecoveryCode();
    var insertRes;
    try{
      insertRes = await sb.from('participants').insert({id:id, name:'Teilnehmer:in', group_id:groupId, recovery_code:code}).select().single();
    }catch(e){
      insertRes = { error: e };
    }
    state.joining = false;

    if(insertRes.error){
      var msg = String((insertRes.error && insertRes.error.message) || '');
      state.error = msg.indexOf('GROUP_FULL') !== -1
        ? 'Eure Gruppe hat bereits '+CAPACITY+' Mitglieder auf Geräten angemeldet.'
        : 'Anmeldung gerade nicht möglich. Bitte kurz erneut versuchen.';
      console.warn('Behördenrallye: Anmeldung fehlgeschlagen.', insertRes.error);
      await refreshGroupsState();
      render();
      return;
    }

    var participant = {id:id, name:'Teilnehmer:in', groupId:groupId, recoveryCode:code};
    await saveParticipant(participant);
    state.participant = participant;
    await refreshGroupsState();
    startCountdown();
  }

  async function handleAdminPasswordSubmit(){
    state.error = null;
    var pw = (state.adminPasswordInput||'').trim();
    if(!pw){ state.error = 'Bitte Admin-Passwort eingeben.'; render(); return; }
    var role = ADMIN_PASSWORDS[pw];
    if(!role){ state.error = 'Falsches Passwort.'; render(); return; }
    state.adminRole = role;
    state.adminTab = 'overview';
    state.adminJoining = true;
    render();
    await refreshGroupsState();
    await loadRecentAnnouncements();
    subscribeAdminPresence();
    state.adminJoining = false;
    state.screen = 'admin';
    render();
  }

  function stageStatus(stageId, index){
    if(!state.participant) return 'locked';
    var progress = state.groupProgress || {};
    if(progress[stageId]) return 'done';
    var firstUndone = groupStages(state.participant.groupId).findIndex(function(s){ return !progress[s.id]; });
    if(index !== firstUndone) return 'locked';
    // Stationen ab der zweiten können per Zeitplan gesperrt sein, bis die
    // Gruppe an der Adresse sein sollte (siehe Wartebildschirm/Admin-Zeitplan).
    // Die erste Station bleibt bewusst immer sofort verfügbar.
    if(index > 0){
      var due = stageDueTime(state.participant.groupId, stageId);
      if(due){
        var dueMs = new Date(due).getTime();
        if(!isNaN(dueMs) && Date.now() < dueMs) return 'locked';
      }
    }
    return 'current';
  }

  // Prüft, ob die nächste noch offene Station zeitlich gesperrt ist.
  // Gibt {index, dueMs} zurück, wenn ein Wartebildschirm gezeigt werden soll,
  // sonst null (kein Zeitplan hinterlegt, oder Zeit bereits erreicht).
  function nextGateCheck(){
    if(!state.participant) return null;
    var progress = state.groupProgress || {};
    var stages = groupStages(state.participant.groupId);
    var firstUndone = stages.findIndex(function(s){ return !progress[s.id]; });
    if(firstUndone <= 0) return null;
    var stage = stages[firstUndone];
    var due = stageDueTime(state.participant.groupId, stage.id);
    if(!due) return null;
    var dueMs = new Date(due).getTime();
    if(isNaN(dueMs) || Date.now() >= dueMs) return null;
    return { index: firstUndone, dueMs: dueMs };
  }

  var waitInterval = null;
  function startWaitScreen(index){
    if(waitInterval){ clearInterval(waitInterval); waitInterval = null; }
    var stage = groupStages(state.participant.groupId)[index];
    var due = stageDueTime(state.participant.groupId, stage.id);
    var dueMs = due ? new Date(due).getTime() : NaN;
    if(!due || isNaN(dueMs) || Date.now() >= dueMs){ enterMap(); return; }
    state.screen = 'waiting';
    state.waitStageIndex = index;
    state.waitTargetTime = dueMs;
    state.waitIsBreak = stageIsBreak(state.participant.groupId, stage.id);
    render();
    waitInterval = setInterval(function(){
      if(Date.now() >= state.waitTargetTime){
        clearInterval(waitInterval);
        waitInterval = null;
        enterMap();
        return;
      }
      render();
    }, 1000);
  }

  function enterMap(){
    if(waitInterval){ clearInterval(waitInterval); waitInterval = null; }
    state.screen = 'map';
    var gate = nextGateCheck();
    if(gate) startWaitScreen(gate.index);
    else render();
  }

  var quizFocusApplied = false;
  function openQuiz(index){
    state.activeQuizIndex = index;
    state.quizQuestionIndex = 0;
    state.quizSelectedOption = null;
    state.quizAnswered = false;
    state.quizEarnedPoints = 0;
    quizFocusApplied = false;
    render();
  }

  function closeQuiz(){
    state.activeQuizIndex = null;
    state.quizQuestionIndex = 0;
    state.quizSelectedOption = null;
    state.quizAnswered = false;
    state.quizEarnedPoints = 0;
    render();
  }

  function selectOption(optIndex){
    if(state.quizAnswered) return;
    state.quizSelectedOption = optIndex;
    state.quizAnswered = true;
    var stage = groupStages(state.participant.groupId)[state.activeQuizIndex];
    var q = stageQuestions(state.participant.groupId, stage.id)[state.quizQuestionIndex];
    var isCorrect = optIndex === q.correct;
    if(isCorrect) state.quizEarnedPoints += (q.points || 0);
    try{ if(navigator.vibrate) navigator.vibrate(isCorrect ? 40 : [30,60,30]); }catch(e){}
    render();
  }

  function advanceQuiz(){
    var stage = groupStages(state.participant.groupId)[state.activeQuizIndex];
    var qList = stageQuestions(state.participant.groupId, stage.id);
    if(state.quizQuestionIndex < qList.length - 1){
      state.quizQuestionIndex++;
      state.quizSelectedOption = null;
      state.quizAnswered = false;
      render();
    } else {
      finishStageQuiz();
    }
  }

  async function finishStageQuiz(){
    var stage = groupStages(state.participant.groupId)[state.activeQuizIndex];

    if(!(state.groupProgress && state.groupProgress[stage.id])){
      var earnedPoints = state.quizEarnedPoints;
      state.groupProgress = Object.assign({}, state.groupProgress);
      state.groupProgress[stage.id] = {done:true, points:earnedPoints};
      recentlyCompletedByMe[stage.id] = Date.now();

      if(sb){
        try{
          var res = await sb.rpc('complete_stage', {p_group_id: state.participant.groupId, p_stage_id: stage.id, p_points: earnedPoints});
          if(res.error){
            console.warn('Behördenrallye: Mission konnte nicht mit dem Team synchronisiert werden.', res.error);
            showToast('Deine Antworten wurden gewertet, sind aber gerade nicht mit dem Team synchronisiert.');
          } else if(res.data){
            state.groupProgress = res.data;
          }
        }catch(e){
          console.warn('Behördenrallye: Mission konnte nicht mit dem Team synchronisiert werden.', e);
          showToast('Deine Antworten wurden gewertet, sind aber gerade nicht mit dem Team synchronisiert.');
        }
      }
      await refreshGroupsState();
      state.boardPulseUntil = Date.now() + 1200;
      announce('Fallakte abgeschlossen: +'+earnedPoints+' Punkte für euer Team.');

      showStampFx(earnedPoints);

      var allDone = groupStages(state.participant.groupId).every(function(s){ return state.groupProgress[s.id]; });
      if(allDone){
        setTimeout(function(){
          state.screen = 'finished';
          state.activeQuizIndex = null;
          state.boardOpen = true;
          render();
          showFinishFx();
        }, 900);
        return;
      }
    }
    closeQuiz();
    var gate = nextGateCheck();
    if(gate) startWaitScreen(gate.index);
  }

  function showStampFx(earnedPoints){
    var fx = document.createElement('stamp-overlay');
    fx.setAttribute('xp', '+'+earnedPoints+' XP');
    document.body.appendChild(fx);
    setTimeout(function(){ fx.remove(); }, 2100);
  }

  // ---------------- 3D Amtsstempel (WebGL, Uiverse-artige Ein-Zweck-Komponente) ----------------
  // Presst einen 3D-Stempel auf die Seite und hinterlässt "GENEHMIGT" + die XP-Zahl.
  // Lädt three.js dynamisch von CDN nach; scheitert das (kein Netz/WebGL), wird der
  // Ink-Text trotzdem sofort eingeblendet, so bleibt die Funktion immer nutzbar.
  var THREE_URL = 'https://unpkg.com/three@0.184.0/build/three.module.js';
  var threePromise = null;
  function loadThree(){ threePromise = threePromise || import(THREE_URL); return threePromise; }
  (function(){
    var easeIn = function(t){ return t*t*t; };
    var easeOut = function(t){ return 1 - Math.pow(1-t, 3); };
    var clamp01 = function(t){ return Math.max(0, Math.min(1, t)); };

    class StampOverlay extends HTMLElement {
      connectedCallback(){
        if(this._booted) return;
        this._booted = true;
        var xp = this.getAttribute('xp') || '';
        this.style.cssText = 'position:fixed;inset:0;z-index:60;pointer-events:none;display:block';
        this.innerHTML =
          '<canvas data-stamp-canvas style="position:absolute;inset:0;width:100%;height:100%;display:block;z-index:2"></canvas>'+
          '<div data-ink style="position:absolute;inset:0;z-index:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;opacity:0">'+
            '<div class="stamp-mark">GENEHMIGT</div>'+
            '<div class="xp-pop" data-xp>'+esc(xp)+'</div>'+
          '</div>';
        this._ink = this.querySelector('[data-ink]');
        this._xpEl = this.querySelector('[data-xp]');
        if(matchMedia('(prefers-reduced-motion: reduce)').matches){
          this._ink.style.opacity = '1';
          this._xpEl.style.opacity = '1';
          return;
        }
        this._start();
      }

      disconnectedCallback(){
        this._dead = true;
        if(this._timer) clearInterval(this._timer);
        if(this._raf) cancelAnimationFrame(this._raf);
      }

      async _start(){
        var self = this;
        var canvas = this.querySelector('[data-stamp-canvas]');
        var THREE, buildStamp;
        try{
          var mods = await Promise.all([loadThree(), import('./stamp-model.js')]);
          THREE = mods[0]; buildStamp = mods[1].buildStamp;
        }catch(e){
          console.warn('Behördenrallye: 3D-Stempel nicht verfügbar, zeige nur den Text-Stempel.', e);
          this._ink.style.opacity = '1'; this._xpEl.style.opacity = '1';
          return;
        }
        if(this._dead) return;

        var w = this.clientWidth || window.innerWidth, h = this.clientHeight || window.innerHeight;
        var renderer;
        try{
          renderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: true, alpha: true, preserveDrawingBuffer: true });
        }catch(e){
          console.warn('Behördenrallye: WebGL nicht verfügbar, zeige nur den Text-Stempel.', e);
          this._ink.style.opacity = '1'; this._xpEl.style.opacity = '1';
          return;
        }
        renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
        renderer.setSize(w, h, false);
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;

        var scene = new THREE.Scene();
        var camera = new THREE.PerspectiveCamera(34, w/h, 0.01, 10);
        camera.position.set(0.10, 0.20, 0.52);
        camera.lookAt(0, 0.07, 0);

        scene.add(new THREE.HemisphereLight(0xffffff, 0x9aa5b1, 0.85));
        var key = new THREE.DirectionalLight(0xffffff, 1.5);
        key.position.set(0.28, 0.5, 0.3);
        key.castShadow = true;
        key.shadow.mapSize.set(1024, 1024);
        key.shadow.camera.near = 0.05; key.shadow.camera.far = 1.5;
        key.shadow.camera.left = -0.2; key.shadow.camera.right = 0.2;
        key.shadow.camera.top = 0.2; key.shadow.camera.bottom = -0.2;
        scene.add(key);
        scene.add(new THREE.DirectionalLight(0xffffff, 0.4).translateX(-0.4));

        var shadowPlane = new THREE.Mesh(
          new THREE.PlaneGeometry(0.8, 0.8),
          new THREE.ShadowMaterial({ opacity: 0.26 })
        );
        shadowPlane.name = 'contact_shadow';
        shadowPlane.rotation.x = -Math.PI/2;
        shadowPlane.receiveShadow = true;
        scene.add(shadowPlane);

        var stamp = buildStamp(THREE);
        stamp.traverse(function(o){ if(o.isMesh) o.castShadow = true; });
        scene.add(stamp);

        var t0 = performance.now();
        function tick(now){
          if(self._dead){ clearInterval(self._timer); return; }
          var t = now - t0;
          var y, tilt = 0, sy = 1;
          if(t < 380){ var k1 = easeIn(clamp01(t/380)); y = 0.19 - 0.178*k1; tilt = -0.07*(1-k1); }
          else if(t < 450){ var k2 = clamp01((t-380)/70); y = 0.012 - 0.012*k2; sy = 1 - 0.02*k2; }
          else if(t < 560){ y = 0; sy = 0.98; }
          else { var k3 = easeOut(clamp01((t-560)/420)); y = 0.26*k3; sy = 0.98 + 0.02*k3; }
          stamp.position.y = y;
          stamp.rotation.z = tilt;
          stamp.scale.y = sy;
          var fade = t > 1500 ? 1 - clamp01((t-1500)/400) : 1;
          self.style.opacity = String(fade);
          if(t > 400 && self._ink.style.opacity !== '1'){
            self._ink.style.transition = 'opacity .18s ease, transform .3s cubic-bezier(.2,1.4,.4,1)';
            self._ink.style.transform = 'scale(1.05)';
            self._ink.style.opacity = '1';
            setTimeout(function(){ self._ink.style.transform = 'scale(1)'; }, 20);
            self._xpEl.style.transition = 'opacity .4s ease .12s, transform .4s ease .12s';
            self._xpEl.style.transform = 'translateY(0)';
            self._xpEl.style.opacity = '1';
          }
          renderer.render(scene, camera);
          self._frames = (self._frames||0) + 1;
          if(t >= 1950){ self._done = true; clearInterval(self._timer); if(self._raf) cancelAnimationFrame(self._raf); renderer.dispose(); return; }
          if(self._raf !== undefined) self._raf = requestAnimationFrame(tick);
        }
        this._xpEl.style.transform = 'translateY(6px)';
        this._raf = requestAnimationFrame(tick);
        tick(performance.now());
        // Fallback-Takt: manche Hintergrund-Tabs feuern rAF nie.
        setTimeout(function(){
          if(self._dead || self._done || self._frames > 2) return;
          cancelAnimationFrame(self._raf);
          self._raf = undefined;
          self._timer = setInterval(function(){ tick(performance.now()); }, 16);
        }, 120);
      }
    }

    if(!customElements.get('stamp-overlay')) customElements.define('stamp-overlay', StampOverlay);
  })();

  // Hält Tab-Fokus innerhalb eines Dialogs und ruft onEscape bei Escape auf -
  // wird von Quiz-, Bestätigungs- und Info-Dialogen gemeinsam genutzt.
  function trapFocus(container, onEscape){
    function onKey(e){
      if(e.key === 'Escape' && onEscape){ onEscape(); return; }
      if(e.key !== 'Tab') return;
      var focusables = container.querySelectorAll('button:not(:disabled), [href], input:not(:disabled), [tabindex]:not([tabindex="-1"])');
      if(!focusables.length) return;
      var first = focusables[0], last = focusables[focusables.length-1];
      if(e.shiftKey && document.activeElement === first){ e.preventDefault(); last.focus(); }
      else if(!e.shiftKey && document.activeElement === last){ e.preventDefault(); first.focus(); }
    }
    container.addEventListener('keydown', onKey);
    return function(){ container.removeEventListener('keydown', onKey); };
  }

  async function submitFeedback(closeFn){
    var answers = {};
    (state.feedbackForm.questions||[]).forEach(function(q){
      if(q.type === 'text'){
        var el = document.querySelector('[data-fb-field="'+q.id+'"]');
        answers[q.id] = el ? el.value.trim() : '';
      } else {
        var checked = document.querySelector('input[data-fb-field="'+q.id+'"]:checked');
        answers[q.id] = checked ? checked.value : null;
      }
    });
    if(!sb){ showToast('Keine Verbindung - Feedback kann gerade nicht gesendet werden.'); return; }
    try{
      var res = await sb.from('feedback_responses').insert({answers: answers});
      if(res.error){
        console.warn('Behördenrallye: Feedback konnte nicht gesendet werden.', res.error);
        showToast('Feedback konnte gerade nicht gesendet werden.');
        return;
      }
      try{ localStorage.setItem('behoerdenrallye:feedback_done', '1'); }catch(e){}
      state.feedbackSubmitted = true;
      closeFn();
      showToast('✓ Danke für euer Feedback!');
    }catch(e){
      console.warn('Behördenrallye: Feedback konnte nicht gesendet werden.', e);
      showToast('Feedback konnte gerade nicht gesendet werden.');
    }
  }

  // Countdown bei "Wettbewerb läuft in ..." - zählt auf 0 am 07.10.2026.
  var COUNTDOWN_TARGET = new Date(2026, 9, 7, 0, 0, 0);
  function formatCountdown(){
    var diff = COUNTDOWN_TARGET.getTime() - Date.now();
    if(diff <= 0) return 'Wettbewerb läuft!';
    var totalSeconds = Math.floor(diff/1000);
    var days = Math.floor(totalSeconds/86400);
    var hours = Math.floor((totalSeconds%86400)/3600);
    var minutes = Math.floor((totalSeconds%3600)/60);
    var seconds = totalSeconds%60;
    var pad = function(n){ return String(n).padStart(2,'0'); };
    return 'Wettbewerb läuft in '+days+' Tg '+pad(hours)+':'+pad(minutes)+':'+pad(seconds);
  }
  var countdownInterval = setInterval(function(){
    var el = document.getElementById('heroCountdown');
    if(el) el.textContent = formatCountdown();
    if(COUNTDOWN_TARGET.getTime() - Date.now() <= 0) clearInterval(countdownInterval);
  }, 1000);

  function formatClockTime(iso){
    var d = new Date(iso);
    if(isNaN(d.getTime())) return '--:--';
    var pad = function(n){ return String(n).padStart(2,'0'); };
    return pad(d.getHours())+':'+pad(d.getMinutes());
  }

  function formatDuration(ms){
    var totalSeconds = Math.max(0, Math.floor(ms/1000));
    var h = Math.floor(totalSeconds/3600);
    var m = Math.floor((totalSeconds%3600)/60);
    var s = totalSeconds%60;
    var pad = function(n){ return String(n).padStart(2,'0'); };
    return (h > 0 ? h+':'+pad(m) : m)+':'+pad(s);
  }

  async function resetGroupProgress(groupId){
    // Der Button existiert für die eingeschränkte "Rangliste"-Rolle gar
    // nicht im DOM (siehe renderAdminOverview) - diese Prüfung ist nur ein
    // zusätzliches Sicherheitsnetz, falls die Funktion doch aufgerufen wird.

    var groupName = groupDef ? groupDef.name : groupId;
    if(!window.confirm('Fortschritt von '+groupName+' wirklich zurücksetzen? Das kann nicht rückgängig gemacht werden.')) return;
    if(!sb){ showToast('Keine Verbindung zur Datenbank.'); return; }
    try{
      var res = await sb.rpc('reset_group_progress', {p_group_id: groupId});
      if(res.error){
        console.warn('Behördenrallye: Fortschritt konnte nicht zurückgesetzt werden.', res.error);

        return;
      }
      await refreshGroupsState();

    }catch(e){
      console.warn('Behördenrallye: Fortschritt konnte nicht zurückgesetzt werden.', e);

      var maxEl = document.querySelector('[data-fbq-scale-max="'+qi+'"]');
      var minLabelEl = document.querySelector('[data-fbq-scale-minlabel="'+qi+'"]');
      var maxLabelEl = document.querySelector('[data-fbq-scale-maxlabel="'+qi+'"]');
      if(textEl) state.feedbackDraftQuestions[qi].question = textEl.value;
      if(optsEl) state.feedbackDraftQuestions[qi].options = optsEl.value.split('\n');
      if(catEl) state.feedbackDraftQuestions[qi].category = catEl.value;
      if(minEl) state.feedbackDraftQuestions[qi].scale_min = parseInt(minEl.value, 10);
      if(maxEl) state.feedbackDraftQuestions[qi].scale_max = parseInt(maxEl.value, 10);
      if(minLabelEl) state.feedbackDraftQuestions[qi].scale_min_label = minLabelEl.value;

    }

  async function saveFeedbackForm(){
    var hoursEl = document.getElementById('fbTriggerHours');
    var hours = hoursEl ? parseFloat(hoursEl.value) : 3;
    if(isNaN(hours) || hours < 0) hours = 0;

    var count = document.querySelectorAll('#fbQuestionBlocks .admin-question-block').length;
    var questions = [];
    for(var qi=0; qi<count; qi++){
      var typeEl = document.querySelector('[data-fbq-type="'+qi+'"]');
      var textEl = document.querySelector('[data-fbq-text="'+qi+'"]');
      var optsEl = document.querySelector('[data-fbq-options="'+qi+'"]');
      var catEl = document.querySelector('[data-fbq-category="'+qi+'"]');
      var minEl = document.querySelector('[data-fbq-scale-min="'+qi+'"]');
      var maxEl = document.querySelector('[data-fbq-scale-max="'+qi+'"]');
      var minLabelEl = document.querySelector('[data-fbq-scale-minlabel="'+qi+'"]');
      var maxLabelEl = document.querySelector('[data-fbq-scale-maxlabel="'+qi+'"]');
      var type = typeEl ? typeEl.value : 'choice';
      var questionText = textEl ? textEl.value.trim() : '';
      if(!questionText) continue;
      var q = {
        id: (state.feedbackDraftQuestions[qi] && state.feedbackDraftQuestions[qi].id) || ('q'+Date.now()+qi),
        type: type,
        question: questionText,
        category: catEl ? catEl.value.trim() : ''
      };
      if(type === 'choice'){
        q.options = optsEl ? optsEl.value.split('\n').map(function(s){ return s.trim(); }).filter(Boolean) : [];
      } else if(type === 'scale'){
        var scaleMin = minEl ? parseInt(minEl.value, 10) : 1;
        var scaleMax = maxEl ? parseInt(maxEl.value, 10) : 5;
        q.scale_min = isNaN(scaleMin) ? 1 : scaleMin;
        q.scale_max = isNaN(scaleMax) ? 5 : scaleMax;
        q.scale_min_label = minLabelEl ? minLabelEl.value.trim() : '';
        q.scale_max_label = maxLabelEl ? maxLabelEl.value.trim() : '';
      }
      questions.push(q);
    }

    if(!sb){ showToast('Keine Verbindung zur Datenbank.'); return; }
    try{
      var res = await sb.rpc('save_feedback_form', {p_questions: questions, p_trigger_hours: hours});
      if(res.error){
        console.warn('Behördenrallye: Feedback-Formular konnte nicht gespeichert werden.', res.error);
        showToast('Speichern fehlgeschlagen: Tabelle "feedback_form" evtl. noch nicht angelegt (siehe supabase-setup.sql).');
        return;
      }
      state.feedbackForm = (res.data && res.data.length ? res.data[0] : res.data) || {questions:questions, trigger_hours:hours};
      state.feedbackDraftQuestions = null;
      render();
      showToast('✓ Feedback-Formular gespeichert.');
    }catch(e){
      console.warn('Behördenrallye: Feedback-Formular konnte nicht gespeichert werden.', e);
      showToast('Speichern fehlgeschlagen: Tabelle "feedback_form" evtl. noch nicht angelegt (siehe supabase-setup.sql).');
    }
  }

  function renderAdminEvaluation(){
    var questions = (state.feedbackForm && state.feedbackForm.questions) || [];
    if(!questions.length){
      return '<div class="intro-card"><h3 style="margin-top:0;">Auswertung</h3><p class="muted" style="font-size:13px;">Es ist noch kein Feedback-Formular eingerichtet (siehe Feedback-Tab).</p></div>';
    }
    var responses = state.feedbackResponses || [];

    // Nach den frei vergebenen Kategorien gruppieren (Reihenfolge = erstes
    // Auftreten); Fragen ohne Kategorie landen gesammelt am Ende.
    var categoryOrder = [];
    var byCategory = {};
    questions.forEach(function(q){
      var cat = (q.category||'').trim() || 'Ohne Kategorie';
      if(!byCategory[cat]){ byCategory[cat] = []; categoryOrder.push(cat); }
      byCategory[cat].push(q);
    });
    if(categoryOrder.indexOf('Ohne Kategorie') !== -1){
      categoryOrder.splice(categoryOrder.indexOf('Ohne Kategorie'), 1);
      categoryOrder.push('Ohne Kategorie');
    }

    var sections = categoryOrder.map(function(cat){
      var catQuestions = byCategory[cat].map(renderEvaluationQuestion).join('');
      return '<div class="admin-fb-category"><h3 class="admin-fb-category-title">'+esc(cat)+'</h3>'+catQuestions+'</div>';
    }).join('');

    return ''+
    '<div class="intro-card">'+
      '<h3 style="margin-top:0;">Auswertung</h3>'+
      '<p class="muted" style="font-size:13px;">'+responses.length+' Rückmeldungen bisher.</p>'+
      '<div style="margin-bottom:14px;">'+btn('Aktualisieren', {id:'adminRefreshFeedbackBtn', cls:'btn-sm'})+'</div>'+
      sections+
    '</div>';

    function renderEvaluationQuestion(q){
      if(q.type === 'text'){
        var texts = responses.map(function(r){ return r.answers && r.answers[q.id]; }).filter(function(t){ return t && String(t).trim(); });
        var listHtml = texts.length
          ? '<ul class="admin-fb-textlist">'+texts.map(function(t){ return '<li>'+esc(t)+'</li>'; }).join('')+'</ul>'
          : '<p class="muted" style="font-size:13px;">Noch keine Antworten.</p>';
        return '<div class="admin-fb-section"><h4>'+esc(q.question)+'</h4>'+listHtml+'</div>';
      }
      var barLabels;
      if(q.type === 'scale'){
        barLabels = [];
        var min = q.scale_min != null ? q.scale_min : 1;
        var max = q.scale_max != null ? q.scale_max : 5;
        for(var v=min; v<=max; v++) barLabels.push(String(v));
      } else {
        barLabels = q.options||[];
      }
      var counts = {};
      barLabels.forEach(function(o){ counts[o] = 0; });
      responses.forEach(function(r){
        var a = r.answers && r.answers[q.id];
        if(a == null) return;
        counts[a] = (counts[a]||0) + 1;
      });
      var total = Object.keys(counts).reduce(function(sum,k){ return sum + counts[k]; }, 0);
      var barsHtml = barLabels.map(function(opt){
        var n = counts[opt];
        var pct = total > 0 ? Math.round(n/total*100) : 0;
        return ''+
        '<div class="admin-fb-bar-row">'+
          '<div class="admin-fb-bar-label">'+esc(opt)+'</div>'+
          '<div class="admin-fb-bar-track"><div class="admin-fb-bar-fill" style="width:'+pct+'%"></div></div>'+
          '<div class="admin-fb-bar-count">'+n+' ('+pct+'%)</div>'+
        '</div>';
      }).join('');
      var scaleLegend = q.type === 'scale' && (q.scale_min_label || q.scale_max_label)
        ? '<p class="muted" style="font-size:12px; margin:0 0 8px;">'+esc(q.scale_min_label||'')+(q.scale_min_label && q.scale_max_label ? ' … ' : '')+esc(q.scale_max_label||'')+'</p>'
        : '';
      return '<div class="admin-fb-section"><h4>'+esc(q.question)+'</h4>'+scaleLegend+(total ? barsHtml : '<p class="muted" style="font-size:13px;">Noch keine Antworten.</p>')+'</div>';
    }
  }

  // Fragen-Entwurf beim Bearbeiten/Neuanlegen einer Station: hält die
  // aktuell im Formular stehenden Fragen, damit Fragen hinzugefügt/entfernt
  // werden können, ohne unbeantwortete Eingaben in anderen Fragen zu
  // verlieren (gleiches Prinzip wie beim Feedback-Formular-Editor).
  function ensureTemplateDraft(mode){
    if(!state.adminTemplateDraft || state.adminTemplateDraft.mode !== mode){
      var isNew = mode === '_new';
      var t = isNew ? null : getTemplate(mode);
      var questions = (t && t.questions && t.questions.length)
        ? t.questions.map(function(q){ return Object.assign({}, q, {options:(q.options||[]).slice()}); })
        : [mkBlankQuestion(),mkBlankQuestion(),mkBlankQuestion(),mkBlankQuestion(),mkBlankQuestion()];
      state.adminTemplateDraft = {
        mode: mode,
        id: t ? t.id : '',
        title: t ? t.title : '',
        amt: t ? t.amt : '',
        icon: t ? t.icon : '🏛️',
        address: t ? (t.address||'') : '',
        questions: questions
      };
    }
  }

  // Liest alle aktuell im Formular stehenden Werte (auch Titel/Amt/Icon/
  // Adresse/ID, nicht nur die Fragen) in den Entwurf zurück, bevor eine
  // Frage hinzugefügt/entfernt wird - sonst würde der komplette Neuaufbau
  // des Formulars (render()) diese Felder auf ihren Ausgangswert zurücksetzen.
  function syncTemplateDraftFromDom(){
    if(!state.adminTemplateDraft) return;
    var d = state.adminTemplateDraft;
    var idEl = document.getElementById('tplId');
    var titleEl = document.getElementById('tplTitle');
    var amtEl = document.getElementById('tplAmt');
    var iconEl = document.getElementById('tplIcon');
    var addrEl = document.getElementById('tplAddress');
    if(idEl) d.id = idEl.value;
    if(titleEl) d.title = titleEl.value;
    if(amtEl) d.amt = amtEl.value;
    if(iconEl) d.icon = iconEl.value;
    if(addrEl) d.address = addrEl.value;
    var qs = d.questions;
    var count = document.querySelectorAll('#tplQuestionBlocks .admin-question-block').length;
    for(var qi=0; qi<count; qi++){
      if(!qs[qi]) continue;
      var qEl = document.querySelector('[data-tqfield="question"][data-tqidx="'+qi+'"]');
      var exEl = document.querySelector('[data-tqfield="explanation"][data-tqidx="'+qi+'"]');
      var ptsEl = document.querySelector('[data-tqfield="points"][data-tqidx="'+qi+'"]');
      var cEl = document.querySelector('[data-tqfield="correct"][data-tqidx="'+qi+'"]:checked');
      var options = [];
      for(var oi=0; oi<4; oi++){
        var oEl = document.querySelector('[data-tqfield="opt"][data-tqidx="'+qi+'"][data-toptidx="'+oi+'"]');
        options.push(oEl ? oEl.value : (qs[qi].options[oi]||''));
      }
      if(qEl) qs[qi].question = qEl.value;
      qs[qi].options = options;
      if(cEl) qs[qi].correct = parseInt(cEl.value, 10);
      if(exEl) qs[qi].explanation = exEl.value;
      if(ptsEl) qs[qi].points = parseInt(ptsEl.value, 10) || 0;
    }
  }

  async function saveStationTemplate(mode){
    var isNew = mode === '_new';
    var idRaw = isNew ? (document.getElementById('tplId')||{}).value : mode;
    var id = (idRaw||'').trim().toLowerCase().replace(/[^a-z0-9_]+/g,'_').replace(/^_+|_+$/g,'');
    if(!id){ showToast('Bitte eine gültige ID für die neue Station vergeben.'); return; }
    var title = (document.getElementById('tplTitle')||{}).value.trim();
    var amt = (document.getElementById('tplAmt')||{}).value.trim();
    var iconVal = (document.getElementById('tplIcon')||{}).value.trim() || '🏛️';
    var address = (document.getElementById('tplAddress')||{}).value.trim();
    var qCount = document.querySelectorAll('#tplQuestionBlocks .admin-question-block').length;
    var questions = [];
    for(var qi=0; qi<qCount; qi++){
      var qEl = document.querySelector('[data-tqfield="question"][data-tqidx="'+qi+'"]');
      var exEl = document.querySelector('[data-tqfield="explanation"][data-tqidx="'+qi+'"]');
      var ptsEl = document.querySelector('[data-tqfield="points"][data-tqidx="'+qi+'"]');
      var options = [];
      for(var oi=0; oi<4; oi++){
        var oEl = document.querySelector('[data-tqfield="opt"][data-tqidx="'+qi+'"][data-toptidx="'+oi+'"]');
        options.push(oEl ? oEl.value.trim() : '');
      }
      var cEl = document.querySelector('[data-tqfield="correct"][data-tqidx="'+qi+'"]:checked');
      questions.push({
        question: qEl ? qEl.value.trim() : '',
        options: options,
        correct: cEl ? parseInt(cEl.value, 10) : 0,
        explanation: exEl ? exEl.value.trim() : '',
        points: ptsEl ? (parseInt(ptsEl.value, 10) || 0) : 2
      });
    }
    if(!title || !amt){ showToast('Bitte Titel und Amt ausfüllen.'); return; }
    if(questions.length === 0){ showToast('Bitte mindestens eine Frage hinzufügen.'); return; }
    if(questions.some(function(q){ return !q.question || q.options.some(function(o){ return !o; }); })){
      showToast('Bitte alle Fragen und Antwortoptionen ausfüllen.');
      return;
    }
    if(!sb){ showToast('Keine Verbindung zur Datenbank.'); return; }
    try{
      var res = await sb.rpc('save_station_template', {p_id:id, p_title:title, p_amt:amt, p_icon:iconVal, p_address:address, p_questions:questions});
      if(res.error){
        console.warn('Behördenrallye: Station konnte nicht gespeichert werden.', res.error);
        showToast('Speichern fehlgeschlagen: Tabelle "station_templates" evtl. noch nicht angelegt (siehe supabase-setup.sql).');
        return;
      }
      state.adminEditTemplate = null;
      state.adminTemplateDraft = null;
      await refreshGroupsState();
      render();
      showToast('✓ Station gespeichert.');
    }catch(e){
      console.warn('Behördenrallye: Station konnte nicht gespeichert werden.', e);
      showToast('Speichern fehlgeschlagen: Tabelle "station_templates" evtl. noch nicht angelegt (siehe supabase-setup.sql).');
    }
  }

  function toDatetimeLocalString(d){
    var pad = function(n){ return String(n).padStart(2,'0'); };
    return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())+'T'+pad(d.getHours())+':'+pad(d.getMinutes());
  }

  async function saveSchedule(id, stageTimes, breakStages, stageAddresses){
    if(!sb) { showToast('Keine Verbindung zur Datenbank.'); return {error:'no-sb'}; }
    try{
      var res = await sb.rpc('save_schedule', {
        p_id: id,
        p_stage_times: stageTimes || null,
        p_break_stages: breakStages || null,
        p_stage_addresses: stageAddresses || null
      });
      if(res.error){
        console.warn('Behördenrallye: Zeitplan konnte nicht gespeichert werden.', res.error);
        showToast('Speichern fehlgeschlagen: Tabelle "schedules" evtl. noch nicht angelegt (siehe supabase-setup.sql).');
      }
      return res;
    }catch(e){
      console.warn('Behördenrallye: Zeitplan konnte nicht gespeichert werden.', e);
      showToast('Speichern fehlgeschlagen: Tabelle "schedules" evtl. noch nicht angelegt (siehe supabase-setup.sql).');
      return {error:e};
    }
  }

  async function generateAllSchedules(){
    var startEl = document.getElementById('genStart');
    if(!startEl || !startEl.value){ showToast('Bitte zuerst eine Startzeit für Fallakte 1 eingeben.'); return; }
    var baseStart = new Date(startEl.value);
    if(isNaN(baseStart.getTime())){ showToast('Ungültige Startzeit.'); return; }
    var offsetMin = parseInt((document.getElementById('genOffset')||{}).value, 10) || 0;
    var gapMin = [0];
    var gapBreak = [false];
    for(var i=1;i<STATIONS_PER_GROUP;i++){
      gapMin.push(parseInt((document.getElementById('gen_gap_'+i)||{}).value, 10) || 0);
      gapBreak.push(!!(document.getElementById('gen_break_'+i)||{}).checked);
    }

    var calls = GROUPS.map(function(gr, g){
      var t = new Date(baseStart.getTime() + g*offsetMin*60000);
      var stageTimes = {};
      var breakStages = [];
      groupStages(gr.id).forEach(function(s, i){
        if(i > 0) t = new Date(t.getTime() + gapMin[i]*60000);
        stageTimes[s.id] = toDatetimeLocalString(t);
        if(i > 0 && gapBreak[i]) breakStages.push(s.id);
      });
      return saveSchedule(gr.id, stageTimes, breakStages, null);
    });

    var results = await Promise.all(calls);
    await refreshGroupsState();
    render();
    if(!results.some(function(r){ return r && r.error; })){
      showToast('✓ Zeitpläne für alle '+GROUPS.length+' Gruppen erzeugt.');
    }
  }

  async function saveGroupSchedule(groupId){
    var stageTimes = {};
    var breakStages = [];
    groupStages(groupId).forEach(function(s){
      var timeEl = document.querySelector('[data-sched-time="'+groupId+'|'+s.id+'"]');
      if(timeEl && timeEl.value) stageTimes[s.id] = timeEl.value;
      var breakEl = document.querySelector('[data-sched-break="'+groupId+'|'+s.id+'"]');
      if(breakEl && breakEl.checked) breakStages.push(s.id);
    });
    var res = await saveSchedule(groupId, stageTimes, breakStages, null);
    if(!res.error){
      await refreshGroupsState();
      render();
      var groupDef = GROUPS.filter(function(g){ return g.id === groupId; })[0];
      showToast('✓ Zeitplan für '+(groupDef?groupDef.name:groupId)+' gespeichert.');
    }
  }

  function exportResultsCsv(){
    var lines = [['Rang','Team','Punkte','Fallakten erledigt','Mitglieder'].join(';')];
    var rows = GROUPS.map(function(gr){
      var row = state.groupRows.filter(function(r){ return r.id === gr.id; })[0];
      var progress = row ? (row.progress||{}) : {};
      var members = (state.groupsState && state.groupsState[gr.id]) ? state.groupsState[gr.id].members.length : 0;
      return {name:gr.name, points:sumPoints(progress), done:countDone(progress), members:members};
    }).sort(function(a,b){ return b.points - a.points; });
    rows.forEach(function(r, idx){
      lines.push([idx+1, r.name, r.points, r.done+'/'+STATIONS_PER_GROUP, r.members].join(';'));
    });
    var blob = new Blob([lines.join('\n')], {type:'text/csv;charset=utf-8;'});
    var link = document.createElement('a');
    link.download = 'behoerdenrallye-ergebnisse.csv';
    link.href = URL.createObjectURL(blob);
    document.body.appendChild(link);
    link.click();
    link.remove();
    setTimeout(function(){ URL.revokeObjectURL(link.href); }, 2000);
  }

  function renderBoard(){
    var rows = GROUPS.map(function(gr, i){ return {id:gr.id, name:gr.name, tab:tabClass(i), points:groupPoints(gr.id)}; });
    var ranked = rows.slice().sort(function(a,b){ return b.points - a.points; });
    var maxPts = Math.max(1, ranked[0].points);
    var mine = state.participant ? state.participant.groupId : null;
    var pulseActive = Date.now() < (state.boardPulseUntil||0);
    var now = Date.now();

    // Reihenfolge im DOM bleibt stabil (nach Gruppe, nicht nach Rang) - nur die
    // Position wird per transform animiert, damit Zeilen beim Umsortieren sanft
    // an ihren neuen Platz gleiten statt hart neu gerendert zu wirken.
    var rowsHtml = rows.map(function(r){
      var rank = ranked.findIndex(function(x){ return x.id === r.id; });
      var pct = Math.round(r.points / maxPts * 100);
      var isMine = r.id === mine;

      var prevRank = lastRanks[r.id];
      if(prevRank !== undefined && prevRank !== rank){
        rankFlashInfo[r.id] = { dir: rank < prevRank ? 'up' : 'down', until: now + 1400 };
        setTimeout(function(){ if(document.getElementById('liveBoard')) render(); }, 1450);
        if(isMine){
          announce('Euer Team ist jetzt auf Platz '+(rank+1)+'.');
        }
      }
      lastRanks[r.id] = rank;
      var flash = rankFlashInfo[r.id];
      var arrowHtml = (flash && now < flash.until)
        ? '<span class="rank-arrow '+flash.dir+'" aria-hidden="true">'+(flash.dir==='up'?'▲':'▼')+'</span>'
        : '';

      var prevPoints = lastBoardPoints[r.id];
      var animateFrom = (prevPoints !== undefined && prevPoints !== r.points) ? prevPoints : null;
      lastBoardPoints[r.id] = r.points;
      var pointsAttrs = animateFrom !== null ? ' data-from="'+animateFrom+'" data-to="'+r.points+'"' : '';
      var pointsDisplay = animateFrom !== null ? animateFrom : r.points;

      return ''+
      '<div class="board-row '+r.tab+(rank<3?' place-'+(rank+1):'')+(isMine?' mine':'')+(isMine&&pulseActive?' pulse':'')+'" style="transform:translateY('+(rank*BOARD_ROW_H)+'px)">'+
        '<div class="board-rank">'+String(rank+1).padStart(2,'0')+arrowHtml+'</div>'+
        '<div class="board-name"><span class="board-dot"></span><span>'+esc(r.name)+'</span>'+(isMine?' <span class="du-badge">Du</span>':'')+'</div>'+
        '<div class="board-points"'+pointsAttrs+'>'+pointsDisplay+'</div>'+
        '<div class="board-bar-wrap"><div class="board-bar" style="width:'+pct+'%"></div></div>'+
      '</div>';
    }).join('');

    return ''+
    '<div class="board" id="liveBoard">'+
      '<div class="board-title">Aktueller Wettbewerbsstand</div>'+
      renderPodium(ranked)+
      '<div class="board-head"><span class="live-dot"></span><span class="live-label">Rangliste · live</span></div>'+
      '<div class="board-rows" style="height:'+(GROUPS.length*BOARD_ROW_H)+'px">'+rowsHtml+'</div>'+
    '</div>';
  }

    return ''+
    '<div class="countdown-screen">'+
      '<div class="countdown-card wait-card" role="status" aria-live="polite">'+
        animHtml+
        textHtml+
      '</div>'+
    '</div>';
  }

  function render(){
    var html = '';
    if(state.screen === 'intro') html = renderIntro();
    else if(state.screen === 'countdown') html = renderCountdown();
    else if(state.screen === 'map') html = renderMap();
    else if(state.screen === 'waiting') html = renderWaiting();
    else if(state.screen === 'finished') html = renderFinished();
    else if(state.screen === 'adminLogin') html = renderAdminLogin();
    else if(state.screen === 'admin') html = renderAdmin();
    else html = '<div class="boot-screen"><div class="boot-text">Rallye-System wird initialisiert<span class="boot-dots"></span></div></div>';

    var quizHtml = state.activeQuizIndex !== null ? renderQuiz() : '';

    app.innerHTML = '<div class="screen">'+html+renderDisclaimer()+'</div>'+quizHtml;
    attachListeners();
    animatePendingBoardPoints();

    var topbar = document.getElementById('topbar');
    if(topbar){ topbar.innerHTML = renderHeaderBar(); attachHeaderListeners(); }
  }

  function prefersReducedMotion(){
    return !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches);
  }

  function animateCount(el, from, to, duration){
    if(prefersReducedMotion()){ el.textContent = to; return; }
    var start = performance.now();
    function step(now){
      var t = Math.min(1, (now-start)/duration);
      var eased = 1 - Math.pow(1-t, 3);
      el.textContent = Math.round(from + (to-from)*eased);
      if(t < 1) requestAnimationFrame(step);
      else el.textContent = to;
    }
    requestAnimationFrame(step);
  }

  function animatePendingBoardPoints(){
    document.querySelectorAll('.board-points[data-from]').forEach(function(el){
      var from = parseInt(el.getAttribute('data-from'), 10);
      var to = parseInt(el.getAttribute('data-to'), 10);
      el.removeAttribute('data-from');
      el.removeAttribute('data-to');
      animateCount(el, from, to, 650);
    });
  }

  function attachHeaderListeners(){
    var menuBtn = document.getElementById('menuBtn');
    if(menuBtn) menuBtn.addEventListener('click', function(){ state.menuOpen = !state.menuOpen; render(); });

    var menuToggleBoard = document.getElementById('menuToggleBoard');
    if(menuToggleBoard) menuToggleBoard.addEventListener('click', async function(){
      state.boardOpen = !state.boardOpen;
      state.menuOpen = false;
      if(state.boardOpen){ await refreshGroupsState(); }
      render();
    });

    var menuHelp = document.getElementById('menuHelp');
    if(menuHelp) menuHelp.addEventListener('click', function(){ state.menuOpen = false; render(); showHelpDialog(); });

    var menuLeave = document.getElementById('menuLeave');
    if(menuLeave) menuLeave.addEventListener('click', function(){ state.menuOpen = false; render(); leaveGroup(); });

    var brandHome = document.getElementById('brandHome');
    if(brandHome) brandHome.addEventListener('click', function(){
      state.menuOpen = false;
      state.activeQuizIndex = null;
      state.quizQuestionIndex = 0;
      state.quizSelectedOption = null;
      state.quizAnswered = false;
      state.quizEarnedPoints = 0;
      enterMap();
    });

    document.querySelectorAll('#topbar .egg-stamp').forEach(function(el){
      el.addEventListener('click', handleStampIconClick);
    });
  }

  document.addEventListener('click', function(e){
    if(!state.menuOpen) return;
    if(e.target.closest('.menu-panel') || e.target.closest('#menuBtn')) return;
    state.menuOpen = false;
    render();
  });

  function attachListeners(){
    var passwordField = document.getElementById('passwordField');
    if(passwordField){
      passwordField.addEventListener('input', function(e){ state.passwordInput = e.target.value; });
      passwordField.addEventListener('keydown', function(e){ if(e.key==='Enter'){ handlePasswordSubmit(); } });
    }
    var passwordSubmitBtn = document.getElementById('passwordSubmitBtn');
    if(passwordSubmitBtn) passwordSubmitBtn.addEventListener('click', handlePasswordSubmit);

    var adminPasswordField = document.getElementById('adminPasswordField');
    if(adminPasswordField){
      adminPasswordField.addEventListener('input', function(e){ state.adminPasswordInput = e.target.value; });
      adminPasswordField.addEventListener('keydown', function(e){ if(e.key==='Enter'){ handleAdminPasswordSubmit(); } });
    }
    var adminSubmitBtn = document.getElementById('adminSubmitBtn');
    if(adminSubmitBtn) adminSubmitBtn.addEventListener('click', handleAdminPasswordSubmit);

    var adminRefreshBtn = document.getElementById('adminRefreshBtn');
    if(adminRefreshBtn) adminRefreshBtn.addEventListener('click', async function(){ await refreshGroupsState(); render(); });

    var adminExportBtn = document.getElementById('adminExportBtn');
    if(adminExportBtn) adminExportBtn.addEventListener('click', exportResultsCsv);

    var adminAnnounceInput = document.getElementById('adminAnnounceInput');
    if(adminAnnounceInput) adminAnnounceInput.addEventListener('input', function(e){ state.adminAnnounceInput = e.target.value; });
    var adminAnnounceBtn = document.getElementById('adminAnnounceBtn');
    if(adminAnnounceBtn) adminAnnounceBtn.addEventListener('click', async function(){
      var text = (state.adminAnnounceInput||'').trim();
      if(!text) return;
      await sendAnnouncement(text);
      state.adminAnnounceInput = '';
      state.adminAnnounceSent = true;
      render();
      setTimeout(function(){ state.adminAnnounceSent = false; }, 4000);
    });

    var adminGenerateBtn = document.getElementById('adminGenerateBtn');
    if(adminGenerateBtn) adminGenerateBtn.addEventListener('click', generateAllSchedules);

    document.querySelectorAll('[data-save-schedule-group]').forEach(function(btn){
      btn.addEventListener('click', function(){ saveGroupSchedule(btn.getAttribute('data-save-schedule-group')); });
    });

    document.querySelectorAll('[data-admin-tab]').forEach(function(btn){
      btn.addEventListener('click', async function(){
        state.adminTab = btn.getAttribute('data-admin-tab');
        if(state.adminTab === 'evaluation'){ await loadFeedbackResponses(); }
        if(state.adminTab === 'announce'){ await loadRecentAnnouncements(); }
        render();
      });
    });

    var adminAddFbQuestionBtn = document.getElementById('adminAddFbQuestionBtn');
    if(adminAddFbQuestionBtn) adminAddFbQuestionBtn.addEventListener('click', addFeedbackQuestion);

    document.querySelectorAll('[data-remove-fbq]').forEach(function(btn){
      btn.addEventListener('click', function(){ removeFeedbackQuestion(parseInt(btn.getAttribute('data-remove-fbq'),10)); });
    });

    document.querySelectorAll('[data-fbq-type]').forEach(function(sel){
      sel.addEventListener('change', function(){
        syncFeedbackDraftFromDom();
        var qi = parseInt(sel.getAttribute('data-fbq-type'), 10);
        state.feedbackDraftQuestions[qi].type = sel.value;
        render();
      });
    });

    var adminSaveFeedbackBtn = document.getElementById('adminSaveFeedbackBtn');
    if(adminSaveFeedbackBtn) adminSaveFeedbackBtn.addEventListener('click', saveFeedbackForm);

    var adminRefreshFeedbackBtn = document.getElementById('adminRefreshFeedbackBtn');
    if(adminRefreshFeedbackBtn) adminRefreshFeedbackBtn.addEventListener('click', async function(){ await loadFeedbackResponses(); render(); });

    var adminNewTemplateBtn = document.getElementById('adminNewTemplateBtn');
    if(adminNewTemplateBtn) adminNewTemplateBtn.addEventListener('click', function(){ state.adminEditTemplate = '_new'; state.adminTemplateDraft = null; render(); });

    document.querySelectorAll('[data-edit-template]').forEach(function(btn){
      btn.addEventListener('click', function(){ state.adminEditTemplate = btn.getAttribute('data-edit-template'); render(); });
    });

    var adminCancelTemplateBtn = document.getElementById('adminCancelTemplateBtn');
    if(adminCancelTemplateBtn) adminCancelTemplateBtn.addEventListener('click', function(){ state.adminEditTemplate = null; state.adminTemplateDraft = null; render(); });

    var adminSaveTemplateBtn = document.getElementById('adminSaveTemplateBtn');
    if(adminSaveTemplateBtn) adminSaveTemplateBtn.addEventListener('click', function(){ saveStationTemplate(adminSaveTemplateBtn.getAttribute('data-template-mode')); });

    var adminAddTplQuestionBtn = document.getElementById('adminAddTplQuestionBtn');
    if(adminAddTplQuestionBtn) adminAddTplQuestionBtn.addEventListener('click', addTemplateQuestion);

    document.querySelectorAll('[data-remove-tplq]').forEach(function(btn){
      btn.addEventListener('click', function(){ removeTemplateQuestion(parseInt(btn.getAttribute('data-remove-tplq'),10)); });
    });

    document.querySelectorAll('[data-save-route]').forEach(function(btn){
      btn.addEventListener('click', function(){ saveAdminRoute(btn.getAttribute('data-save-route')); });
    });

    document.querySelectorAll('[data-save-password]').forEach(function(btn){
      btn.addEventListener('click', function(){ saveGroupPassword(btn.getAttribute('data-save-password')); });
    });

    document.querySelectorAll('[data-save-members]').forEach(function(btn){
      btn.addEventListener('click', function(){ saveGroupMembers(btn.getAttribute('data-save-members')); });
    });

    var adminTriggerWinnerBtn = document.getElementById('adminTriggerWinnerBtn');
    if(adminTriggerWinnerBtn) adminTriggerWinnerBtn.addEventListener('click', triggerWinnerAnimation);

    document.querySelectorAll('[data-reset-progress]').forEach(function(btn){
      btn.addEventListener('click', function(){ resetGroupProgress(btn.getAttribute('data-reset-progress')); });
    });

    document.querySelectorAll('[data-stage]').forEach(function(btn){
      btn.addEventListener('click', function(){ openQuiz(parseInt(btn.getAttribute('data-stage'),10)); });
    });

    document.querySelectorAll('[data-opt]').forEach(function(btn){
      btn.addEventListener('click', function(){ selectOption(parseInt(btn.getAttribute('data-opt'),10)); });
    });

    document.querySelectorAll('.egg-eyebrow').forEach(function(el){
      el.addEventListener('click', handleEyebrowClick);
    });

    var certBtn = document.getElementById('certDownloadBtn');
    if(certBtn) certBtn.addEventListener('click', downloadCertificate);

    var quizClose = document.getElementById('quizCloseBtn');
    if(quizClose) quizClose.addEventListener('click', closeQuiz);
    var quizOverlay = document.getElementById('quizOverlay');
    if(quizOverlay) quizOverlay.addEventListener('click', function(e){ if(e.target === quizOverlay) closeQuiz(); });
    var quizNext = document.getElementById('quizNextBtn');
    if(quizNext) quizNext.addEventListener('click', advanceQuiz);

    var quizCard = quizOverlay ? quizOverlay.querySelector('.quiz-card') : null;
    if(quizCard){
      trapFocus(quizCard);
      if(!quizFocusApplied){
        quizFocusApplied = true;
        if(quizClose) quizClose.focus();
      }
    }
  }

  document.addEventListener('keydown', function(e){
    handleEasterKeydown(e);
    if(e.key === 'Escape' && state.activeQuizIndex !== null){ closeQuiz(); return; }
    if(e.key === 'Escape' && state.menuOpen){ state.menuOpen = false; render(); }
  });

  init();
})();
</script>
</body>
</html>
