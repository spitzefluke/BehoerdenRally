<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Behördenrallye</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --primary:#C8102E;
    --primary-dark:#970B22;
    --primary-tint:#FDECEC;
    --navy:#0E2A43;
    --navy-soft:#1C3E5E;
    --blue:#2B6CA3;
    --blue-light:#EAF3FA;
    --bg:#F4F6F9;
    --surface:#FFFFFF;
    --text:#12212E;
    --text-muted:#5B6B7A;
    --border:#DEE4EA;
    --success:#1E8A5F;
    --success-tint:#E6F4ED;
    --warning:#B9711C;
    --warning-tint:#FBF0E1;
    --error:#C8102E;
    --focus:#2B6CA3;
    --locked-bg:#EEF1F4;
    --tab-1:var(--primary);
    --tab-2:var(--blue);
    --tab-3:#0E7C86;
    --tab-4:#B98900;
    --tab-5:#2E8B57;
    --tab-6:#6B4FA0;
    --card-shadow: 0 1px 2px rgba(14,42,67,0.06), 0 8px 20px -10px rgba(14,42,67,0.16);
    --card-shadow-hover: 0 2px 6px rgba(14,42,67,0.10), 0 16px 30px -12px rgba(14,42,67,0.24);
    --panel-shadow: 0 2px 6px rgba(0,0,0,0.18), 0 18px 34px -14px rgba(0,0,0,0.4);
    --glow-primary: 0 0 0 4px rgba(200,16,46,0.14), 0 0 22px -4px rgba(200,16,46,0.4);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      radial-gradient(circle at 10% -4%, rgba(43,108,163,0.07), transparent 42%),
      radial-gradient(circle at 94% 96%, rgba(200,16,46,0.05), transparent 46%),
      var(--bg);
    background-attachment:fixed;
    color:var(--text);
    font-family:'IBM Plex Sans', system-ui, -apple-system, 'Segoe UI', sans-serif;
    min-height:100vh;
    -webkit-font-smoothing:antialiased;
  }
  #bgfx{position:fixed; inset:0; z-index:0; pointer-events:none; overflow:hidden;}
  #bgfx span{position:absolute; border-radius:50%; opacity:.10; animation:bgdrift 24s ease-in-out infinite;}
  #bgfx span:nth-child(1){width:5px; height:5px; left:6%; top:18%; background:var(--tab-1); animation-duration:23s;}
  #bgfx span:nth-child(2){width:4px; height:4px; left:92%; top:14%; background:var(--tab-4); animation-duration:27s; animation-delay:-4s;}
  #bgfx span:nth-child(3){width:6px; height:6px; left:85%; top:62%; background:var(--tab-2); opacity:.08; animation-duration:31s; animation-delay:-9s;}
  #bgfx span:nth-child(4){width:4px; height:4px; left:10%; top:72%; background:var(--tab-3); animation-duration:26s; animation-delay:-6s;}
  #bgfx span:nth-child(5){width:5px; height:5px; left:48%; top:90%; background:var(--tab-6); animation-duration:29s; animation-delay:-13s;}
  #bgfx span:nth-child(6){width:3px; height:3px; left:35%; top:8%; background:var(--tab-5); animation-duration:21s; animation-delay:-2s;}
  #bgfx span:nth-child(7){width:4px; height:4px; left:70%; top:38%; background:var(--tab-4); opacity:.08; animation-duration:33s; animation-delay:-16s;}
  @keyframes bgdrift{0%,100%{transform:translate(0,0);} 50%{transform:translate(16px,-24px);}}
  @media (prefers-reduced-motion: reduce){ #bgfx span{animation:none;} }
  #app{position:relative; z-index:1; max-width:760px;margin:0 auto;padding:24px 16px 80px;}
  :focus-visible{outline:2.5px solid var(--focus); outline-offset:2px; border-radius:4px;}
  .icon{display:inline-flex; align-items:center; justify-content:center; line-height:0; flex:0 0 auto;}
  .tab-1{--tab:var(--tab-1);} .tab-2{--tab:var(--tab-2);} .tab-3{--tab:var(--tab-3);}
  .tab-4{--tab:var(--tab-4);} .tab-5{--tab:var(--tab-5);} .tab-6{--tab:var(--tab-6);}
  .eyebrow{
    font-family:'IBM Plex Mono',monospace;
    font-size:11px;
    letter-spacing:.12em;
    text-transform:uppercase;
    font-weight:600;
    color:var(--text-muted);
  }
  h1,h2,h3{
    font-family:'IBM Plex Sans', sans-serif;
    font-weight:700;
    letter-spacing:-.01em;
    margin:0 0 6px;
    color:var(--navy);
    text-wrap:balance;
  }
  h1{font-size:clamp(28px,6vw,40px); line-height:1.12;}
  h2{font-size:22px; line-height:1.25;}
  p{line-height:1.6; color:var(--text);}
  .muted{color:var(--text-muted);}
  a, button{font-family:inherit;}
  button{cursor:pointer;}

  /* ---------- buttons (Uiverse.io by Spacious74, adapted) ---------- */
  .btn{
    cursor:pointer;
    font-family:'IBM Plex Sans', sans-serif;
    font-weight:600;
    font-size:14px;
    border:none;
    border-radius:16px;
    padding:2px;
    min-height:44px;
    display:inline-flex; align-items:stretch; justify-content:center;
    position:relative; overflow:hidden;
    background:radial-gradient(circle 80px at 80% -10%, #ffffff, #181b1b);
    transition:transform .16s ease;
  }
  .btn::after{
    content:"";
    position:absolute; width:65%; height:60%;
    border-radius:120px; top:0; right:0;
    box-shadow:0 0 20px #ffffff38;
    z-index:0; pointer-events:none;
  }
  .btn .blob{
    position:absolute; width:70px; max-width:40%; height:100%;
    border-radius:16px; bottom:0; left:0;
    background:radial-gradient(circle 60px at 0% 100%, #3fe9ff, #0000ff80, transparent);
    box-shadow:-10px 10px 30px #0051ff2d;
    pointer-events:none;
  }
  .btn .inner{
    width:100%;
    padding:11px 20px;
    border-radius:14px;
    color:#fff;
    display:inline-flex; align-items:center; justify-content:center; gap:8px;
    z-index:3; position:relative;
    background:radial-gradient(circle 80px at 80% -50%, #777777, #0f1111);
  }
  .btn .inner::before{
    content:"";
    position:absolute; inset:0; border-radius:14px;
    background:radial-gradient(circle 60px at 0% 100%, #00e1ff1a, #0000ff11, transparent);
    pointer-events:none;
  }
  .btn:hover{transform:translateY(-2px);}
  .btn:active{transform:translateY(0) scale(.98);}
  .btn:disabled{opacity:.45; cursor:not-allowed; pointer-events:none; transform:none;}
  .btn.is-loading{opacity:.75; cursor:wait; pointer-events:none;}
  .btn-lg .inner{padding:15px 28px; font-size:15px;}
  @media (prefers-reduced-motion: reduce){ .btn{transition:none;} }

  /* ---------- header / topbar ---------- */
  .topbar{
    position:sticky; top:0; z-index:40;
    background:rgba(255,255,255,0.92); backdrop-filter:blur(6px) saturate(1.2);
    border-bottom:1px solid var(--border);
  }
  .topbar-wave{height:3px; width:100%; background:linear-gradient(90deg, var(--primary) 0 18%, var(--blue) 18% 55%, var(--navy) 55% 100%); opacity:.85;}
  .topbar-inner{
    max-width:760px; margin:0 auto; padding:0 16px;
    height:60px; display:flex; align-items:center; justify-content:space-between; gap:10px;
  }
  .brand{display:flex; align-items:center; gap:10px; text-decoration:none; color:var(--navy); border:none; background:none; padding:6px 0; min-height:44px; min-width:0; flex:0 1 auto;}
  .brand-mark{
    width:32px; height:32px; border-radius:8px; flex:0 0 auto;
    background:var(--navy); color:#fff; position:relative; overflow:hidden;
    display:flex; align-items:center; justify-content:center;
    font-family:'IBM Plex Mono',monospace; font-weight:700; font-size:13px; letter-spacing:-.02em;
  }
  .brand-mark::after{content:""; position:absolute; left:0; right:0; bottom:3px; height:3px; background:var(--primary);}
  .brand-word{font-weight:700; font-size:15.5px; letter-spacing:-.01em; color:var(--navy); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; min-width:0;}
  .brand-word b{color:var(--primary);}
  .topbar-right{display:flex; align-items:center; gap:8px; position:relative; min-width:0; flex:0 1 auto; justify-content:flex-end;}
  .topbar-pill{
    font-family:'IBM Plex Mono',monospace; font-size:11.5px; font-weight:600;
    padding:6px 12px; border-radius:99px; background:var(--blue-light); color:var(--navy);
    display:inline-flex; align-items:center; gap:6px; white-space:nowrap;
    overflow:hidden; text-overflow:ellipsis; min-width:0; max-width:44vw;
  }
  .menu-btn{
    width:44px; height:44px; border-radius:9px; border:1.5px solid var(--border);
    background:var(--surface); color:var(--navy); flex:0 0 auto;
    display:flex; align-items:center; justify-content:center;
    transition:background .16s ease, border-color .16s ease;
  }
  .menu-btn:hover{background:var(--blue-light); border-color:var(--blue);}
  .menu-panel{
    position:absolute; top:52px; right:0; z-index:41;
    background:var(--surface); border:1px solid var(--border); border-radius:12px;
    box-shadow:var(--card-shadow-hover); padding:8px; min-width:230px;
    display:flex; flex-direction:column; gap:2px;
    animation:menuIn .18s cubic-bezier(.2,.8,.3,1) both;
  }
  @keyframes menuIn{from{opacity:0; transform:translateY(-8px);} to{opacity:1; transform:translateY(0);}}
  @media (prefers-reduced-motion: reduce){ .menu-panel{animation:none;} }
  .menu-panel button{
    display:flex; align-items:center; gap:11px; width:100%; text-align:left;
    padding:10px 12px; border-radius:8px; border:none; background:none;
    font-size:14px; font-weight:500; color:var(--text); min-height:44px;
  }
  .menu-panel button:hover{background:var(--blue-light);}
  .menu-panel button.danger{color:var(--primary-dark);}

  /* ---------- onboarding steps ---------- */
  .steps{
    display:flex; align-items:center; justify-content:center; gap:6px;
    margin-bottom:18px; flex-wrap:wrap;
  }
  .step{
    font-family:'IBM Plex Mono',monospace; font-size:11px; letter-spacing:.05em; text-transform:uppercase; font-weight:600;
    color:var(--text-muted); padding:5px 12px; border:1px solid var(--border); border-radius:99px;
    background:var(--surface);
  }
  .step.active{color:#fff; background:var(--navy); border-color:var(--navy);}
  .step.done{color:var(--success); border-color:var(--success);}
  .step-sep{color:var(--border); font-size:12px;}

  /* ---------- hero (Startseite) ---------- */
  .hero{
    position:relative; text-align:center;
    padding:44px 18px 34px;
    margin-bottom:22px;
    overflow:hidden;
    border-radius:16px;
    background:linear-gradient(180deg, var(--blue-light) 0%, transparent 100%);
  }
  .hero-particles{position:absolute; inset:0; pointer-events:none; overflow:hidden;}
  .hero-particles span{position:absolute; border-radius:50%; opacity:.16; animation:drift 14s ease-in-out infinite;}
  .hero-particles span:nth-child(1){width:9px;height:9px; left:8%; top:20%; background:var(--primary); animation-duration:12s;}
  .hero-particles span:nth-child(2){width:6px;height:6px; left:80%; top:15%; background:var(--tab-4); animation-duration:16s; animation-delay:-3s;}
  .hero-particles span:nth-child(3){width:12px;height:12px; left:65%; top:70%; background:var(--blue); opacity:.12; animation-duration:19s; animation-delay:-7s;}
  .hero-particles span:nth-child(4){width:7px;height:7px; left:20%; top:75%; background:var(--tab-3); animation-duration:15s; animation-delay:-5s;}
  .hero-particles span:nth-child(5){width:5px;height:5px; left:45%; top:12%; background:var(--tab-6); animation-duration:13s; animation-delay:-9s;}
  @keyframes drift{0%,100%{transform:translate(0,0);} 50%{transform:translate(8px,-14px);}}
  .hero-eyebrow{display:flex; align-items:center; justify-content:center; gap:8px; margin-bottom:12px;}
  .hero-title{font-size:clamp(32px,7.5vw,50px); line-height:1.05; letter-spacing:-.02em; margin:0 0 10px; color:var(--navy);}
  .hero-title b{color:var(--primary);}
  .hero-sub{max-width:46ch; margin:0 auto 22px; color:var(--text-muted); font-size:15.5px;}
  .hero-stats{display:flex; justify-content:center; gap:10px; flex-wrap:wrap; margin-top:8px;}
  .hero-stat{
    font-family:'IBM Plex Mono',monospace; font-size:11.5px; font-weight:600; color:var(--navy);
    border:1px solid var(--border); border-radius:99px; padding:6px 14px;
    background:var(--surface);
    display:inline-flex; align-items:center; gap:6px;
  }
  .hero-stat b{color:var(--primary); font-weight:700;}
  @media (prefers-reduced-motion: reduce){ .hero-particles span{animation:none;} }

  /* ---------- intro ---------- */
  .intro-card{
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:14px;
    padding:26px 24px;
    box-shadow:var(--card-shadow);
  }
  .field label{
    display:block; font-family:'IBM Plex Mono',monospace; font-size:11px; font-weight:600;
    text-transform:uppercase; letter-spacing:.06em; color:var(--text-muted); margin-bottom:7px;
  }
  input[type=text]{
    width:100%; font-family:'IBM Plex Sans', sans-serif; font-size:16px;
    padding:12px 14px; border:1.5px solid var(--border); border-radius:9px;
    background:var(--surface); color:var(--text); min-height:44px;
  }
  input[type=text]:focus{outline:2.5px solid var(--focus); outline-offset:1px; border-color:var(--focus);}

  /* ---------- group grid ---------- */
  .group-grid{
    display:grid; grid-template-columns:repeat(auto-fill,minmax(210px,1fr));
    gap:14px; margin-top:18px;
  }
  .group-card{
    position:relative;
    background:var(--surface);
    border:1px solid var(--border);
    border-top:3px solid var(--tab, var(--border));
    border-radius:14px;
    padding:16px 15px 15px;
    text-align:left;
    box-shadow:var(--card-shadow);
    transition:transform .18s ease, box-shadow .18s ease;
  }
  .group-card:not(.full):hover{transform:translateY(-3px); box-shadow:var(--card-shadow-hover);}
  .group-card button.select-btn{width:100%; margin-top:12px;}
  .group-head{display:flex; align-items:center; gap:10px;}
  .group-badge{
    flex:0 0 auto; width:38px; height:38px; border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    font-family:'IBM Plex Mono', monospace; font-weight:700; font-size:15px;
    border:2px solid var(--tab, var(--text-muted)); color:var(--tab, var(--text-muted));
    background:var(--surface);
  }
  .group-name{font-family:'IBM Plex Sans',sans-serif; font-weight:700; font-size:14.5px; color:var(--navy);}
  .group-name .eyebrow{display:block; margin-bottom:1px;}
  .capacity-row{display:flex; align-items:center; gap:8px; margin-top:12px;}
  .capacity-bar{flex:1; height:7px; background:var(--locked-bg); border-radius:99px; overflow:hidden;}
  .capacity-fill{height:100%; background:var(--success); transition:background .2s ease;}
  .capacity-fill.mid{background:var(--tab-4);}
  .capacity-fill.high{background:var(--warning);}
  .capacity-fill.full{background:var(--primary);}
  .capacity-text{font-family:'IBM Plex Mono',monospace; font-size:11px; color:var(--text-muted); white-space:nowrap; font-variant-numeric:tabular-nums;}
  .points-text{font-family:'IBM Plex Mono',monospace; font-size:11px; color:var(--tab, var(--text-muted)); margin-top:4px; font-weight:700;}
  .group-card.full{opacity:.6;}
  .full-stamp{
    position:absolute; top:12px; right:12px;
    background:var(--primary-tint); color:var(--primary-dark);
    font-family:'IBM Plex Mono',monospace; font-size:10.5px; font-weight:700; letter-spacing:.05em;
    padding:3px 8px; border-radius:99px;
  }

  /* ---------- status badges ---------- */
  .status-badge{
    display:inline-flex; align-items:center; gap:5px;
    font-family:'IBM Plex Mono',monospace; font-size:10.5px; font-weight:700; letter-spacing:.04em; text-transform:uppercase;
    padding:4px 10px; border-radius:99px;
  }
  .status-badge.locked{background:var(--locked-bg); color:var(--text-muted);}
  .status-badge.current{background:var(--primary-tint); color:var(--primary-dark);}
  .status-badge.done{background:var(--success-tint); color:var(--success);}

  /* ---------- progress panel / map ---------- */
  .progress-panel{
    background:var(--navy); color:#fff;
    border-radius:16px; padding:20px 20px 18px;
    margin-bottom:20px; box-shadow:var(--panel-shadow);
    position:relative; overflow:hidden;
  }
  .progress-panel::before{
    content:""; position:absolute; inset:0; pointer-events:none;
    background:radial-gradient(circle at 88% -12%, rgba(43,108,163,0.35), transparent 55%);
  }
  .progress-head{display:flex; justify-content:space-between; align-items:center; gap:10px; flex-wrap:wrap; margin-bottom:14px; position:relative;}
  .progress-head .eyebrow{color:rgba(255,255,255,.62);}
  .progress-head .who{font-family:'IBM Plex Mono',monospace; font-size:12.5px; color:rgba(255,255,255,.72);}
  .progress-head .who b{font-weight:700; color:#fff;}
  .progress-bar-track{height:12px; border-radius:99px; background:rgba(255,255,255,0.12); overflow:hidden; position:relative;}
  .progress-bar-fill{height:100%; border-radius:99px; background:linear-gradient(90deg, var(--primary), var(--blue)); transition:width .5s cubic-bezier(.2,.8,.3,1);}
  .progress-stats{display:flex; justify-content:space-between; align-items:center; margin-top:12px; flex-wrap:wrap; gap:8px; position:relative;}
  .progress-fraction{font-family:'IBM Plex Mono',monospace; font-size:12px; color:rgba(255,255,255,.72);}
  .progress-meta{display:flex; gap:8px; flex-wrap:wrap;}
  .stat-chip{
    font-family:'IBM Plex Mono',monospace; font-size:11.5px; font-weight:600;
    border:1px solid rgba(255,255,255,.18); border-radius:99px; padding:5px 12px;
    background:rgba(255,255,255,0.08); color:#fff;
    display:inline-flex; align-items:center; gap:6px;
  }
  .status-actions{display:flex; gap:8px; align-items:center; position:relative; flex-wrap:wrap;}

  .missions-head{text-align:center; margin-bottom:16px;}
  .missions-head .eyebrow{display:block; margin-bottom:2px;}

  /* ---------- mission cards ("Fallakten") ---------- */
  .mission-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(240px,1fr)); gap:14px;}
  .mission-card{
    position:relative; text-align:left; width:100%;
    background:var(--surface); border:1px solid var(--border);
    border-radius:14px; padding:16px 16px 15px;
    box-shadow:var(--card-shadow);
    transition:transform .18s ease, box-shadow .18s ease, border-color .18s ease;
    animation:cardIn .36s ease both;
    animation-delay:calc(var(--i, 0) * 45ms);
  }
  @keyframes cardIn{from{opacity:0; transform:translateY(8px);} to{opacity:1; transform:translateY(0);}}
  @media (prefers-reduced-motion: reduce){ .mission-card{animation:none;} }
  .mission-num{font-family:'IBM Plex Mono',monospace; font-size:10.5px; font-weight:600; letter-spacing:.1em; color:var(--text-muted); text-transform:uppercase;}
  .mission-card-head{display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:9px; gap:8px;}
  .mission-org{font-size:12.5px; color:var(--text-muted); margin-bottom:4px; display:flex; align-items:center; gap:6px;}
  .mission-title{font-family:'IBM Plex Sans',sans-serif; font-weight:700; font-size:15.5px; line-height:1.3; margin-bottom:12px; color:var(--navy);}
  .mission-footer{font-family:'IBM Plex Mono',monospace; font-size:11.5px; display:flex; align-items:center; gap:6px;}

  .mission-card.locked{background:#FAFBFC;}
  .mission-card.locked .mission-title{color:var(--text-muted);}
  .mission-card.locked .mission-footer{color:var(--text-muted);}

  .mission-card.current{border-color:var(--primary); cursor:pointer; box-shadow:var(--glow-primary), var(--card-shadow); animation:pulse-border 2.6s ease-in-out infinite;}
  .mission-card.current .mission-footer{color:var(--primary-dark); font-weight:700;}
  .mission-card.current:hover{transform:translateY(-3px); box-shadow:var(--glow-primary), var(--card-shadow-hover);}
  @keyframes pulse-border{
    0%,100%{box-shadow:var(--glow-primary), var(--card-shadow);}
    50%{box-shadow:0 0 0 6px rgba(200,16,46,0.08), 0 0 26px -2px rgba(200,16,46,0.45), var(--card-shadow);}
  }
  .mission-card.done{border-color:var(--success);}
  .mission-card.done .mission-footer{color:var(--success); font-weight:700;}
  button.mission-card{font-family:inherit;}
  div.mission-card{cursor:default;}
  @media (prefers-reduced-motion: reduce){ .mission-card.current{animation:none;} }

  /* ---------- leaderboard ---------- */
  .board{margin-top:22px; background:var(--surface); border:1px solid var(--border); border-radius:14px; padding:16px 16px 12px; box-shadow:var(--card-shadow);}
  .board-row{display:grid; grid-template-columns:22px 1fr auto; gap:10px; align-items:center; padding:9px 0; border-bottom:1px solid var(--border);}
  .board-row:last-child{border-bottom:none;}
  .board-rank{font-family:'IBM Plex Mono',monospace; color:var(--text-muted); font-size:13px; font-variant-numeric:tabular-nums; font-weight:600;}
  .board-row.top .board-rank{color:var(--tab-4); font-weight:700;}
  .board-name{font-family:'IBM Plex Sans',sans-serif; font-weight:600; font-size:13.5px; display:flex; align-items:center; gap:8px; color:var(--navy);}
  .board-dot{width:9px; height:9px; border-radius:50%; background:var(--tab, var(--text-muted)); flex:0 0 auto;}
  .board-bar-wrap{grid-column:1/-1; height:6px; background:var(--locked-bg); border-radius:99px; overflow:hidden; margin-top:2px;}
  .board-bar{height:100%; background:var(--tab, var(--blue));}

    (groupRows||[]).forEach(function(row){

      showToast('Deine Anmeldung konnte auf diesem Gerät nicht zwischengespeichert werden.');
    }
  }

  var recentlyCompletedByMe = {};

  function subscribeRealtime(){
    if(!sb || !sb.channel) return;
    try{
      sb.channel('public:groups')
        .on('postgres_changes', {event:'*', schema:'public', table:'groups'}, handleRemoteGroupsChange)
        .subscribe();
      sb.channel('public:participants')
        .on('postgres_changes', {event:'*', schema:'public', table:'participants'}, handleRemoteParticipantsChange)
        .subscribe();
    }catch(e){ console.warn('Behördenrallye: Live-Verbindung konnte nicht aufgebaut werden.', e); }
  }

  function handleRemoteGroupsChange(payload){
    var row = payload.new;
    if(!row || !row.id) return;
    state.groupRows = (state.groupRows||[]).filter(function(r){ return r.id !== row.id; }).concat([row]);

    if(state.participant && state.participant.groupId === row.id){
      var oldProgress = state.groupProgress || {};
      var newlyDone = Object.keys(row.progress||{}).filter(function(k){ return row.progress[k] && !oldProgress[k]; });
      state.groupProgress = row.progress || {};
      newlyDone.forEach(function(stageId){
        if(recentlyCompletedByMe[stageId]) return;
        var stage = STAGES.filter(function(s){ return s.id === stageId; })[0];
        if(stage) showToast('⚡ Euer Team hat „' + stage.title + '" abgeschlossen!');
      });
    }

    state.groupsState = deriveGroupsState(state.groupRows, state.participantRows);
    cacheRemoteState({groups:state.groupRows, participants:state.participantRows});
    if(state.screen==='map' || state.screen==='finished' || state.screen==='select-group'){ render(); }
  }

  function handleRemoteParticipantsChange(payload){
    var row = payload.eventType === 'DELETE' ? payload.old : payload.new;
    if(!row) return;
    state.participantRows = (state.participantRows||[]).filter(function(r){ return r.id !== row.id; });
    if(payload.eventType !== 'DELETE'){ state.participantRows = state.participantRows.concat([row]); }
    state.groupsState = deriveGroupsState(state.groupRows, state.participantRows);
    cacheRemoteState({groups:state.groupRows, participants:state.participantRows});
    if(state.screen==='map' || state.screen==='finished' || state.screen==='select-group'){ render(); }
  }

  async function init(){
    sb = initSupabase();
    var p = await loadParticipant();
    await refreshGroupsState();
    if(p && p.groupId){
      state.participant = p;
      var myRow = state.groupRows.filter(function(r){ return r.id === p.groupId; })[0];
      state.groupProgress = myRow ? (myRow.progress || {}) : {};
      state.screen = 'map';
    } else {
      state.screen = 'intro';
    }
    render();
    subscribeRealtime();
    startPolling();
  }

  function startPolling(){
    setInterval(async function(){
      if(document.hidden) return;
      if(state.screen === 'map' || state.screen === 'finished' || state.screen === 'select-group'){
        await refreshGroupsState();
        render();
      }
    }, 15000);
  }

  function groupOccupancy(id){
    var g = state.groupsState[id];
    return g ? g.members.length : 0;
  }
  function groupPoints(id){
    var g = state.groupsState[id];
    return g ? g.points : 0;
  }

  async function handleJoin(groupId){
    state.error = null;
    var name = state.nameInput.trim();
    if(!name){ state.error = 'Bitte gib zuerst deinen Namen ein.'; render(); return; }
    if(!sb){
      state.error = 'Keine Verbindung zur Rallye-Datenbank. Bitte Internetverbindung prüfen und Seite neu laden.';
      render();
      return;
    }
    if(groupOccupancy(groupId) >= CAPACITY){
      state.error = 'Diese Gruppe ist gerade voll geworden. Wähle eine andere.';
      render();
      return;
    }

    state.joiningGroupId = groupId;
    render();

    var id = uid();
    var code = genRecoveryCode();
    var insertRes;
    try{
      insertRes = await sb.from('participants').insert({id:id, name:name, group_id:groupId, recovery_code:code}).select().single();
    }catch(e){
      insertRes = { error: e };
    }
    state.joiningGroupId = null;

    if(insertRes.error){
      var msg = String((insertRes.error && insertRes.error.message) || '');
      state.error = msg.indexOf('GROUP_FULL') !== -1
        ? 'Diese Gruppe ist gerade voll geworden. Wähle eine andere.'
        : 'Beitritt gerade nicht möglich. Bitte kurz erneut versuchen.';
      console.warn('Behördenrallye: Beitritt fehlgeschlagen.', insertRes.error);
      await refreshGroupsState();
      render();
      return;
    }

    var participant = {id:id, name:name, groupId:groupId, recoveryCode:code};
    await saveParticipant(participant);
    state.participant = participant;
    await refreshGroupsState();
    startCountdown();
  }

  async function handleRecover(){
    state.error = null;
    var code = (state.recoveryInput||'').trim().toUpperCase();
    if(!code){ state.error = 'Bitte gib deinen Code ein.'; render(); return; }
    if(!sb){ state.error = 'Keine Verbindung zur Rallye-Datenbank.'; render(); return; }
    var res;
    try{
      res = await sb.from('participants').select('*').eq('recovery_code', code).maybeSingle();
    }catch(e){
      res = { error: e };
    }
    if(res.error || !res.data){
      state.error = 'Code nicht gefunden. Bitte prüfen und erneut versuchen.';
      render();
      return;
    }
    var row = res.data;
    var participant = {id:row.id, name:row.name, groupId:row.group_id, recoveryCode:row.recovery_code};
    await saveParticipant(participant);
    state.participant = participant;
    await refreshGroupsState();
    state.screen = 'map';
    render();
  }

  function stageStatus(stageId, index){
    if(!state.participant) return 'locked';
    var progress = state.groupProgress || {};
    if(progress[stageId]) return 'done';
    var firstUndone = STAGES.findIndex(function(s){ return !progress[s.id]; });
    return index === firstUndone ? 'current' : 'locked';
  }

  function openQuiz(index){
    state.activeQuizIndex = index;
    state.quizSelectedOption = null;
    state.quizAnswered = false;
    render();
  }

  function closeQuiz(){
    state.activeQuizIndex = null;
    state.quizSelectedOption = null;
    state.quizAnswered = false;
    render();
  }

  async function selectOption(optIndex){
    if(state.quizAnswered) return;
    state.quizSelectedOption = optIndex;
    state.quizAnswered = true;
    render();

    var stage = STAGES[state.activeQuizIndex];
    var isCorrect = optIndex === stage.correct;

    if(isCorrect && !(state.groupProgress && state.groupProgress[stage.id])){
      state.groupProgress = Object.assign({}, state.groupProgress);
      state.groupProgress[stage.id] = true;
      recentlyCompletedByMe[stage.id] = Date.now();

      if(sb){
        try{
          var res = await sb.rpc('complete_stage', {p_group_id: state.participant.groupId, p_stage_id: stage.id});
          if(res.error){
            console.warn('Behördenrallye: Mission konnte nicht mit dem Team synchronisiert werden.', res.error);
            showToast('Deine Antwort wurde gewertet, ist aber gerade nicht mit dem Team synchronisiert.');
          } else if(res.data){
            state.groupProgress = res.data;
          }
        }catch(e){
          console.warn('Behördenrallye: Mission konnte nicht mit dem Team synchronisiert werden.', e);
          showToast('Deine Antwort wurde gewertet, ist aber gerade nicht mit dem Team synchronisiert.');
        }
      }
      await refreshGroupsState();

      showStampFx();

      var allDone = STAGES.every(function(s){ return state.groupProgress[s.id]; });
      if(allDone){
        setTimeout(function(){ state.screen = 'finished'; state.activeQuizIndex = null; render(); }, 900);
      }
    }
  }

  function showStampFx(){
    var fx = document.createElement('div');
    fx.className = 'stamp-fx';
    fx.innerHTML = '<div><div class="stamp-mark">GENEHMIGT</div><div class="xp-pop">+'+POINTS_PER_STAGE+' XP</div></div>';
    document.body.appendChild(fx);

  async function leaveGroup(){
    if(!confirm('Neu anmelden? Dein Name auf diesem Gerät geht verloren (dein Platz in der alten Gruppe bleibt belegt, ihr Team-Fortschritt bleibt erhalten). Mit deinem Code „'+((state.participant&&state.participant.recoveryCode)||'')+'" kannst du jederzeit zurückkehren.')) return;
    try{ localStorage.removeItem('behoerdenrallye:participant'); }catch(e){ console.warn('Behördenrallye: participant konnte nicht entfernt werden.', e); }
    stopMusic();
    state.participant = null;
    state.groupProgress = {};
    state.nameInput = '';
    state.screen = 'intro';
    render();

  /* ---------------- Musik-Playlist (rein prozedural erzeugt, keine
     externen Audiodateien / Lizenzfragen) ---------------- */
  var audioCtx = null;
  var masterGain = null;
  var musicMuted = false;
  try{ musicMuted = localStorage.getItem('behoerdenrallye:muted') === '1'; }catch(e){}
  var trackToken = 0;
  var currentTrackTimer = null;

  var PLAYLIST = [
    { name:'Amtsstunden-Shuffle', bpm:132, wave:'triangle', bass:'sine',
      melody:[0,-1,4,-1,7,4,-1,9,0,-1,4,-1,7,9,7,4] },
    { name:'Formular-Groove', bpm:118, wave:'square', bass:'sine',
      melody:[0,4,-1,7,0,4,-1,9,2,-1,7,4,-1,2,0,-1] },
    { name:'Stempel-Swing', bpm:150, wave:'sawtooth', bass:'triangle',
      melody:[0,-1,2,4,-1,7,-1,4,0,-1,2,-1,4,7,9,7] }
  ];

  function ensureAudio(){
    if(audioCtx) return audioCtx;
    try{
      var AC = window.AudioContext || window.webkitAudioContext;
      if(!AC) return null;
      audioCtx = new AC();
      masterGain = audioCtx.createGain();
      masterGain.gain.value = musicMuted ? 0 : 0.16;
      masterGain.connect(audioCtx.destination);
    }catch(e){ console.warn('Behördenrallye: Web Audio ist hier nicht verfügbar.', e); audioCtx = null; }
    return audioCtx;
  }

  function noteFreq(semitoneOffset){
    return 261.6 * Math.pow(2, semitoneOffset/12);
  }

  function pluck(freq, wave, duration, vol){
    if(!audioCtx || !masterGain) return;
    try{
      var osc = audioCtx.createOscillator();
      var g = audioCtx.createGain();
      osc.type = wave || 'sine';
      osc.frequency.value = freq;
      var t0 = audioCtx.currentTime;
      g.gain.setValueAtTime(0.0001, t0);
      g.gain.linearRampToValueAtTime(vol, t0+0.01);
      g.gain.exponentialRampToValueAtTime(0.001, t0+duration);
      osc.connect(g);
      g.connect(masterGain);
      osc.start(t0);
      osc.stop(t0+duration+0.05);
    }catch(e){ /* einzelner Ton fehlgeschlagen - Playlist läuft weiter */ }
  }

  function playTrack(track){
    if(!audioCtx) return;
    var myToken = ++trackToken;
    var stepDur = 60/track.bpm/2;
    var step = 0, loops = 0;

    function scheduleStep(){
      if(myToken !== trackToken) return;
      var deg = track.melody[step % track.melody.length];
      if(deg !== -1 && deg !== null){ pluck(noteFreq(deg), track.wave, stepDur*0.9, 0.5); }
      if(step % 4 === 0){ pluck(noteFreq(track.melody[0] - 12), track.bass, stepDur*1.8, 0.32); }
      step++;
      if(step % track.melody.length === 0){
        loops++;
        if(loops >= 4){
          currentTrackTimer = setTimeout(function(){ if(myToken===trackToken) playRandomTrack(); }, stepDur*1000);
          return;
        }
      }
      currentTrackTimer = setTimeout(scheduleStep, stepDur*1000);
    }
    scheduleStep();
  }

  function playRandomTrack(){
    var ctx = ensureAudio();
    if(!ctx) return;
    if(ctx.state === 'suspended'){ ctx.resume().catch(function(){}); }
    playTrack(PLAYLIST[Math.floor(Math.random()*PLAYLIST.length)]);
  }

  function stopMusic(){
    trackToken++;
    if(currentTrackTimer){ clearTimeout(currentTrackTimer); currentTrackTimer = null; }
  }

  function toggleMute(){
    musicMuted = !musicMuted;
    try{ localStorage.setItem('behoerdenrallye:muted', musicMuted?'1':'0'); }catch(e){}
    if(musicMuted){
      if(masterGain) masterGain.gain.value = 0;
    } else {
      ensureAudio();
      if(masterGain) masterGain.gain.value = 0.16;
      if(!currentTrackTimer){ playRandomTrack(); }
    }
    render();
  }

  function startCountdown(){
    state.screen = 'countdown';
    state.countdownNumber = 3;
    render();
    if(!musicMuted){ playRandomTrack(); }
    var iv = setInterval(function(){
      state.countdownNumber--;
      if(state.countdownNumber < 0){
        clearInterval(iv);
        state.screen = 'map';
        render();
        if(state.participant){ showToast('🔑 Dein Code: ' + state.participant.recoveryCode + ' — merk ihn dir für ein anderes Gerät.'); }
        return;
      }
      render();
    }, 850);
  }

  var toastTimer = null;
  function showToast(text){
    var old = document.getElementById('toast');
    if(old) old.remove();
    if(toastTimer) clearTimeout(toastTimer);
    var t = document.createElement('div');
    t.id = 'toast';
    t.className = 'toast';
    t.setAttribute('role','status');
    t.setAttribute('aria-live','polite');
    t.textContent = text;
    document.body.appendChild(t);
    toastTimer = setTimeout(function(){
      t.classList.add('fadeout');
      setTimeout(function(){ t.remove(); }, 320);
    }, 3400);
  }

  /* ---------------- Easter Eggs ----------------
     Rein kosmetisch, blockieren keine bestehende Funktion. */
  var EASTER_MESSAGES = [
    '📋 Antrag auf Sofortbearbeitung wurde abgelehnt. Bitte in 6–8 Wochen erneut versuchen.',
    '🖨️ Der Drucker im Nebenzimmer ist zuständig. Bitte dort anfragen.',
    '🐌 Ihr Vorgang wurde archiviert. Aktenzeichen: XY-ungelöst-0815.'
  ];
  var eggKeyBuffer = '';
  function handleEasterKeydown(e){
    if(e.ctrlKey || e.metaKey || e.altKey) return;
    var k = (e.key || '').toLowerCase();
    if(k.length !== 1) { eggKeyBuffer=''; return; }
    eggKeyBuffer = (eggKeyBuffer + k).slice(-3);
    if(eggKeyBuffer === 'amt'){
      eggKeyBuffer = '';
      showToast(EASTER_MESSAGES[Math.floor(Math.random()*EASTER_MESSAGES.length)]);
    }
  }

  var stampClickCount = 0;
  var stampClickTimer = null;
  function handleStampIconClick(){
    stampClickCount++;
    clearTimeout(stampClickTimer);
    stampClickTimer = setTimeout(function(){ stampClickCount = 0; }, 2500);
    if(stampClickCount >= 5){
      stampClickCount = 0;
      showToast('🕵️ Geheime Prüfstelle aktiviert: Ihre Geduld wurde amtlich als „vorbildlich" eingestuft.');

  var TAGLINE_ALTS = [
    'Amtlich anerkannt von niemandem',

  ];
  function handleEyebrowClick(e){
    var el = e.currentTarget;
    if(!el.dataset.original) el.dataset.original = el.textContent;
    el.textContent = TAGLINE_ALTS[Math.floor(Math.random()*TAGLINE_ALTS.length)];
    clearTimeout(el._resetTimer);
    el._resetTimer = setTimeout(function(){ el.textContent = el.dataset.original; }, 4000);
  }

  /* ---------------- render helpers ---------------- */

  function esc(s){
    return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  function btn(label, opts){
    opts = opts || {};
    var cls = 'btn' + (opts.cls ? ' '+opts.cls : '');
    var attrs = '';
    if(opts.id) attrs += ' id="'+opts.id+'"';
    if(opts.attrs) attrs += ' '+opts.attrs;
    return '<button type="button" class="'+cls+'"'+attrs+'><span class="blob"></span><span class="inner">'+label+'</span></button>';
  }

  function renderHeaderBar(){

  function renderGroupSelect(){

      var fillClass = full ? 'full' : pct>=90 ? 'high' : pct>=50 ? 'mid' : '';
      var tab = tabClass(i);
      var btnLabel = full ? 'Belegt' : isJoiningThis ? 'Wird angelegt…' : 'Dieser Gruppe beitreten';

  function renderBoard(){
    var rows = GROUPS.map(function(gr, i){ return {id:gr.id, name:gr.name, tab:tabClass(i), points:groupPoints(gr.id)}; });
    rows.sort(function(a,b){ return b.points - a.points; });
    var maxPts = Math.max(1, rows[0].points);
    var mine = state.participant ? state.participant.groupId : null;

    var rowsHtml = rows.map(function(r, i){
      var pct = Math.round(r.points / maxPts * 100);
      return ''+
      '<div class="board-row '+r.tab+(i<3?' top':'')+(r.id===mine?' mine':'')+'">'+
        '<div class="board-rank">'+(i+1)+'.</div>'+
        '<div class="board-name"><span class="board-dot"></span>'+esc(r.name)+(r.id===mine?' <span style="font-size:10px;">(du)</span>':'')+'</div>'+
        '<div class="board-points">'+r.points+'</div>'+
        '<div class="board-bar-wrap"><div class="board-bar" style="width:'+pct+'%"></div></div>'+
      '</div>';
    }).join('');

    return '<div class="board" id="liveBoard"><div class="eyebrow" style="margin-bottom:8px;">Rangliste · live</div>'+rowsHtml+'</div>';
  }

  function renderMap(){
    var p = state.participant;
    var groupIdx = GROUPS.findIndex(function(g){ return g.id === p.groupId; });
    var groupDef = GROUPS[groupIdx];
    var myPoints = groupPoints(p.groupId);
    var progress = state.groupProgress || {};
    var doneCount = STAGES.filter(function(s){ return progress[s.id]; }).length;
    var donePct = Math.round(doneCount/STAGES.length*100);

    var cards = STAGES.map(function(s, i){
      var status = stageStatus(s.id, i);
      var tag = status === 'current' ? 'button' : 'div';
      var clickAttr = status === 'current' ? ' data-stage="'+i+'"' : '';
      var statusIcon = status === 'done' ? 'check' : status === 'current' ? 'bolt' : 'lock';
      var statusLabel = status === 'done' ? 'Abgeschlossen' : status === 'current' ? 'Aktiv' : 'Gesperrt';
      var footer = status === 'done' ? icon('star')+'<span>Bearbeitet · +'+POINTS_PER_STAGE+' XP</span>' :
                status === 'current' ? '<span>Fallakte bearbeiten →</span>' :
                '<span>Erst vorherige Fallakte abschließen</span>';
      var ariaLabel = status === 'current' ? ' aria-label="Fallakte '+(i+1)+' bearbeiten: '+esc(s.title)+'"' :
                       status === 'done' ? ' aria-label="Fallakte '+(i+1)+' abgeschlossen: '+esc(s.title)+'"' :
                       ' aria-label="Fallakte '+(i+1)+' gesperrt: '+esc(s.title)+'"';
      return ''+
      '<'+tag+' class="mission-card '+status+'" style="--i:'+i+'"'+clickAttr+ariaLabel+'>'+
        '<div class="mission-card-head">'+
          '<span class="mission-num">Fallakte Nr. '+String(i+1).padStart(2,'0')+'</span>'+
          '<span class="status-badge '+status+'">'+icon(statusIcon)+'<span>'+statusLabel+'</span></span>'+
        '</div>'+
        '<div class="mission-org">'+s.icon+' '+esc(s.amt)+'</div>'+
        '<div class="mission-title">'+esc(s.title)+'</div>'+
        '<div class="mission-footer">'+footer+'</div>'+
      '</'+tag+'>';
    }).join('');

    return ''+
    renderOfflineBanner()+
    '<div class="progress-panel">'+
      '<div class="progress-head">'+
        '<span class="eyebrow">Rallye-Fortschritt · ganzes Team</span>'+
        '<div class="who">Team: <b class="'+tabClass(groupIdx)+'" style="color:var(--tab)">'+esc(groupDef.name)+'</b></div>'+
      '</div>'+
      '<div class="progress-bar-track" role="progressbar" aria-valuenow="'+doneCount+'" aria-valuemin="0" aria-valuemax="'+STAGES.length+'" aria-label="Rallye-Fortschritt">'+
        '<div class="progress-bar-fill" style="width:'+donePct+'%"></div>'+
      '</div>'+
      '<div class="progress-stats">'+
        '<span class="progress-fraction">'+doneCount+' / '+STAGES.length+' Fallakten bearbeitet</span>'+
        '<div class="progress-meta">'+
          '<span class="stat-chip" id="myGroupPoints">'+icon('star')+'<span>'+myPoints+' Punkte</span></span>'+
          '<span class="stat-chip">'+icon('trophy')+'<span>'+esc(rankForPoints(myPoints))+'</span></span>'+
          '<span class="stat-chip" title="Merk dir diesen Code, um auf einem anderen Gerät weiterzumachen">'+icon('key')+'<span>'+esc(p.recoveryCode||'')+'</span></span>'+
        '</div>'+
      '</div>'+
    '</div>'+
    (state.boardOpen ? renderBoard() : '')+
    '<div class="missions-head">'+
      '<span class="eyebrow">Team '+esc(groupDef.name)+'s Fallakten</span>'+
      '<h2>Eure Vorgänge</h2>'+
      '<p class="muted" style="font-size:13.5px; margin:0;">Jede Fallakte gilt fürs ganze Team – wer zuerst antwortet, entsperrt die nächste für alle.</p>'+
    '</div>'+
    '<div class="mission-grid">'+cards+'</div>';
  }

  function renderQuiz(){
    var i = state.activeQuizIndex;
    var s = STAGES[i];
    var optsHtml = s.options.map(function(opt, idx){
      var cls = 'option';
      if(state.quizAnswered){
        if(idx === s.correct) cls += ' correct';
        else if(idx === state.quizSelectedOption) cls += ' wrong';
      }
      return '<button class="'+cls+'" data-opt="'+idx+'" '+(state.quizAnswered?'disabled':'')+'>'+esc(opt)+'</button>';
    }).join('');

    var isCorrect = state.quizAnswered && state.quizSelectedOption === s.correct;
    var feedback = '';
    if(state.quizAnswered){
      feedback = '<div class="feedback '+(isCorrect?'correct':'wrong')+'">'+
        (isCorrect ? esc(s.explanation) : 'Nicht ganz. Schau dir die richtige Antwort oben an und versuch die nächste Etappe!')+
      '</div>';
    }

    var actionBtn = isCorrect
      ? btn('Weiter zur Karte →', {id:'quizContinueBtn'})
      : (state.quizAnswered ? btn('Nochmal versuchen', {id:'quizRetryBtn'}) : '');

    return ''+
    '<div class="overlay" id="quizOverlay">'+
      '<div class="quiz-card" role="dialog" aria-modal="true" aria-labelledby="quizQuestion">'+
        '<button class="close-x" id="quizCloseBtn" aria-label="Quiz schließen">'+icon('close')+'</button>'+
        '<div class="quiz-amt">'+s.icon+' Station '+(i+1)+' · '+esc(s.amt)+'</div>'+
        '<div class="quiz-question" id="quizQuestion">'+esc(s.question)+'</div>'+
        '<div class="options">'+optsHtml+'</div>'+
        feedback+
        '<div class="quiz-actions">'+actionBtn+'</div>'+
      '</div>'+
    '</div>';
  }

  function renderFinished(){
    var p = state.participant;
    var groupIdx = GROUPS.findIndex(function(g){ return g.id === p.groupId; });
    var groupDef = GROUPS[groupIdx];
    var myPoints = groupPoints(p.groupId);
    return ''+
    renderOfflineBanner()+
    '<div class="finished-card">'+
      '<div class="stamp-mark">'+icon('check')+'<span>Rallye abgeschlossen</span></div>'+
      '<h2>Gut gemacht, '+esc(p.name)+'!</h2>'+
      '<p>Euer Team <b class="'+tabClass(groupIdx)+'" style="color:var(--tab)">'+esc(groupDef.name)+'</b> hat alle 7 Fallakten bearbeitet und '+POINTS_PER_STAGE*7+' Punkte gesammelt.</p>'+
      '<div class="hero-stats" style="margin-top:4px;">'+
        '<span class="hero-stat">'+icon('star')+'<span>'+myPoints+' Punkte</span></span>'+
        '<span class="hero-stat">'+icon('trophy')+'<span>'+esc(rankForPoints(myPoints))+'</span></span>'+
      '</div>'+
    '</div>'+
    (state.boardOpen ? renderBoard() : '');
  }

  function renderCountdown(){
    var groupDef = GROUPS.filter(function(g){ return g.id === state.participant.groupId; })[0];
    var n = state.countdownNumber;
    var label = n > 0 ? String(n) : 'LOS!';
    return ''+
    '<div class="countdown-screen">'+
      '<div class="countdown-card">'+
        '<div class="countdown-label">Eure Mission beginnt in</div>'+
        '<div class="countdown-number">'+label+'</div>'+
        '<div class="countdown-team">Team <b>'+esc(groupDef.name)+'</b> ist bereit.</div>'+
      '</div>'+
    '</div>';
  }

  function render(){
    var html = '';
    if(state.screen === 'intro') html = renderIntro();
    else if(state.screen === 'select-group') html = renderGroupSelect();
    else if(state.screen === 'countdown') html = renderCountdown();
    else if(state.screen === 'map') html = renderMap();
    else if(state.screen === 'finished') html = renderFinished();
    else html = '<div class="boot-screen"><div class="boot-text">Rallye-System wird initialisiert<span class="boot-dots"></span></div></div>';

    var quizHtml = state.activeQuizIndex !== null ? renderQuiz() : '';

    app.innerHTML = '<div class="screen">'+html+renderDisclaimer()+'</div>'+quizHtml;
    attachListeners();

    var topbar = document.getElementById('topbar');
    if(topbar){ topbar.innerHTML = renderHeaderBar(); attachHeaderListeners(); }
  }

  function attachHeaderListeners(){
    var menuBtn = document.getElementById('menuBtn');
    if(menuBtn) menuBtn.addEventListener('click', function(){ state.menuOpen = !state.menuOpen; render(); });

    var menuToggleBoard = document.getElementById('menuToggleBoard');
    if(menuToggleBoard) menuToggleBoard.addEventListener('click', async function(){
      state.boardOpen = !state.boardOpen;
      state.menuOpen = false;
      if(state.boardOpen){ await refreshGroupsState(); }
      render();
    });

    var menuToggleMute = document.getElementById('menuToggleMute');
    if(menuToggleMute) menuToggleMute.addEventListener('click', function(){ state.menuOpen = false; toggleMute(); });

    var menuLeave = document.getElementById('menuLeave');
    if(menuLeave) menuLeave.addEventListener('click', function(){ state.menuOpen = false; leaveGroup(); });

    document.querySelectorAll('#topbar .egg-stamp').forEach(function(el){
      el.addEventListener('click', handleStampIconClick);
    });
  }

  function attachListeners(){
    var nameField = document.getElementById('nameField');
    if(nameField){
      nameField.addEventListener('input', function(e){ state.nameInput = e.target.value; });
      nameField.addEventListener('keydown', function(e){ if(e.key==='Enter'){ goToGroups(); } });
    }
    var toGroupsBtn = document.getElementById('toGroupsBtn');
    if(toGroupsBtn) toGroupsBtn.addEventListener('click', goToGroups);

    var backBtn = document.getElementById('backToIntroBtn');
    if(backBtn) backBtn.addEventListener('click', function(){ state.screen='intro'; state.error=null; render(); });

    document.querySelectorAll('[data-join]').forEach(function(btn){
      btn.addEventListener('click', function(){
        ensureAudio(); // AudioContext muss synchron im Klick-Handler starten (Autoplay-Regeln)
        handleJoin(btn.getAttribute('data-join'));
      });
    });

    var recoveryField = document.getElementById('recoveryField');
    if(recoveryField){
      recoveryField.addEventListener('input', function(e){ state.recoveryInput = e.target.value; });
      recoveryField.addEventListener('keydown', function(e){ if(e.key==='Enter'){ handleRecover(); } });
    }
    var recoverBtn = document.getElementById('recoverBtn');
    if(recoverBtn) recoverBtn.addEventListener('click', handleRecover);

    document.querySelectorAll('[data-stage]').forEach(function(btn){
      btn.addEventListener('click', function(){ openQuiz(parseInt(btn.getAttribute('data-stage'),10)); });
    });

    document.querySelectorAll('[data-opt]').forEach(function(btn){
      btn.addEventListener('click', function(){ selectOption(parseInt(btn.getAttribute('data-opt'),10)); });
    });

    document.querySelectorAll('.egg-eyebrow').forEach(function(el){
      el.addEventListener('click', handleEyebrowClick);
    });

    var quizClose = document.getElementById('quizCloseBtn');
    if(quizClose) quizClose.addEventListener('click', closeQuiz);
    var quizOverlay = document.getElementById('quizOverlay');
    if(quizOverlay) quizOverlay.addEventListener('click', function(e){ if(e.target === quizOverlay) closeQuiz(); });
    var quizContinue = document.getElementById('quizContinueBtn');
    if(quizContinue) quizContinue.addEventListener('click', closeQuiz);
    var quizRetry = document.getElementById('quizRetryBtn');
    if(quizRetry) quizRetry.addEventListener('click', function(){ state.quizAnswered=false; state.quizSelectedOption=null; render(); });
  }

  function goToGroups(){
    state.error = null;
    if(!state.nameInput.trim()){ state.error = 'Bitte gib zuerst deinen Namen ein.'; render(); return; }
    state.screen = 'select-group';
    render();
  }

  document.addEventListener('keydown', function(e){
    handleEasterKeydown(e);
    if(e.key === 'Escape' && state.activeQuizIndex !== null){ closeQuiz(); return; }
    if(e.key === 'Escape' && state.menuOpen){ state.menuOpen = false; render(); }
  });

  init();
})();
</script>
</body>
</html>
